        } else {
          await App.Store.createObjective(patch);
          App.UI.Toast.show("Objetivo criado.", "success");
        }
        App.UI.Modal.close();
        renderView();
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível salvar o objetivo.", "error");
      }
    },
    confirmDeleteObjective(el) {
      pendingDeleteObjectiveId = el.dataset.objectiveId;
      App.UI.confirmDialog({
        title: "Excluir objetivo?",
        message: "As metas ligadas a ele continuam existindo, só passam a aparecer sem objetivo. Não é possível desfazer.",
        confirmLabel: "Excluir",
        danger: true,
        onConfirmAction: "deleteObjectiveConfirmed",
      });
    },
    async deleteObjectiveConfirmed() {
      App.UI.Modal.close();
      const id = pendingDeleteObjectiveId;
      pendingDeleteObjectiveId = null;
      if (!id) return;
      try {
        await App.Store.deleteObjective(id);
        App.UI.Toast.show("Objetivo excluído.", "success");
        renderView();
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível excluir o objetivo.", "error");
      }
    },

    /* ---------------------------------------------------------------- *
     * FASE 5 — EVOLUÇÃO
     * ---------------------------------------------------------------- */

    evoSetSubview(el) {
      App.Views.evoState.subview = el.dataset.subview;
      renderView();
    },
    evoSetPeriod(el) {
      App.Views.evoState.period = Number(el.dataset.period);
      renderView();
    },

    // Check-in noturno (item 4): mesmo formulário serve pra criar e pra
    // editar o check-in de hoje (upsert em App.Store.saveNightlyCheckin) —
    // sem isso, reabrir o check-in do mesmo dia criaria um segundo registro.
    openNightlyCheckinModal() {
      const today = App.Utils.todayISO();
      const checkin = App.Selectors.getNightlyCheckin(today);
      App.UI.Modal.open({
        title: "Check-in noturno",
        body: App.UI.nightlyCheckinForm(checkin),
        actionsHtml: `
          ${App.UI.button({ label: "Cancelar", variant: "ghost", action: "modalClose" })}
          ${App.UI.button({ label: "Salvar", variant: "primary", action: "saveNightlyCheckinForm" })}
        `,
      });
    },
    async saveNightlyCheckinForm() {
      const readScale = (name) => {
        const el = document.querySelector(`input[name="${name}"]:checked`);
        return el ? Number(el.value) : null;
      };
      const difficultyEl = document.querySelector('input[name="checkinDifficulty"]:checked');
      const fields = {
        energy: readScale("checkinEnergy"),
        focus: readScale("checkinFocus"),
        mood: readScale("checkinMood"),
        stress: readScale("checkinStress"),
        mainDifficulty: difficultyEl ? difficultyEl.value : null,
        notes: document.getElementById("checkinNotes").value.trim(),
      };
      try {
        await App.Store.saveNightlyCheckin(App.Utils.todayISO(), fields);
        App.UI.Modal.close();
        App.UI.Toast.show("Check-in registrado.", "success");
        renderView();
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível salvar o check-in.", "error");
      }
    },

    /* ---- Diário (item 6) ---- */
    openJournalFormModal(el) {
      const entryId = el && el.dataset ? el.dataset.entryId : null;
      const entry = entryId ? App.Store.getById("journalEntries", entryId) : null;
      App.UI.Modal.open({
        title: entry ? "Editar entrada" : "Nova entrada de diário",
        body: App.UI.journalForm(entry),
        actionsHtml: `
          ${entry ? `<span style="margin-right:auto;">${App.UI.button({ label: "Excluir", variant: "danger", size: "sm", iconName: "trash", action: "confirmDeleteJournal", data: { entryId: entry.id } })}</span>` : ""}
          ${App.UI.button({ label: "Cancelar", variant: "ghost", action: "modalClose" })}
          ${App.UI.button({ label: "Salvar", variant: "primary", action: "saveJournalForm" })}
        `,
      });
    },
    async saveJournalForm() {
      const date = document.getElementById("journalDate").value || App.Utils.todayISO();
      const patch = {
        date,
        content: document.getElementById("journalContent").value.trim(),
        win: document.getElementById("journalWin").value.trim(),
        difficulty: document.getElementById("journalDifficulty").value.trim(),
        learning: document.getElementById("journalLearning").value.trim(),
      };
      const idEl = document.getElementById("journalId");
      const entryId = idEl ? idEl.value : "";
      try {
        if (entryId) {
          await App.Store.updateJournalEntry(entryId, patch);
          App.UI.Toast.show("Entrada atualizada.", "success");
        } else {
          await App.Store.createJournalEntry(patch);
          App.UI.Toast.show("Entrada salva.", "success");
        }
        App.UI.Modal.close();
        renderView();
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível salvar a entrada.", "error");
      }
    },
    confirmDeleteJournal(el) {
      pendingDeleteJournalId = el.dataset.entryId;
      App.UI.confirmDialog({
        title: "Excluir entrada?",
        message: "Essa ação remove a entrada de diário permanentemente. Não é possível desfazer.",
        confirmLabel: "Excluir",
        danger: true,
        onConfirmAction: "deleteJournalConfirmed",
      });
    },
    async deleteJournalConfirmed() {
      App.UI.Modal.close();
      const id = pendingDeleteJournalId;
      pendingDeleteJournalId = null;
      if (!id) return;
      try {
        await App.Store.deleteJournalEntry(id);
        App.UI.Toast.show("Entrada excluída.", "success");
        renderView();
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível excluir a entrada.", "error");
      }
    },

    /* ---------------------------------------------------------------- *
     * FASE 6 — MOTOR DE INTELIGÊNCIA LOCAL
     * ---------------------------------------------------------------- */

    // Dispensar (item 1: "evitar repetir o mesmo insight excessivamente")
    // — some da lista ativa; a regra que o gerou só volta a produzir um
    // novo registro depois do próprio cooldown dela.
    async dismissInsight(el) {
      const id = el.dataset.insightId;
      if (!id) return;
      try {
        await App.Insights.dismiss(id);
        renderView();
      } catch (err) {
        console.error(err);
      }
    },
    // Sugestões que apontam pra uma tarefa específica: pulam pra Planejamento
    // já no dia certo (mesmo padrão de metaGoToTask), nunca só re-renderizam
    // a página atual — o insight pode ter sido gerado em Hoje ou Evolução.
    insightGoToTask(el) {
      const dueDate = el.dataset.dueDate;
      App.Views.planState.mode = "timeline";
      App.Views.planState.date = dueDate || App.Utils.todayISO();
      App.Router.goTo("planejamento");
    },
    // Sugestões sobre um hábito específico: mesmo padrão de metaGoToHabit.
    insightGoToHabit(el) {
      App.Views.habitState.selectedHabitId = el.dataset.habitId;
      App.Router.goTo("habitos");
    },
    // Sugestão de "sobrecarga": manda direto pro modo "Prepare amanhã".
    insightGoToTomorrow() {
      App.Views.planState.mode = "amanha";
      App.Router.goTo("planejamento");
    },
  };

  // Guarda transitória entre abrir a confirmação de arquivamento e o
  // clique em "Arquivar" — mesmo mecanismo de pendingDeleteTaskId acima.
  let pendingArchiveHabitId = null;

  // Guarda transitória entre abrir o modal de confirmação de exclusão e o
  // clique em "Excluir" — confirmDialog não repassa dados extras sozinho.
  let pendingDeleteTaskId = null;

  // Mesmo mecanismo, agora para exclusão de meta e de objetivo (Fase 4).
  let pendingDeleteGoalId = null;
  let pendingDeleteObjectiveId = null;

  // Mesmo mecanismo, agora para exclusão de entrada de diário (Fase 5).
  let pendingDeleteJournalId = null;

  // Arquivo escolhido no <input type="file"> de importação (Fase 7),
  // guardado entre a escolha do arquivo e a confirmação do diálogo — mesmo
  // mecanismo transitório de pendingDelete*Id acima.
  let pendingImportFile = null;

  function wireDelegation() {
    document.addEventListener("click", (evt) => {
      const el = evt.target.closest("[data-action]");
      if (!el) return;
      const actionName = el.dataset.action;
      const fn = Actions[actionName];
      if (typeof fn === "function") fn(el, evt);
    });

    // blur não borbulha (bubbles: false) — precisa de captura para
    // delegação funcionar em qualquer campo com data-action-blur.
    document.addEventListener(
      "blur",
      (evt) => {
        const el = evt.target.closest && evt.target.closest("[data-action-blur]");
        if (!el) return;
        const fn = Actions[el.dataset.actionBlur];
        if (typeof fn === "function") fn(el, evt);
      },
      true
    );

    // change (Fase 7): só o <input type="file"> de importação usa isso por
    // enquanto — mesmo padrão de delegação de data-action-blur, pra não
    // precisar reanexar listener toda vez que a view de Ajustes re-renderiza.
    document.addEventListener("change", (evt) => {
      const el = evt.target.closest && evt.target.closest("[data-action-change]");
      if (!el) return;
      const fn = Actions[el.dataset.actionChange];
      if (typeof fn === "function") fn(el, evt);
    });
  }

  /* ---------------------------------------------------------------- *
   * BOOTSTRAP
   * ---------------------------------------------------------------- */
  async function boot() {
    // 1) Tema aplicado imediatamente (evita flash de tema errado enquanto
    //    o banco ainda está abrindo).
    App.Theme.init();

    // 2) Banco + estado em memória.
    await App.Store.initAll();

    // 3) Garante que sempre existe um registro de configurações.
    if (!App.Store.getById("settings", "app")) {
      await App.Store.add("settings", App.Models.defaultSettings());
    }

    // 3b) Tarefas pendentes com prazo vencido viram 'atrasada' — assim elas
    // continuam visíveis em Hoje em vez de somem silenciosamente.
    await App.Store.syncOverdueTasks();

    // 3c) Ocorrências de tarefas recorrentes (Fase 2) para hoje e amanhã —
    // as duas únicas datas que Hoje e Planejamento mostram por padrão.
    const todayISO = App.Utils.todayISO();
    await App.Store.ensureRecurrenceInstancesForDate(todayISO);
    await App.Store.ensureRecurrenceInstancesForDate(App.Selectors.tomorrowISO(todayISO));

    // 3d) Conquistas (Fase 5): reavalia no boot — cobre tanto progresso feito
    // fora do app (ex.: dado importado) quanto o primeiro carregamento dos
    // exemplos, sem depender só dos hooks nas ações que mudam estado.
    await App.Store.syncAchievements();

    // 4) Navegação.
    App.Router.subscribe(renderView);
    App.Router.init();

    // 5) UI de tema + delegação de eventos.
    renderThemeToggleIcon();
    wireDelegation();

    document.getElementById("themeToggleBtn").addEventListener("click", () => Actions.toggleThemeQuick());

    // 6) A tela Hoje depende do relógio (Foco Agora, saudação) — re-renderiza
    // sozinha a cada minuto enquanto estiver em foco, sem exigir refresh.
    setInterval(() => {
      if (App.Router.current === "hoje") renderView();
    }, 60000);
  }

  document.addEventListener("DOMContentLoaded", () => {
    boot().catch((err) => {
      console.error("[App] falha ao iniciar", err);
      const container = document.getElementById("viewContainer");
      if (container) {
        container.innerHTML = `<div class="card" style="max-width:520px;margin-top:24px;">
          <h2 style="margin-bottom:8px;">Não foi possível iniciar o app</h2>
          <p class="text-secondary" style="font-size:13px;line-height:1.6;">Tente recarregar a página. Se o problema persistir, o armazenamento local do navegador pode estar bloqueado.</p>
        </div>`;
      }
    });
  });
})(window);

</script>
</body>
</html>
