/* ==========================================================================
   INSIGHTS — Motor de Inteligência Local (Fase 6)
   ==========================================================================
   Tudo aqui roda 100% no navegador, só com o que já está armazenado
   localmente (IndexedDB/localStorage via App.Store/App.Selectors). Sem
   OpenAI, sem Claude, sem qualquer API paga ou dependência de rede — o
   briefing é explícito sobre isso: "Tudo deve funcionar localmente com
   JavaScript" e "Nenhum dado deve sair do navegador". Este arquivo nunca
   chama fetch/XHR, e não deveria precisar.

   ARQUITETURA (item 7 — extensível sem reescrever o sistema):
   - Cada regra é um objeto { id, cooldownDays?, evaluate(ctx) } registrado
     via registerRule(). evaluate() lê o contexto (Store/Selectors já
     carregados) e devolve null, um candidato, ou uma lista de candidatos
     { message, severity, relevance, dedupeKey?, relatedEntity?, suggestion? }.
   - refresh() roda todas as regras, e persiste cada candidato como um
     registro em `insights` (store já existente desde a Fase 0), mas só
     quando não há um insight do MESMO dedupeKey gerado dentro da janela de
     cooldown da regra — é isso que evita repetir o mesmo insight toda hora.
   - Novas regras futuras só precisam chamar registerRule(); nada mais no
     motor muda.

   Também mora aqui o banco local de frases motivacionais (item 5), com a
   mesma filosofia: nada de IA, só um banco de frases + seleção
   determinística por contexto e data (mesmo princípio de App.Selectors.
   getDayPhrase, já usado desde a Fase 1).
   ========================================================================== */
window.App = window.App || {};

(function (global) {
  "use strict";

  /* ------------------------------------------------------------------ *
   * MOTOR DE REGRAS
   * ------------------------------------------------------------------ */
  const RULES = [];
  const DEFAULT_COOLDOWN_DAYS = 5;

  function registerRule(rule) {
    if (!rule || typeof rule.evaluate !== "function" || !rule.id) {
      console.error("[App.Insights] regra inválida — precisa de {id, evaluate()}.", rule);
      return;
    }
    RULES.push(rule);
  }

  function buildContext() {
    const Sel = global.App.Selectors;
    const Store = global.App.Store;
    return { Sel, Store, Utils: global.App.Utils, today: global.App.Utils.todayISO() };
  }

  // Dedup + cooldown: um candidato só vira um NOVO registro em `insights`
  // se não existir um registro do mesmo dedupeKey ainda dentro da janela
  // de cooldown da regra (padrão 5 dias, cada regra pode sobrescrever via
  // `cooldownDays`). Já existente e ainda "fresco" -> ignorado. Já existente
  // mas fora da janela -> gera um novo registro (a mensagem pode ter
  // números diferentes agora), sem apagar o histórico anterior.
  async function persistCandidate(candidate, existingByKey) {
    const Store = global.App.Store;
    const Sel = global.App.Selectors;
    const dedupeKey = candidate.dedupeKey || candidate.ruleId;
    const cooldownDays = typeof candidate.cooldownDays === "number" ? candidate.cooldownDays : DEFAULT_COOLDOWN_DAYS;
    const prior = (existingByKey[dedupeKey] || []).slice().sort((a, b) => (b.generatedAt || "").localeCompare(a.generatedAt || ""));
    const last = prior[0];
    if (last) {
      const daysSinceLast = Sel.daysSinceISO((last.generatedAt || last.createdAt || "").slice(0, 10));
      if (daysSinceLast < cooldownDays) return null; // ainda "fresco" — não repete
    }
    const insight = global.App.Models.createInsight({
      type: dedupeKey,
      message: candidate.message,
      severity: candidate.severity || "info",
      relatedEntity: candidate.relatedEntity || null,
      relevance: typeof candidate.relevance === "number" ? candidate.relevance : 2,
      suggestion: candidate.suggestion || null,
    });
    await Store.add("insights", insight);
    return insight;
  }

  async function refresh() {
    const ctx = buildContext();
    const existing = ctx.Store.getAll("insights");
    const existingByKey = {};
    existing.forEach((i) => {
      (existingByKey[i.type] = existingByKey[i.type] || []).push(i);
    });

    for (const rule of RULES) {
      let result;
      try {
        result = rule.evaluate(ctx);
      } catch (err) {
        console.error("[App.Insights] regra falhou:", rule.id, err);
        continue;
      }
      if (!result) continue;
      const items = Array.isArray(result) ? result : [result];
      for (const item of items) {
        if (!item || !item.message) continue;
        const candidate = Object.assign({ ruleId: rule.id, cooldownDays: rule.cooldownDays }, item);
        const created = await persistCandidate(candidate, existingByKey);
        if (created) {
          (existingByKey[created.type] = existingByKey[created.type] || []).push(created);
        }
      }
    }
  }

  // Insights ativos (não descartados), ordenados por relevância e depois
  // por mais recente — é o que Hoje/Evolução renderizam.
  function getActive(opts) {
    opts = opts || {};
    const limit = opts.limit || 6;
    const all = global.App.Store.getAll("insights").filter((i) => !i.dismissed);
    return all
      .slice()
      .sort((a, b) => (b.relevance || 0) - (a.relevance || 0) || (b.generatedAt || "").localeCompare(a.generatedAt || ""))
      .slice(0, limit);
  }

  async function dismiss(insightId) {
    const Store = global.App.Store;
    const insight = Store.getById("insights", insightId);
    if (!insight) return null;
    return Store.update("insights", Object.assign({}, insight, { dismissed: true }));
  }

  /* ------------------------------------------------------------------ *
   * REGRAS — exemplos do briefing (item 2) + as 5 comparações pedidas
   * (item 3), reaproveitando ao máximo o que a Fase 5 já calcula.
   * ------------------------------------------------------------------ */

  // Migra a heurística "Hoje" da Fase 1 (App.Selectors.getInsights) pro
  // motor formal, em vez de manter os dois sistemas em paralelo. Cooldown
  // curto (1 dia): é conteúdo do PRÓPRIO dia, então cada dia novo substitui
  // o anterior naturalmente, sem acumular ruído.
  registerRule({
    id: "hoje_heuristicas",
    cooldownDays: 1,
    evaluate(ctx) {
      const raw = ctx.Sel.getInsights(ctx.today);
      return raw.map((message, idx) => ({
        message,
        severity: "info",
        relevance: 1,
        dedupeKey: "hoje_heuristica_" + idx,
        cooldownDays: 1,
      }));
    },
  });

  // Comparação: esta semana × semana anterior.
  registerRule({
    id: "comparacao_semana",
    cooldownDays: 6,
    evaluate(ctx) {
      const e7 = ctx.Sel.computeExecucao(7);
      if (e7.trend === null || e7.value === null || Math.abs(e7.trend) < 8) return null;
      const dir = e7.trend > 0 ? "acima" : "abaixo";
      return {
        message: `Sua execução dos últimos 7 dias está ${Math.abs(e7.trend)} pontos ${dir} da semana anterior (${e7.value}% no período atual).`,
        severity: e7.trend > 0 ? "positivo" : "atencao",
        relevance: 2,
        dedupeKey: "comparacao_semana",
      };
    },
  });

  // Comparação: mês × mês anterior.
  registerRule({
    id: "comparacao_mes",
    cooldownDays: 20,
    evaluate(ctx) {
      const e30 = ctx.Sel.computeExecucao(30);
      if (e30.trend === null || e30.value === null || Math.abs(e30.trend) < 8) return null;
      const dir = e30.trend > 0 ? "acima" : "abaixo";
      return {
        message: `Sua execução dos últimos 30 dias está ${Math.abs(e30.trend)} pontos ${dir} do mês anterior (${e30.value}% no período atual).`,
        severity: e30.trend > 0 ? "positivo" : "atencao",
        relevance: 2,
        dedupeKey: "comparacao_mes",
      };
    },
  });

  // Comparação: execução × planejamento (diferença entre o que foi
  // planejado com antecedência e o que de fato foi executado).
  registerRule({
    id: "execucao_vs_planejamento",
    cooldownDays: 10,
    evaluate(ctx) {
      const p30 = ctx.Sel.computePlanejamento(30);
      if (p30.value === null || p30.value >= 75) return null;
      return {
        message: `Do que você planejou com antecedência nos últimos 30 dias, só ${p30.value}% foi executado no prazo — talvez valha revisar o volume do que entra no planejamento.`,
        severity: "atencao",
        relevance: 2,
        dedupeKey: "execucao_vs_planejamento",
        suggestion: { label: "Ver Planejamento", action: "navigate", data: { route: "planejamento" } },
      };
    },
  });

  // Consistência: se houve melhora real em relação ao período anterior.
  registerRule({
    id: "consistencia_melhorou",
    cooldownDays: 10,
    evaluate(ctx) {
      const c = ctx.Sel.computeConsistencia(30);
      if (c.value === null || c.trend === null || c.trend < 10) return null;
      return {
        message: `Sua consistência aumentou ${c.trend} pontos em relação ao período anterior (${c.value}% nos últimos 30 dias).`,
        severity: "positivo",
        relevance: 2,
        dedupeKey: "consistencia_melhorou",
      };
    },
  });

  // Execução por horário: compara o % de conclusão entre tarefas com
  // horário pela manhã/tarde/noite nos últimos 30 dias.
  registerRule({
    id: "execucao_por_horario",
    cooldownDays: 14,
    evaluate(ctx) {
      const Store = ctx.Store;
      const since = ctx.Sel.shiftDateISO(ctx.today, -29);
      const tasks = Store.getAll("tasks").filter((t) => t.startTime && t.dueDate >= since && t.dueDate <= ctx.today && t.status !== "pulada");
      if (tasks.length < 6) return null;
      function bucketOf(t) {
        const hour = parseInt(t.startTime.slice(0, 2), 10);
        if (hour < 12) return "manha";
        if (hour < 18) return "tarde";
        return "noite";
      }
      const buckets = {};
      tasks.forEach((t) => {
        const key = bucketOf(t);
        buckets[key] = buckets[key] || { total: 0, done: 0 };
        buckets[key].total += 1;
        if (t.status === "concluida") buckets[key].done += 1;
      });
      const entries = Object.keys(buckets)
        .map((key) => ({ period: key, total: buckets[key].total, pct: Math.round((buckets[key].done / buckets[key].total) * 100) }))
        .filter((e) => e.total >= 3);
      if (entries.length < 2) return null;
      entries.sort((a, b) => b.pct - a.pct);
      const best = entries[0];
      const worst = entries[entries.length - 1];
      if (best.pct - worst.pct < 20) return null;
      const LABEL = { manha: "pela manhã", tarde: "à tarde", noite: "à noite" };
      return {
        message: `Você tem executado melhor atividades ${LABEL[best.period]} (${best.pct}% concluídas) do que ${LABEL[worst.period]} (${worst.pct}%).`,
        severity: "info",
        relevance: 2,
        dedupeKey: "execucao_por_horario",
        suggestion: { label: "Reorganizar horários", action: "navigate", data: { route: "planejamento" } },
      };
    },
  });

  // Tarefas repetidamente adiadas: usa o histórico de 'reagendada' que
  // App.Store.rescheduleTask já registra desde a Fase 2 — nenhuma
  // infraestrutura nova de rastreamento é necessária.
  registerRule({
    id: "tarefa_adiada_repetida",
    cooldownDays: 7,
    evaluate(ctx) {
      const Store = ctx.Store;
      const since = ctx.Sel.shiftDateISO(ctx.today, -59);
      const reschedules = Store.getAll("history").filter((h) => h.entity === "task" && h.action === "reagendada" && h.date >= since);
      const byTask = {};
      reschedules.forEach((h) => {
        (byTask[h.entityId] = byTask[h.entityId] || []).push(h);
      });
      const results = [];
      Object.keys(byTask).forEach((taskId) => {
        const entries = byTask[taskId];
        if (entries.length < 3) return;
        const task = Store.getById("tasks", taskId);
        if (!task || task.status === "concluida" || task.status === "pulada") return;
        results.push({
          message: `A atividade "${task.title}" foi adiada ${entries.length} vezes recentemente. Talvez seja necessário reduzir, reagendar de vez ou reconsiderar sua prioridade.`,
          severity: "atencao",
          relevance: 3,
          dedupeKey: "tarefa_adiada_repetida:" + taskId,
          relatedEntity: { type: "task", id: taskId },
          suggestion: { label: "Ver na Timeline", action: "insightGoToTask", data: { taskId: task.id, dueDate: task.dueDate || ctx.today } },
        });
      });
      return results;
    },
  });

  // Planejamento otimista: tarefas com duração planejada E real registradas
  // (actualDurationMin — ver quickEditForm) que consistentemente estouram
  // o tempo planejado. Também é a resposta ao item 3 "tempo planejado ×
  // tempo real".
  registerRule({
    id: "planejamento_otimista",
    cooldownDays: 14,
    evaluate(ctx) {
      const Store = ctx.Store;
      const since = ctx.Sel.shiftDateISO(ctx.today, -59);
      const tasks = Store.getAll("tasks").filter(
        (t) => typeof t.plannedDurationMin === "number" && t.plannedDurationMin > 0 && typeof t.actualDurationMin === "number" && t.dueDate && t.dueDate >= since
      );
      if (tasks.length < 3) return null;
      const overruns = tasks.map((t) => (t.actualDurationMin - t.plannedDurationMin) / t.plannedDurationMin);
      const avgOverrun = overruns.reduce((s, v) => s + v, 0) / overruns.length;
      const overrunCount = overruns.filter((v) => v > 0.15).length;
      if (avgOverrun < 0.15 || overrunCount < Math.ceil(tasks.length * 0.6)) return null;
      return {
        message: `Nos últimos ${tasks.length} registros com duração real preenchida, você gastou em média ${Math.round(avgOverrun * 100)}% mais tempo do que planejou. Você costuma subestimar o tempo necessário para esse tipo de atividade.`,
        severity: "atencao",
        relevance: 2,
        dedupeKey: "planejamento_otimista",
        suggestion: { label: "Aumentar duração planejada", action: "navigate", data: { route: "planejamento" } },
      };
    },
  });

  // Queda de hábito: aderência das últimas 2 semanas vs. as 2 anteriores,
  // por hábito ativo.
  function habitAdherenceInRange(habit, startISO, endISO) {
    const Sel = global.App.Selectors;
    const logs = global.App.Store.getAll("habitLogs").filter((l) => l.habitId === habit.id);
    const logsByDate = {};
    logs.forEach((l) => {
      logsByDate[l.date] = l.status;
    });
    let scheduled = 0;
    let done = 0;
    let cursor = startISO;
    while (cursor <= endISO) {
      if (Sel.isHabitScheduledToday(habit, cursor)) {
        scheduled += 1;
        const status = logsByDate[cursor];
        if (status === "concluido") done += 1;
        else if (status === "parcial") done += 0.5;
      }
      cursor = Sel.shiftDateISO(cursor, 1);
    }
    return scheduled > 0 ? Math.round((done / scheduled) * 100) : null;
  }
  registerRule({
    id: "queda_habito",
    cooldownDays: 10,
    evaluate(ctx) {
      const Sel = ctx.Sel;
      const today = ctx.today;
      const habits = ctx.Store.getAll("habits").filter((h) => h.active);
      const results = [];
      habits.forEach((habit) => {
        const createdDate = (habit.createdAt || today).slice(0, 10);
        const recentStart = Sel.shiftDateISO(today, -13);
        const priorEnd = Sel.shiftDateISO(recentStart, -1);
        const priorStart = Sel.shiftDateISO(priorEnd, -13);
        if (priorStart < createdDate) return; // hábito ainda não tem 4 semanas de vida
        const recent = habitAdherenceInRange(habit, recentStart, today);
        const prior = habitAdherenceInRange(habit, priorStart, priorEnd);
        if (recent === null || prior === null) return;
        const drop = prior - recent;
        if (drop < 20) return;
        results.push({
          message: `Sua aderência a "${habit.name}" caiu nas últimas semanas (${recent}%, era ${prior}%).`,
          severity: "atencao",
          relevance: 3,
          dedupeKey: "queda_habito:" + habit.id,
          relatedEntity: { type: "habit", id: habit.id },
          suggestion: { label: "Revisar hábito", action: "insightGoToHabit", data: { habitId: habit.id } },
        });
      });
      return results;
    },
  });

  // Sobrecarga: dia recente com muito peso planejado e baixa execução.
  registerRule({
    id: "sobrecarga",
    cooldownDays: 7,
    evaluate(ctx) {
      const Sel = ctx.Sel;
      const dates = Sel.getPeriodDates(7);
      const days = dates.map((d) => Sel.computeDayExecution(d)).filter((e) => e.pct !== null && e.totalWeight >= 8 && e.pct < 40);
      if (days.length === 0) return null;
      const worst = days.sort((a, b) => a.pct - b.pct)[0];
      const dateLabel = global.App.Utils.formatDateBR(worst.date);
      return {
        message: `Em ${dateLabel} havia bastante planejado, mas só ${worst.pct}% foi executado. Você pode estar planejando mais atividades do que consegue executar.`,
        severity: "atencao",
        relevance: 2,
        dedupeKey: "sobrecarga",
        suggestion: { label: "Rever planejamento de amanhã", action: "insightGoToTomorrow", data: {} },
      };
    },
  });

  /* ------------------------------------------------------------------ *
   * FRASES MOTIVACIONAIS (item 5) — banco local, seleção determinística
   * por contexto + data (mesmo princípio de getDayPhrase), sem IA.
   * Evita frases genéricas: cada uma amarra em algo específico do
   * contexto (execução, hábito, planejamento), nunca um "você consegue!"
   * solto.
   * ------------------------------------------------------------------ */
  const PHRASE_BANK = {
    progresso: [
      "Você fechou o período acima do seu próprio ritmo recente — vale reconhecer.",
      "Mais um dia em que o planejado virou feito. É isso que constrói o resto.",
      "O número de hoje conta uma história de constância, não de sorte.",
      "Esse tipo de dia é o que puxa a média pra cima nas próximas semanas.",
      "Avançar um pouco todo dia soma mais do que parece no calendário.",
    ],
    dificuldade: [
      "Dias assim acontecem — o que importa é o que vem depois dele.",
      "Nem todo dia precisa ser produtivo pra valer a pena ser vivido.",
      "Um dia mais difícil não apaga os anteriores. Amanhã é uma página nova.",
      "Reconhecer que hoje foi pesado já é o primeiro passo pra ajustar amanhã.",
      "Baixa execução hoje não é falta de disciplina — pode ser só um dia real.",
    ],
    consistencia: [
      "Regularidade bate intensidade no longo prazo — e isso está aparecendo nos seus números.",
      "Não é o pico de um dia que muda o jogo, é a repetição.",
      "Sua constância recente já supera a de algumas semanas atrás.",
      "Manter o ritmo, mesmo em dias médios, é o que separa hábito de tentativa.",
    ],
    encerramento_dia: [
      "O dia fecha aqui — o que não foi feito hoje ainda cabe amanhã.",
      "Vale fechar o dia sabendo o que funcionou e o que não funcionou.",
      "O quanto você fez hoje importa menos do que o quanto isso te aproxima do que quer.",
      "O dia de amanhã começa pela intenção de hoje — vale revisar antes de dormir.",
    ],
    planejamento_amanha: [
      "Um plano simples que você cumpre vale mais que um plano ambicioso que não sai do papel.",
      "Escolha poucas prioridades pra amanhã — é mais fácil proteger três do que dez.",
      "Reserve um horário pro que é essencial antes de preencher a agenda com o resto.",
      "Planejar amanhã em poucos minutos hoje evita decisões apressadas amanhã de manhã.",
    ],
  };
  function hashStr(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = (h << 5) - h + str.charCodeAt(i);
      h |= 0;
    }
    return Math.abs(h);
  }
  function getMotivationalPhrase(context, seed) {
    const list = PHRASE_BANK[context] || PHRASE_BANK.encerramento_dia;
    const key = context + "|" + (seed || global.App.Utils.todayISO());
    return list[hashStr(key) % list.length];
  }

  global.App.Insights = {
    registerRule,
    RULES,
    refresh,
    getActive,
    dismiss,
    getMotivationalPhrase,
  };
})(window);

/* ==== js/views.js ==== */
/* ==========================================================================
   VIEWS — uma função de renderização por área
   ==========================================================================
   Uma função por tela (Hoje, Planejamento, Hábitos, Metas, Evolução,
   Ajustes), todas lendo do mesmo App.Store — nenhuma view guarda seu
   próprio estado de dados.
   ========================================================================== */
window.App = window.App || {};

(function (global) {
  "use strict";

  const UI = global.App.UI;
  const Utils = global.App.Utils;

  function header(sub) {
    return `<div class="view-header"><p>${sub}</p></div>`;
  }

  /* ---------------------------- HOJE ---------------------------- */

  function greetingFor(hour, name) {
    const saud = hour < 12 ? "Bom dia" : hour < 18 ? "Boa tarde" : "Boa noite";
    return name ? `${saud}, ${name}.` : `${saud}.`;
  }

  // Renderiza um medidor radial, ou um estado neutro quando não há nada
  // planejado nessa categoria hoje — um anel em 0% pareceria uma falha,
  // quando na verdade só não há dado (ex.: nenhuma tarefa essencial hoje).
  function ringTile({ total, done, tone, label, iconName }) {
    if (total === 0) {
      return `
        <div class="progress-ring-card">
          <div class="progress-ring" style="width:76px;height:76px;display:flex;align-items:center;justify-content:center;background:var(--border);border-radius:50%;opacity:0.5;">
            ${UI.icon(iconName)}
          </div>
          <div class="progress-ring-meta">
            <strong>—</strong>
            <span>Nada planejado em ${esc(label.toLowerCase())} hoje</span>
          </div>
        </div>`;
    }
    const pct = Math.round((done / total) * 100);
    return `
      <div class="progress-ring-card">
        ${UI.progressRing({ pct, tone })}
        <div class="progress-ring-meta">
          <strong>${done}/${total}</strong>
          <span>${esc(label)}</span>
        </div>
      </div>`;
  }

  function viewHoje() {
    const Sel = global.App.Selectors;
    const Store = global.App.Store;
    const now = new Date();
    const todayISO = Utils.todayISO();

    // Fase 7 (auditoria UX): getTodayActivities traz junto qualquer tarefa
    // atrasada acumulada (às vezes semanas de backlog) — sem separar isso,
    // o dashboard não responde "o que preciso fazer HOJE" em poucos
    // segundos, e pior: progresso/Foco Agora ficavam contaminados por
    // atividades de dias passados (uma tarefa atrasada com horário "19:00"
    // podia aparecer como "próxima" hoje só por coincidência de relógio).
    // Tudo nesta view — progresso, anéis, Foco Agora, prioridades — passa a
    // olhar só pra `todayActivities` (dueDate === hoje); o backlog atrasado
    // continua acessível, só que recolhido, e não entra nessas contas.
    const activities = Sel.getTodayActivities(todayISO);
    const todayActivities = activities.filter((a) => a.dueDate === todayISO);
    const overdueActivities = activities.filter((a) => a.kind === "task" && a.dueDate !== todayISO);

    const progress = Sel.getDayProgress(todayActivities);
    const focus = Sel.getFocusNow(todayActivities, now);
    // Fase 6: a lista de "Insights" migrou da heurística solta (Sel.getInsights)
    // pro motor de regras local — cada card aqui já vem persistido, com
    // severidade e (quando fizer sentido) uma sugestão de ação, e pode ser
    // dispensado permanentemente. O refresh em si roda via App.Store.
    // syncAchievements() (mesmo gatilho das conquistas), não aqui na view.
    const insights = global.App.Insights ? global.App.Insights.getActive({ limit: 3 }) : [];
    const settings = Store.getById("settings", "app");
    const userName = settings && settings.userName ? settings.userName : "";

    const essentials = todayActivities.filter((a) => a.importance === "essencial");
    const allEssentialsDone = essentials.length > 0 && progress.essentialDone === progress.essentialTotal;

    return `
      <div class="hoje-header">
        <span class="hoje-date">${esc(Utils.capitalize(Utils.formatDateLong(todayISO)))}</span>
        <h2>${esc(greetingFor(now.getHours(), userName))}</h2>
        <span class="hoje-phrase">${esc(Sel.getDayPhrase(progress, now))}</span>
        ${
          progress.total > 0
            ? `<div class="hoje-progress-wrap">
                ${UI.progressBar({ value: progress.weightedPct, max: 100 })}
                <div class="hoje-progress-label">${progress.weightedPct}% do seu dia concluído</div>
              </div>`
            : ""
        }
      </div>

      ${UI.focusNowCard(focus)}

      <div class="hoje-section">
        <div class="hoje-section-title">${UI.icon("flag")} Prioridades de hoje</div>
        ${
          essentials.length === 0
            ? UI.emptyState({ iconName: "flag", message: "Nenhuma atividade essencial definida para hoje." })
            : `
              ${allEssentialsDone ? `<div class="priorities-empty" style="margin-bottom:10px;">${UI.icon("check")} Todas as prioridades essenciais de hoje estão concluídas.</div>` : ""}
              <div class="priorities-strip">${essentials.map((a) => UI.priorityChip(a)).join("")}</div>
            `
        }
      </div>

      <div class="hoje-section">
        <div class="hoje-section-title">${UI.icon("hoje")} Atividades de hoje</div>
        ${
          todayActivities.length === 0
            ? UI.emptyState({
                iconName: "hoje",
                message: "Nada com prazo para hoje ainda. Adicione algo em Planejamento ou prepare o dia com antecedência em \"Prepare amanhã\".",
              })
            : `<div class="activities-grid">${todayActivities.map((a) => UI.activityCard(a)).join("")}</div>`
        }
        ${
          overdueActivities.length > 0
            ? `<details class="form-more hoje-overdue-details">
                <summary>${overdueActivities.length} ${overdueActivities.length === 1 ? "atividade atrasada" : "atividades atrasadas"} de dias anteriores</summary>
                <div class="activities-grid" style="margin-top:14px;">${overdueActivities.map((a) => UI.activityCard(a)).join("")}</div>
              </details>`
            : ""
        }
      </div>

      <div class="hoje-section">
        <div class="hoje-section-title">${UI.icon("evolucao")} Progresso do dia</div>
        <div class="card">
          <div class="progress-rings-row">
            ${ringTile({ total: progress.total, done: progress.done, tone: "accent", label: "Atividades concluídas", iconName: "hoje" })}
            ${ringTile({ total: progress.essentialTotal, done: progress.essentialDone, tone: "accent", label: "Essenciais", iconName: "flag" })}
            ${ringTile({ total: progress.habitsTotal, done: progress.habitsDone, tone: "info", label: "Hábitos", iconName: "habitos" })}
          </div>
        </div>
      </div>

      <div class="hoje-section">
        <div class="hoje-section-title">${UI.icon("sparkles")} Insights</div>
        ${
          insights.length === 0
            ? UI.emptyState({ iconName: "sparkles", message: "Conforme seus dias forem registrados, pequenos insights sobre sua execução vão aparecer aqui." })
            : `<div class="insight-cards-list">${insights.map((i) => UI.insightCard(i)).join("")}</div>`
        }
      </div>
    `;
  }

  /* ------------------------- PLANEJAMENTO ------------------------- */
  // Estado de UI transiente (qual sub-modo e qual dia estão em foco na
  // Timeline) — não é dado de domínio, então não mora no Store; vive aqui,
  // exposto via App.Views.planState pra as Actions (app.js) poderem
  // mudá-lo e disparar um novo render, do mesmo jeito que o Router guarda
  // sua própria rota atual.
  const planState = { mode: "timeline", date: Utils.todayISO() };

  function planModeSwitcher() {
    return `
      <div class="segmented plan-mode-switch">
        <button type="button" data-action="planSetMode" data-mode="timeline" class="${planState.mode === "timeline" ? "active" : ""}">${UI.icon("hoje")}<span>Timeline</span></button>
        <button type="button" data-action="planSetMode" data-mode="amanha" class="${planState.mode === "amanha" ? "active" : ""}">${UI.icon("planejamento")}<span>Prepare amanhã</span></button>
      </div>`;
  }

  function viewPlanejamentoTimeline(dateISO) {
    const Sel = global.App.Selectors;
    const items = Sel.getTimelineForDate(dateISO);
    const inboxItems = Sel.getInboxItems();

    return `
      ${header("O ritual diário de organizar o que será executado.")}
      <div class="plan-toolbar">
        ${planModeSwitcher()}
        ${UI.button({ label: "Nova atividade", variant: "primary", size: "sm", iconName: "plus", action: "openActivityModal", data: { date: dateISO } })}
      </div>
      ${UI.dayNav({ dateISO })}
      <div class="plan-layout">
        <div class="plan-main">
          ${
            items.length === 0
              ? UI.emptyState({
                  iconName: "planejamento",
                  message: "Nada planejado para este dia ainda.",
                  actionLabel: "Nova atividade",
                  action: "openActivityModal",
                  actionData: { date: dateISO },
                })
              : `<div class="timeline-list">${items.map((a) => UI.timelineItem(a)).join("")}</div>`
          }
        </div>
        <div class="plan-side">
          ${UI.inboxPanel(inboxItems)}
        </div>
      </div>
    `;
  }

  function viewPlanejamentoAmanha(dateISO) {
    const Sel = global.App.Selectors;
    const items = Sel.getTimelineForDate(dateISO);
    const habitRows = Sel.getHabitsScheduledFor(dateISO);
    const inboxItems = Sel.getInboxItems();
    const essentials = items.filter((a) => a.importance === "essencial");

    const phrase = global.App.Insights ? global.App.Insights.getMotivationalPhrase("planejamento_amanha", dateISO) : "";

    return `
      ${header("Monte o plano de amanhã em poucos minutos: adicione o que importa e marque as prioridades.")}
      ${phrase ? `<div class="insight-line plan-amanha-phrase">${UI.icon("sparkles")}<span>${esc(phrase)}</span></div>` : ""}
      <div class="plan-toolbar">
        ${planModeSwitcher()}
        ${UI.button({ label: "Nova atividade", variant: "primary", size: "sm", iconName: "plus", action: "openActivityModal", data: { date: dateISO } })}
      </div>

      <div class="hoje-section" style="margin-top:20px;">
        <div class="hoje-section-title">${UI.icon("hoje")} Amanhã — ${esc(Utils.capitalize(Utils.formatDateLong(dateISO)))}</div>
        ${
          items.length === 0
            ? UI.emptyState({ iconName: "planejamento", message: "Nenhuma atividade adicionada para amanhã ainda." })
            : `<div class="timeline-list">${items.map((a) => UI.timelineItem(a)).join("")}</div>`
        }
      </div>

      ${
        habitRows.length > 0
          ? `<div class="hoje-section">
              <div class="hoje-section-title">${UI.icon("habitos")} Hábitos programados</div>
              <div class="habit-plan-list">${habitRows.map((r) => UI.habitPlanRow({ habit: r.habit, skipped: r.skipped, dateISO })).join("")}</div>
            </div>`
          : ""
      }

      <div class="hoje-section">
        <div class="hoje-section-title">${UI.icon("flag")} Prioridades de amanhã</div>
        ${
          essentials.length === 0
            ? UI.emptyState({ iconName: "flag", message: "Marque as atividades mais importantes de amanhã como Essencial — clique no lápis de uma atividade e ajuste a importância." })
            : `<div class="priorities-strip">${essentials
                .map(
                  (a) => `
              <span class="priority-chip" style="cursor:default;">
                <span class="priority-chip-label">${esc(a.title)}</span>
                ${a.startTime ? `<span class="priority-chip-time num">${esc(a.startTime)}</span>` : ""}
              </span>`
                )
                .join("")}</div>`
        }
      </div>

      <div class="hoje-section plan-side" style="max-width:480px;">
        ${UI.inboxPanel(inboxItems)}
      </div>

      <div class="plan-finish-row">
        ${UI.button({ label: "Concluir planejamento de amanhã", variant: "primary", iconName: "check", action: "finishPlanning", data: { date: dateISO } })}
      </div>
    `;
  }

  function viewPlanejamento() {
    if (planState.mode === "amanha") {
      return viewPlanejamentoAmanha(global.App.Selectors.tomorrowISO(Utils.todayISO()));
    }
    return viewPlanejamentoTimeline(planState.date || Utils.todayISO());
  }

  /* ---------------------------- HÁBITOS ---------------------------- */
  // Mesmo padrão do planState (Fase 2): estado de UI transiente, exposto
  // via App.Views.habitState pras Actions poderem mudá-lo e re-renderizar.
  const habitState = { selectedHabitId: null, heatmapRange: 90 };

  function viewHabitosDashboard() {
    const Sel = global.App.Selectors;
    const overview = Sel.getHabitsOverview();
    const archived = Sel.getArchivedHabits();

    return `
      ${header("Comportamentos recorrentes e sua constância ao longo do tempo.")}
      <div class="plan-toolbar">
        <span></span>
        ${UI.button({ label: "Novo hábito", variant: "primary", size: "sm", iconName: "plus", action: "openHabitFormModal" })}
      </div>
      ${
        overview.length === 0
          ? UI.emptyState({ iconName: "habitos", message: "Nenhum hábito ativo ainda. Criar um leva só alguns segundos.", actionLabel: "Novo hábito", action: "openHabitFormModal" })
          : `<div class="habits-grid">${overview.map((o) => UI.habitCard(o)).join("")}</div>`
      }
      ${
        archived.length > 0
          ? `<details class="form-more" style="margin-top:26px;">
              <summary>Hábitos arquivados (${archived.length})</summary>
              <div class="archived-habit-list">
                ${archived
                  .map(
                    (h) => `
                  <div class="archived-habit-row">
                    <span class="archived-habit-name">${UI.icon(h.icon && UI.ICONS[h.icon] ? h.icon : "habitos")}${esc(h.name)}</span>
                    ${UI.button({ label: "Reativar", variant: "ghost", size: "sm", action: "reactivateHabit", data: { habitId: h.id } })}
                  </div>`
                  )
                  .join("")}
              </div>
            </details>`
          : ""
      }
    `;
  }

  function viewHabitoDetail(habit) {
    const Sel = global.App.Selectors;
    const range = habitState.heatmapRange || 90;
    const weeks = Sel.getHabitHeatmapWeeks(habit, range);
    const streaks = Sel.computeHabitStreaks(habit);
    const stats = {
      overall: Sel.computeHabitAdherence(habit, null),
      monthly: Sel.computeHabitAdherence(habit, 30),
      weekly: Sel.computeHabitAdherence(habit, 7),
      current: streaks.current,
      best: streaks.best,
    };
    const showBreakBanner = streaks.current === 0 && streaks.lastBrokenLength > 0 && streaks.lastBrokenAt && Sel.daysSinceISO(streaks.lastBrokenAt) <= 3;

    return `
      <div class="habit-detail-header">
        <button type="button" class="icon-btn" data-action="habitBackToDashboard" aria-label="Voltar para Hábitos">${UI.icon("chevronLeft")}</button>
        <div class="activity-icon tone-info habit-detail-icon">${UI.icon(habit.icon && UI.ICONS[habit.icon] ? habit.icon : "habitos")}</div>
        <div class="habit-detail-title">
          <h2>${esc(habit.name)}</h2>
          <span class="text-tertiary">${esc(Sel.frequencyLabel(habit.frequency))}${habit.preferredTime ? " · " + esc(habit.preferredTime) : ""}</span>
        </div>
        ${UI.button({ label: "Editar", variant: "ghost", size: "sm", iconName: "pencil", action: "openHabitFormModal", data: { habitId: habit.id } })}
      </div>

      ${showBreakBanner ? UI.streakBreakBanner(streaks.lastBrokenLength) : ""}

      ${UI.habitStatsRow(stats)}

      <div class="hoje-section">
        <div class="plan-toolbar" style="margin-top:0;">
          <div class="hoje-section-title" style="margin:0;">${UI.icon("evolucao")} Calendário de aderência</div>
          <div class="segmented heatmap-range-switch">
            ${[30, 90, 365].map((r) => `<button type="button" data-action="habitSetHeatmapRange" data-range="${r}" class="${range === r ? "active" : ""}">${r}d</button>`).join("")}
          </div>
        </div>
        ${UI.habitHeatmap({ habitId: habit.id, weeks })}
        <div class="heatmap-legend">
          <span class="heatmap-cell status-concluido"></span><span>Concluído</span>
          <span class="heatmap-cell status-parcial"></span><span>Parcial</span>
          <span class="heatmap-cell status-not_marked"></span><span>Não realizado</span>
          <span class="heatmap-cell status-not_scheduled"></span><span>Fora da frequência</span>
        </div>
      </div>
    `;
  }

  function viewHabitos() {
    const Store = global.App.Store;
    if (habitState.selectedHabitId) {
      const habit = Store.getById("habits", habitState.selectedHabitId);
      if (habit) return viewHabitoDetail(habit);
      habitState.selectedHabitId = null; // hábito não existe mais (ex.: exemplos removidos)
    }
    return viewHabitosDashboard();
  }

  /* ---------------------------- METAS ---------------------------- */
  // Mesmo padrão do habitState (Fase 3): estado de UI transiente, exposto
  // via App.Views.metaState pras Actions poderem mudá-lo e re-renderizar.
  const metaState = { selectedGoalId: null };

  function viewMetasDashboard() {
    const Sel = global.App.Selectors;
    const objectiveGroups = Sel.getObjectivesOverview();
    const looseGoals = Sel.getGoalsWithoutObjective();
    const inactive = Sel.getInactiveGoals();
    const totalActive = objectiveGroups.reduce((n, g) => n + g.goals.length, 0) + looseGoals.length;

    function cardCtxFor(goal) {
      return {
        goal,
        progress: Sel.computeGoalProgress(goal),
        pace: Sel.computeGoalPace(goal),
        deadlineInfo: Sel.getGoalDeadlineInfo(goal),
        recent: Sel.getGoalRecentActivity(goal.id, 1)[0] || null,
      };
    }

    return `
      ${header("Resultados de médio e longo prazo — nem toda meta precisa de número.")}
      <div class="plan-toolbar">
        <span></span>
        <div style="display:flex;gap:8px;">
          ${UI.button({ label: "Novo objetivo", variant: "ghost", size: "sm", action: "openObjectiveFormModal" })}
          ${UI.button({ label: "Nova meta", variant: "primary", size: "sm", iconName: "plus", action: "openGoalFormModal" })}
        </div>
      </div>
      ${
        totalActive === 0
          ? UI.emptyState({ iconName: "metas", message: "Nenhuma meta ativa ainda. O que você está buscando alcançar?", actionLabel: "Nova meta", action: "openGoalFormModal" })
          : `
            ${objectiveGroups
              .map(
                (group) => `
              <div class="objective-group">
                <div class="objective-group-header">
                  <span class="objective-group-title">${esc(group.objective.title)}</span>
                  ${UI.badge({ label: UI.TIMEFRAME_LABEL[group.objective.timeframe] || "", variant: "neutral" })}
                  ${UI.iconActionBtn({ iconName: "pencil", action: "openObjectiveFormModal", data: { objectiveId: group.objective.id }, label: "Editar objetivo" })}
                </div>
                <div class="goals-grid">${group.goals.map((g) => UI.goalCard(cardCtxFor(g))).join("")}</div>
              </div>`
              )
              .join("")}
            ${
              looseGoals.length
                ? `
              <div class="objective-group">
                ${objectiveGroups.length ? `<div class="objective-group-header"><span class="objective-group-title">Sem objetivo vinculado</span></div>` : ""}
                <div class="goals-grid">${looseGoals.map((g) => UI.goalCard(cardCtxFor(g))).join("")}</div>
              </div>`
                : ""
            }
          `
      }
      ${
        inactive.length > 0
          ? `<details class="form-more" style="margin-top:26px;">
              <summary>Metas concluídas, pausadas ou abandonadas (${inactive.length})</summary>
              <div class="archived-habit-list">
                ${inactive
                  .map(
                    (g) => `
                  <div class="archived-habit-row">
                    <span class="archived-habit-name">${UI.icon("metas")}${esc(g.title)}<span class="text-tertiary" style="margin-left:8px;">${esc(UI.GOAL_STATUS_LABEL[g.status] || "")}</span></span>
                    ${UI.button({ label: "Reabrir", variant: "ghost", size: "sm", action: "setGoalStatusAction", data: { goalId: g.id, status: "ativa" } })}
                  </div>`
                  )
                  .join("")}
              </div>
            </details>`
          : ""
      }
    `;
  }

  // Bloco de progresso do detalhe — a forma muda por TIPO de meta
  // (briefing item 2 e 5), nunca um layout genérico só.
  function goalProgressBlock(goal, progress, pace, deadlineInfo) {
    const deadlineLine = deadlineInfo
      ? `<span class="tone-${deadlineInfo.tone}">${esc(deadlineInfo.label)}</span>`
      : `<span class="text-tertiary">Sem prazo definido</span>`;

    if (goal.type === "quantitativa" || goal.type === "percentual") {
      const tone = pace ? (pace.status === "atrasado" ? "danger" : pace.status === "atencao" ? "warning" : "success") : "accent";
      return `
        <div class="goal-progress-main">
          ${
            progress !== null
              ? UI.progressRing({ pct: progress, size: 84, stroke: 8, tone })
              : `<div class="goal-card-ring-placeholder" style="width:84px;height:84px;">${UI.icon("metas")}</div>`
          }
          <div class="goal-progress-meta">
            <strong>${esc(UI.goalValueLine(goal))}</strong>
            ${deadlineLine}
          </div>
        </div>
        ${UI.goalValueEditor(goal)}
        ${pace ? UI.goalPaceStatsRow(pace) : `<p class="text-tertiary" style="font-size:12px;margin-top:10px;">Defina um valor-alvo e um prazo pra ver o ritmo necessário.</p>`}
      `;
    }
    if (goal.type === "marco") {
      return `
        <div class="goal-progress-main">
          ${
            progress !== null
              ? UI.progressBar({ value: progress, max: 100, meta: UI.goalValueLine(goal) })
              : `<p class="text-tertiary" style="font-size:13px;">${esc(UI.goalValueLine(goal))}</p>`
          }
        </div>
        <div class="hoje-section">
          <div class="hoje-section-title">Marcos</div>
          ${UI.milestoneList({ goalId: goal.id, milestones: goal.milestones || [] })}
          ${UI.milestoneAddRow(goal.id)}
        </div>
      `;
    }
    if (goal.type === "data") {
      return `
        <div class="goal-progress-main">
          ${
            progress !== null
              ? UI.progressRing({ pct: progress, size: 76, stroke: 7, tone: "accent" })
              : `<div class="goal-card-ring-placeholder" style="width:76px;height:76px;">${UI.icon("planejamento")}</div>`
          }
          <div class="goal-progress-meta">
            <strong>${esc(UI.goalValueLine(goal))}</strong>
            ${deadlineLine}
          </div>
        </div>
      `;
    }
    if (goal.type === "conclusao") {
      return `
        <div class="goal-progress-main">
          ${UI.progressRing({ pct: progress || 0, size: 76, stroke: 7, tone: goal.status === "concluida" ? "success" : "accent", centerLabel: goal.status === "concluida" ? "Feito" : "—" })}
          <div class="goal-progress-meta">
            <strong>${esc(UI.goalValueLine(goal))}</strong>
            ${deadlineLine}
          </div>
        </div>
      `;
    }
    // qualitativa: sem indicador numérico de propósito (item 5).
    return `
      <div class="goal-progress-main goal-progress-qualitative">
        <div class="activity-icon tone-info">${UI.icon("sparkles")}</div>
        <div class="goal-progress-meta">
          <strong>${esc(UI.GOAL_STATUS_LABEL[goal.status] || "")}</strong>
          ${deadlineLine}
        </div>
      </div>
    `;
  }

  function viewMetaDetail(goal) {
    const Sel = global.App.Selectors;
    const Store = global.App.Store;
    const progress = Sel.computeGoalProgress(goal);
    const pace = Sel.computeGoalPace(goal);
    const deadlineInfo = Sel.getGoalDeadlineInfo(goal);
    const objective = goal.objectiveId ? Store.getById("objectives", goal.objectiveId) : null;
    const linkedTasks = Sel.getGoalLinkedTasks(goal.id).sort((a, b) => (b.dueDate || "").localeCompare(a.dueDate || ""));
    const linkedHabits = Sel.getGoalLinkedHabits(goal.id).map((h) => ({ habit: h, adherence30: Sel.computeHabitAdherence(h, 30) }));
    const recent = Sel.getGoalRecentActivity(goal.id, 5);

    let statusActions;

  function viewAjustes() {

    const backend = global.App.DB.backend === "indexeddb" ? "IndexedDB" : "localStorage (modo de compatibilidade)";
    return `
      ${header("Preferências, backup e dados de demonstração.")}
      <div class="settings-grid">

        <div class="card settings-card">
          <h3>Perfil</h3>
          <p>Usado só para personalizar a saudação da tela Hoje.</p>
          <div class="field-inline">

        <div class="card settings-card">

          <div class="info-banner">

        </div>

        <div class="card settings-card">

          <div class="backup-actions">
            ${UI.button({ label: "Exportar dados", variant: "primary", size: "sm", iconName: "download", action: "exportData" })}
            ${UI.button({ label: "Importar dados", variant: "ghost", size: "sm", iconName: "upload", action: "triggerImportFile" })}
            <input type="file" id="importFileInput" accept="application/json,.json" data-action-change="importDataFile" style="display:none;">
          </div>
          <p class="text-tertiary" style="font-size:11.5px;margin-top:10px;">Importar substitui completamente os dados atuais deste navegador pelo conteúdo do arquivo — vale exportar um backup antes, se quiser manter o que já tem.</p>
        </div>

        <div class="card settings-card">
          <h3>Dados de demonstração</h3>

          ${UI.button({ label: "Limpar todos os dados", variant: "danger", size: "sm", iconName: "trash", action: "confirmClearAllData" })}
          <p class="text-tertiary" style="font-size:11.5px;margin-top:10px;">Ação irreversível — exporte um backup antes, se quiser guardar o que tem.</p>

  const esc = Utils.escapeHtml;

  global.App.Views = {

    planejamento: viewPlanejamento,
    habitos: viewHabitos,
    metas: viewMetas,
    evolucao: viewEvolucao,
    ajustes: viewAjustes,
    planState,
    habitState,
    metaState,
    evoState,
  };
})(window);

/* ==========================================================================
   DEMO DATA — dados fictícios, claramente marcados e facilmente removíveis
   ==========================================================================
   Briefing item 13: só para visualizar a interface durante o desenvolvimento.
   Todo registro aqui carrega isDemo:true (ver models.js), o que permite
   removê-los de uma vez em Ajustes → "Remover exemplos" sem tocar em dados
   reais que o usuário venha a cadastrar.
   ========================================================================== */
window.App = window.App || {};

(function (global) {
  "use strict";

  const M = global.App.Models;
  const Store = global.App.Store;
  const todayISO = global.App.Utils.todayISO;

  function yesterdayISO() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return global.App.Utils.formatISOFromDate(d);
  }

  function daysAgoISO(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return global.App.Utils.formatISOFromDate(d);
  }

  function daysFromNowISO(n) {
    const d = new Date();
    d.setDate(d.getDate() + n);
    return global.App.Utils.formatISOFromDate(d);
  }

  async function seed() {
    // Objetivo -> Meta -> Projeto, para ilustrar a hierarquia sem duplicar dado.
    const objetivo = M.createObjective({
      isDemo: true,
      title: "Crescer na carreira em Pricing & Analytics",
      description: "Direção de médio prazo: aprofundar em dados e conseguir uma posição de maior impacto.",
      timeframe: "medio_prazo",
    });
    await Store.add("objectives", objetivo);

    const projeto = M.createProject({
      isDemo: true,
      name: "Transição de carreira",
      description: "Tudo relacionado à busca por novas oportunidades.",
      color: "accent-2",
    });
    await Store.add("projects", projeto);

    const metaQuantitativa = M.createGoal({
      isDemo: true,
      title: "Concluir o MBA",
      type: "percentual",
      targetValue: 100,
      currentValue: 62,
      unit: "%",
      deadline: daysFromNowISO(40),
      objectiveId: objetivo.id,
      importance: "essencial",
    });
    // Fase 4, item 5 (ritmo): precisa de valor-alvo + prazo + uma janela de
    // tempo já decorrida pra ter o que comparar — sem isso, createdAt
    // nasceria "hoje" e não haveria "progresso esperado" nenhum ainda.
    metaQuantitativa.createdAt = daysAgoISO(60) + "T08:00:00.000Z";
    const metaMarco = M.createGoal({
      isDemo: true,
      title: "Reformular o currículo",
      type: "marco",
      milestones: [
        { id: global.App.Utils.uid(), label: "Levantar experiências e projetos", done: true },
        { id: global.App.Utils.uid(), label: "Escrever primeira versão", done: true },
        { id: global.App.Utils.uid(), label: "Revisar com mentor", done: false },
      ],
      objectiveId: objetivo.id,
      projectId: projeto.id,
      importance: "importante",
    });
    const metaQualitativa = M.createGoal({
      isDemo: true,
      title: "Me sentir mais confiante em entrevistas",
      type: "qualitativa",
      importance: "importante",
    });
    // Os três tipos restantes (item 2), pra cobrir os seis na demonstração.
    // De propósito sem objectiveId — ilustra "nenhuma relação obrigatória"
    // (item 1) e a seção "sem objetivo" do painel.
    const metaLeitura = M.createGoal({
      isDemo: true,
      title: "Ler 12 livros no ano",
      type: "quantitativa",
      targetValue: 12,
      currentValue: 5,
      unit: "livros",
      importance: "opcional",
    });
    const metaLinkedIn = M.createGoal({
      isDemo: true,
      title: "Publicar perfil atualizado no LinkedIn",
      type: "conclusao",
      importance: "opcional",
    });
    const metaVagas = M.createGoal({
      isDemo: true,
      title: "Enviar candidaturas até o fim do trimestre",
      type: "data",
      deadline: daysFromNowISO(70),
      objectiveId: objetivo.id,
      importance: "importante",
    });
    await Store.add("goals", metaQuantitativa);
    await Store.add("goals", metaMarco);
    await Store.add("goals", metaQualitativa);
    await Store.add("goals", metaLeitura);
    await Store.add("goals", metaLinkedIn);
    await Store.add("goals", metaVagas);

    // Hábitos + logs de execução (últimos 2 dias, pra já ilustrar constância).
    const habitoLeitura = M.createHabit({
      isDemo: true,
      name: "Ler 20 minutos",
      frequency: { type: "diaria" },
      importance: "importante",
      // Objetivo -> Meta -> Hábito (item 1): esse hábito diário é uma das
      // atividades que alimentam "Ler 12 livros no ano" — a meta em si não
      // sabe disso automaticamente (não tem como inferir "quantos livros"
      // uma sessão de leitura representa), mas aparece vinculada na tela
      // de detalhe da meta e na "atividade recente" quando concluída.
      goalId: metaLeitura.id,
    });
    const habitoTreino = M.createHabit({
      isDemo: true,
      name: "Treinar",
      frequency: { type: "x_por_semana", count: 4 },
      importance: "essencial",
    });
    // Fase 3: sem histórico, o calendário de aderência ficaria vazio (createdAt
    // do hábito nasceria "hoje" e tudo antes disso conta como "antes de
    // existir"). Só para os exemplos, adiantamos createdAt pra dar ~3
    // semanas de dados reais pro heatmap/streaks/aderência mostrarem algo.
    habitoLeitura.createdAt = daysAgoISO(24) + "T08:00:00.000Z";
    habitoTreino.createdAt = daysAgoISO(24) + "T08:00:00.000Z";
    await Store.add("habits", habitoLeitura);
    await Store.add("habits", habitoTreino);

    // "Ler 20 minutos" (diário): duas falhas espaçadas no começo do
    // período, depois uma sequência limpa terminando ontem — pra
    // demonstrar sequência atual, melhor sequência e o heatmap variado.
    for (let i = 24; i >= 1; i--) {
      const missed = i === 19 || i === 11;
      await Store.add(
        "habitLogs",
        M.createHabitLog({ isDemo: true, habitId: habitoLeitura.id, date: daysAgoISO(i), status: missed ? "nao_realizado" : "concluido" })
      );
    }
    await Store.add("habitLogs", M.createHabitLog({ isDemo: true, habitId: habitoLeitura.id, date: todayISO(), status: "pendente" }));

    // "Treinar" (4x/semana): sessões espalhadas ao longo do período, com
    // uma parcial ontem — ilustra o status "parcial" no heatmap.
    for (const i of [3, 6, 9, 13, 16, 20, 23]) {
      await Store.add("habitLogs", M.createHabitLog({ isDemo: true, habitId: habitoTreino.id, date: daysAgoISO(i), status: "concluido" }));
    }
    await Store.add("habitLogs", M.createHabitLog({ isDemo: true, habitId: habitoTreino.id, date: yesterdayISO(), status: "parcial", note: "Treino curto, faltou tempo." }));

    // "Meditar 10 minutos" (Fase 6): hábito com queda real de aderência —
    // ~3 semanas sólidas seguidas de ~2 semanas quase todas falhadas, pra
    // demonstrar a regra queda_habito (item 2 do briefing) sem inventar
    // uma infraestrutura de tracking nova, só dados que contam essa história.
    const habitoMeditar = M.createHabit({
      isDemo: true,
      name: "Meditar 10 minutos",
      frequency: { type: "diaria" },
      importance: "opcional",
      icon: "brain",
    });
    habitoMeditar.createdAt = daysAgoISO(35) + "T08:00:00.000Z";
    await Store.add("habits", habitoMeditar);
    for (let i = 34; i >= 14; i--) {
      const missed = i === 30 || i === 22;
      await Store.add(
        "habitLogs",
        M.createHabitLog({ isDemo: true, habitId: habitoMeditar.id, date: daysAgoISO(i), status: missed ? "nao_realizado" : "concluido" })
      );
    }
    for (let i = 13; i >= 1; i--) {
      await Store.add("habitLogs", M.createHabitLog({ isDemo: true, habitId: habitoMeditar.id, date: daysAgoISO(i), status: "nao_realizado" }));
    }
    await Store.add("habitLogs", M.createHabitLog({ isDemo: true, habitId: habitoMeditar.id, date: todayISO(), status: "pendente" }));

    // Tarefas do dia, com níveis de importância e horários variados —
    // incluindo os dois exemplos do próprio briefing da Fase 1.
    // createdAt de cada uma é adiantado pra ontem (abaixo, via addTask): sem
    // isso todas nasceriam com createdAt "agora", no mesmo dia do prazo, e o
    // indicador de Planejamento da Fase 5 (que compara "criada antes do dia"

/* ==== js/app.js ==== */
/* ==========================================================================
   APP — bootstrap: liga banco, tema, estado, navegação e delegação de ações
   ==========================================================================
   Ordem de carregamento esperada (ver index.html):
   utils -> models -> db -> store -> theme -> ui -> router -> views ->
   demoData -> app (este arquivo, sempre por último)
   ========================================================================== */
window.App = window.App || {};

(function (global) {
  "use strict";

  const App = global.App;
  const $ = (sel, root) => (root || document).querySelector(sel);

  const SUBTITLES = {
    hoje: "Seu ponto de partida do dia",
    planejamento: "Organize o que será executado",
    habitos: "Constância ao longo do tempo",
    metas: "Resultados de médio e longo prazo",
    evolucao: "Sua trajetória e aprendizado",
    ajustes: "Preferências e dados do app",
  };

  const THEME_ICON = { light: "sun", dark: "moon", auto: "auto" };
  const THEME_CYCLE = { light: "dark", dark: "auto", auto: "light" };

  /* ---------------------------------------------------------------- *
   * NAVEGAÇÃO — renderiza sidebar (desktop) e bottom-nav (mobile)
   * a partir da MESMA lista de rotas, para nunca desalinhar as duas.
   * ---------------------------------------------------------------- */
  function navButtonHtml(route, active) {
    return `
      <button type="button" class="nav-btn ${active ? "active" : ""}" data-action="navigate" data-route="${route.id}">
        ${App.UI.icon(route.icon)}
        <span class="nav-label">${route.label}</span>
        ${route.phase ? `<span class="nav-phase">${route.phase}</span>` : ""}
      </button>`;
  }

  function renderNav() {
    const current = App.Router.current;
    const routes = App.Router.ROUTES.concat(App.Router.UTILITY_ROUTE);
    const html = routes.map((r) => navButtonHtml(r, r.id === current)).join("");
    $("#sidebarNav").innerHTML = html;
    $("#bottomNav").innerHTML = html;
  }

  function renderThemeToggleIcon() {
    const theme = App.Theme.get();
    $("#themeToggleBtn").innerHTML = App.UI.icon(THEME_ICON[theme] || "auto");
    $("#themeToggleBtn").setAttribute(
      "aria-label",
      theme === "light" ? "Tema claro ativo — clique para escuro" : theme === "dark" ? "Tema escuro ativo — clique para automático" : "Tema automático ativo — clique para claro"
    );
  }

  // Lista de metas pra um select de vínculo (Fase 4): só as ativas, mais a
  // meta atualmente vinculada (se houver e não estiver mais ativa) — sem
  // isso, editar um formulário sem tocar no campo de meta desvincularia
  // silenciosamente quem apontava pra uma meta pausada/concluída/abandonada.
  function goalsForLinkSelect(currentGoalId) {
    const goals = App.Store.getAll("goals").filter((g) => g.status === "ativa");
    if (currentGoalId && !goals.some((g) => g.id === currentGoalId)) {
      const current = App.Store.getById("goals", currentGoalId);
      if (current) goals.push(current);
    }
    return goals;
  }

  /* ---------------------------------------------------------------- *
   * RENDERIZAÇÃO DA VIEW ATUAL
   * ---------------------------------------------------------------- */
  function renderView() {
    const route = App.Router.current;
    const container = $("#viewContainer");
    const renderFn = App.Views[route] || App.Views.hoje;
    container.innerHTML = renderFn();
    container.classList.remove("view-enter");
    // força reflow para reiniciar a animação a cada troca de rota
    void container.offsetWidth;
    container.classList.add("view-enter");

    const routeMeta = App.Router.ROUTES.concat(App.Router.UTILITY_ROUTE).find((r) => r.id === route);
    $("#pageTitle").textContent = routeMeta ? routeMeta.label : "Hoje";
    $("#pageSub").textContent = SUBTITLES[route] || "";

    renderNav();
  }

  /* ---------------------------------------------------------------- *
   * AÇÕES — todo clique com data-action passa por aqui (delegação),
   * então nenhuma view precisa (re)anexar listeners ao renderizar.
   * ---------------------------------------------------------------- */
  const Actions = {
    navigate(el) {
      App.Router.goTo(el.dataset.route);
    },
    async setTheme(el) {
      await App.Theme.set(el.dataset.theme);
      renderThemeToggleIcon();
      renderView();
    },
    async toggleThemeQuick() {
      const next = THEME_CYCLE[App.Theme.get()] || "light";
      await App.Theme.set(next);
      renderThemeToggleIcon();
      renderView();
    },
    async seedDemoData() {
      try {
        await App.DemoData.seed();
        // Alguns exemplos já nascem com prazo vencido (de propósito, pra
        // mostrar o estado "atrasada") — reclassifica imediatamente em vez
        // de esperar o próximo boot. O mesmo vale pras conquistas (Fase 5):
        // os exemplos já trazem sequências/histórico prontos, então algumas
        // regras batem na hora, sem esperar o próximo carregamento do app.
        await App.Store.syncOverdueTasks();
        await App.Store.syncAchievements();
        App.UI.Toast.show("Dados de demonstração carregados.", "success");
        renderView();
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível carregar os exemplos.", "error");
      }
    },
    confirmClearDemoData() {
      App.UI.confirmDialog({
        title: "Remover dados de demonstração?",
        message: "Isso remove apenas os registros fictícios marcados como demonstração. Seus dados reais não são afetados.",
        confirmLabel: "Remover",
        danger: true,
        onConfirmAction: "clearDemoDataConfirmed",
      });
    },
    async clearDemoDataConfirmed() {
      App.UI.Modal.close();
      try {
        await App.Store.clearDemoData();
        App.UI.Toast.show("Dados de demonstração removidos.", "success");
        renderView();
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível remover os exemplos.", "error");
      }
    },

    // "Limpar todos os dados" — diferente do item acima: apaga de verdade
    // tudo que está salvo neste navegador (dados reais inclusive), não só
    // os exemplos fictícios. Mesmo padrão de confirmação forte já usado em
    // "Importar backup" (confirmDialog com danger: true).
    confirmClearAllData() {
      App.UI.confirmDialog({
        title: "Limpar todos os dados?",
        message: "Isso apaga permanentemente tudo que está salvo neste navegador — tarefas, hábitos, metas, histórico e preferências. Não é possível desfazer. Se quiser manter o que tem, exporte um backup antes de continuar.",
        confirmLabel: "Limpar tudo",
        danger: true,
        onConfirmAction: "clearAllDataConfirmed",
      });
    },
    async clearAllDataConfirmed() {
      App.UI.Modal.close();
      try {
        await App.Store.clearAllData();
        App.UI.Toast.show("Todos os dados foram apagados.", "success");
        renderView();
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível limpar os dados.", "error");
      }
    },

    /* ---------------------------------------------------------------- *
     * FASE 7 — BACKUP (exportar/importar em JSON)
     * App.DB.exportAll()/importAll() já existem desde a Fase 0 — este é
     * só o fio que liga isso a um botão. Tudo roda no navegador (Blob +
     * <a download>, FileReader do input local): nenhum dado passa por
     * rede em nenhum momento, mesmo princípio de privacidade da Fase 6.
     * ---------------------------------------------------------------- */
    async exportData() {
      try {
        const payload = await App.DB.exportAll();
        const json = JSON.stringify(payload, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `execucao-backup-${App.Utils.todayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        App.UI.Toast.show("Backup exportado.", "success");
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível exportar os dados.", "error");
      }
    },
    triggerImportFile() {
      const input = document.getElementById("importFileInput");
      if (input) input.click();
    },
    // Disparado pelo <input type="file"> (data-action-change) quando o
    // usuário escolhe um arquivo — só guarda o arquivo e pede confirmação,
    // já que importar SUBSTITUI todos os dados atuais (App.DB.importAll
    // não faz merge).
    importDataFile(el) {
      const file = el.files && el.files[0];
      el.value = ""; // permite escolher o mesmo arquivo de novo depois, se precisar
      if (!file) return;
      pendingImportFile = file;
      App.UI.confirmDialog({
        title: "Importar backup?",
        message: `Isso substitui TODOS os dados atuais deste navegador pelo conteúdo de "${file.name}". Não é possível desfazer — se quiser manter o que tem agora, exporte um backup antes de continuar.`,
        confirmLabel: "Importar e substituir",
        danger: true,
        onConfirmAction: "confirmImportData",
      });
    },
    async confirmImportData() {
      App.UI.Modal.close();
      const file = pendingImportFile;
      pendingImportFile = null;
      if (!file) return;
      try {
        const text = await file.text();
        const payload = JSON.parse(text);
        await App.DB.importAll(payload);
        await App.Store.reloadAll();
        // Mesmo gatilho de sempre (ver syncAchievements) — reavalia
        // conquistas e insights sobre os dados recém-importados.
        await App.Store.syncAchievements();
        App.UI.Toast.show("Dados importados com sucesso.", "success");
        renderView();
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível importar esse arquivo — verifique se é um backup válido.", "error");
      }
    },

    modalClose() {
      App.UI.Modal.close();
    },
    modalOverlayClick(el, evt) {
      if (evt.target === el) App.UI.Modal.close();
    },

    // Único handler de "concluir/reabrir atividade" da tela Hoje — chama
    // sempre as ações centrais do Store (nunca escreve status na mão),
    // com feedback visual imediato antes do re-render autoritativo.
    async toggleActivity(el) {
      const kind = el.dataset.kind;
      const ref = el.dataset.ref;
      const date = el.dataset.date;

      // Feedback otimista: alterna a classe visual já no clique, para a
      // transição rodar mesmo que o re-render substitua o DOM em seguida.
      const card = el.closest(".activity-card") || el.closest(".priority-chip");
      if (card) card.classList.toggle("is-done");
      if (el.classList.contains("activity-check") || el.classList.contains("priority-chip-check")) {
        el.classList.toggle("is-done");
      }

      try {
        if (kind === "task") {
          await App.Store.toggleTask(ref);
        } else if (kind === "habit") {
          await App.Store.toggleHabitLog(ref, date);
        }
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível atualizar essa atividade.", "error");
      }
      renderView();
    },

    async saveUserName(el) {
      const value = el.value.trim();
      const settings = App.Store.getById("settings", "app") || App.Models.defaultSettings();
      if (settings.userName === value) return;
      settings.userName = value;
      await App.Store.update("settings", settings);
      App.UI.Toast.show("Nome atualizado.", "success");
      if (App.Router.current === "hoje") renderView();

    async saveActivityForm() {
      const title = document.getElementById("actTitle").value.trim();
      if (!title) {
        App.UI.Toast.show("Dê um nome para a atividade.", "error");
        return;
      }
      const startTime = document.getElementById("actStart").value || null;
      const durationRaw = document.getElementById("actDuration").value;
      const plannedDurationMin = durationRaw !== "" ? Number(durationRaw) : null;
      const endTime = startTime && plannedDurationMin ? App.Utils.addMinutesToTime(startTime, plannedDurationMin) : null;
      const importanceEl = document.querySelector('input[name="actImportance"]:checked');
      const importance = importanceEl ? importanceEl.value : "importante";
      const patch = { title, startTime, endTime, plannedDurationMin, importance };

      const taskIdEl = document.getElementById("actTaskId");
      const taskId = taskIdEl ? taskIdEl.value : "";
      const habitSelectEl = document.getElementById("actHabitId");
      const goalSelectEl = document.getElementById("actGoalId");
      // Duração real (Fase 6): só existe no quickEditForm (edição), nunca
      // na criação — não dá pra saber quanto tempo algo levou antes de
      // acontecer. Alimenta a regra "planejamento otimista".
      const actualDurationEl = document.getElementById("actActualDuration");

      try {
        if (taskId) {
          // Edição rápida: os selects (quando presentes) refletem a escolha
          // explícita do usuário — sem eles, o vínculo existente não muda.
          if (habitSelectEl) patch.habitId = habitSelectEl.value || null;
          if (goalSelectEl) patch.goalId = goalSelectEl.value || null;
          if (actualDurationEl) {
            const actualRaw = actualDurationEl.value;
            patch.actualDurationMin = actualRaw !== "" ? Number(actualRaw) : null;
          }
          await App.Store.updateTaskFields(taskId, patch);
          App.UI.Modal.close();
          App.UI.Toast.show("Atividade atualizada.", "success");
          renderView();
          return;
        }

        const dueDateEl = document.getElementById("actDueDate");
        const dueDate = dueDateEl ? dueDateEl.value : App.Utils.todayISO();
        const contextEl = document.getElementById("actContext");
        const context = contextEl ? contextEl.value.trim() : "";
        const recEl = document.querySelector('input[name="actRecurrence"]:checked');
        const recType = recEl ? recEl.value : "none";
        let recurrence = null;
        if (recType === "diaria") recurrence = { type: "diaria" };
        if (recType === "semanal") {
          const days = Array.from(document.querySelectorAll('input[name="actWeekday"]:checked')).map((i) => Number(i.value));
          recurrence = days.length ? { type: "semanal", days } : null;
        }

        // "Detectar automaticamente" (padrão) preserva a inferência por
        // nome sem pedir confirmação manual; as outras opções do select
        // (quando o usuário mexeu nele) são a escolha explícita dele —
        // inclusive "Nenhum hábito", que precisa poder desligar a
        // inferência de propósito (ex.: título parecido, mas não é o hábito).
        const habitSelectVal = habitSelectEl ? habitSelectEl.value : "__auto__";
        let habit = null;
        if (habitSelectVal === "__auto__") {
          habit = App.Selectors.inferHabitLink(title);
        } else if (habitSelectVal) {
          habit = App.Store.getById("habits", habitSelectVal);
        }
        const goalId = goalSelectEl && goalSelectEl.value ? goalSelectEl.value : null;
        const created = await App.Store.createTask(
          Object.assign({}, patch, { dueDate, context, recurrence, habitId: habit ? habit.id : null, goalId })
        );

        const inboxIdEl = document.getElementById("actInboxId");
        const inboxId = inboxIdEl ? inboxIdEl.value : "";
        if (inboxId) await App.Store.linkInboxToTask(inboxId, created.id);

        await App.Store.ensureRecurrenceInstancesForDate(dueDate);

        App.UI.Modal.close();
        App.UI.Toast.show(habit ? `Atividade criada — vinculada ao hábito "${habit.name}".` : "Atividade criada.", "success");
        renderView();
      } catch (err) {
        console.error(err);
        App.UI.Toast.show("Não foi possível salvar a atividade.", "error");
      }
    },

        const count = Number(document.getElementById("habitFreqCountInput").value) || 3;

          App.UI.Toast.show("Hábito atualizado.", "success");
