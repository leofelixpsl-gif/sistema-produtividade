/* ==== js/router.js ==== */
/* ==========================================================================
   ROUTER — navegação baseada em hash entre as áreas principais
   ==========================================================================
   Apenas 5 áreas de primeiro nível (briefing item 9) + Ajustes (utilitário,
   não conta como "6ª área de produto"). Funcionalidades como Diário,
   Insights, Conquistas etc. NÃO ganham rota própria — elas vão morar
   dentro de uma dessas áreas quando forem construídas nas próximas fases.
   ========================================================================== */
window.App = window.App || {};

(function (global) {
  "use strict";

  const ROUTES = [
    { id: "hoje", label: "Hoje", icon: "hoje", phase: "Fase 1" },
    { id: "planejamento", label: "Planejamento", icon: "planejamento", phase: "Fase 2" },
    { id: "habitos", label: "Hábitos", icon: "habitos", phase: "Fase 3" },
    { id: "metas", label: "Metas", icon: "metas", phase: "Fase 4" },
    { id: "evolucao", label: "Evolução", icon: "evolucao", phase: "Fase 5" },
  ];
  const UTILITY_ROUTE = { id: "ajustes", label: "Ajustes", icon: "ajustes", phase: "" };
  const ALL_ROUTE_IDS = ROUTES.concat(UTILITY_ROUTE).map((r) => r.id);
  const DEFAULT_ROUTE = "hoje";

  let current = DEFAULT_ROUTE;
  const subscribers = new Set();

  function parseHash() {
    const id = (location.hash || "").replace(/^#/, "");
    return ALL_ROUTE_IDS.includes(id) ? id : DEFAULT_ROUTE;
  }

  function notify() {
    subscribers.forEach((fn) => {
      try {
        fn(current);
      } catch (e) {
        console.error("[App.Router] subscriber falhou", e);
      }
    });
  }

  function goTo(routeId) {
    const id = ALL_ROUTE_IDS.includes(routeId) ? routeId : DEFAULT_ROUTE;
    if (location.hash.replace(/^#/, "") !== id) {
      location.hash = id;
      return; // o próprio hashchange dispara render()
    }
    current = id;
    notify();
  }

  function init() {
    current = parseHash();
    window.addEventListener("hashchange", () => {
      current = parseHash();
      notify();
    });
    notify();
  }

  function subscribe(fn) {
    subscribers.add(fn);
    return () => subscribers.delete(fn);
  }

  global.App.Router = {
    ROUTES,
    UTILITY_ROUTE,
    init,
    goTo,
    subscribe,
    get current() {
      return current;
    },
  };
})(window);

/* ==== js/selectors.js ==== */
/* ==========================================================================
   SELECTORS — dados derivados para a tela Hoje (e reaproveitáveis depois)
   ==========================================================================
   Regra desta camada: só LÊ do Store, nunca escreve. Tudo aqui é função
   pura (dado o estado atual, devolve X) — nenhuma view deve recalcular
   essa lógica com as próprias mãos, para não nascerem duas versões
   diferentes de "o que é uma atividade de hoje" pelo app.

   "Atividade" (Fase 1) = uma TAREFA de hoje OU a instância de HOJE de um
   HÁBITO ativo, representadas de forma unificada só para exibição — o
   armazenamento continua sendo `tasks` e `habitLogs`, sem sobreposição.
   ========================================================================== */
window.App = window.App || {};

(function (global) {
  "use strict";

  const Utils = global.App.Utils;

  /* ------------------------------------------------------------------ *
   * Um hábito está "escalado" para hoje?
   * ------------------------------------------------------------------ */
  function isHabitScheduledToday(habit, dateISO) {
    if (!habit.active) return false;
    const freq = habit.frequency || { type: "diaria" };
    if (freq.type === "diaria") return true;
    if (freq.type === "semanal" && Array.isArray(freq.days)) {
      const weekday = new Date(dateISO + "T00:00:00").getDay(); // 0=domingo
      return freq.days.includes(weekday);
    }
    if (freq.type === "x_por_semana") {
      // Mostra o hábito ao longo da semana até a meta ser atingida; some
      // depois de já ter sido cumprido `count` vezes nos últimos 7 dias.
      const weekStart = startOfWeek(dateISO);
      const logs = global.App.Store.getAll("habitLogs").filter(
        (l) => l.habitId === habit.id && l.date >= weekStart && l.date <= dateISO && l.status === "concluido"
      );
      return logs.length < (freq.count || 3);
    }
    return true;
  }

  function startOfWeek(dateISO) {
    const d = new Date(dateISO + "T00:00:00");
    const day = d.getDay(); // 0=domingo .. 6=sábado
    const diff = (day + 6) % 7; // dias desde a segunda-feira
    d.setDate(d.getDate() - diff);
    return Utils.formatISOFromDate(d);
  }

  /* ------------------------------------------------------------------ *
   * Lista unificada de atividades do dia
   * ------------------------------------------------------------------ */
  // Hábitos que o usuário marcou pra NÃO fazer num dia específico (Fase 2,
  // "Prepare seu amanhã") — lido do dailyPlan daquele dia, sem duplicar
  // esse dado em outro lugar.
  function getSkippedHabitIds(dateISO) {
    const plan = global.App.Store.getAll("dailyPlans").find((p) => p.date === dateISO);
    return plan && Array.isArray(plan.skippedHabitIds) ? plan.skippedHabitIds : [];
  }

  function getTodayActivities(dateISO) {
    dateISO = dateISO || Utils.todayISO();
    const Store = global.App.Store;
    const skippedHabitIds = getSkippedHabitIds(dateISO);

    const tasksToday = Store.getAll("tasks").filter((t) => t.dueDate === dateISO || (t.status === "atrasada" && t.dueDate && t.dueDate <= dateISO));

    const taskActivities = tasksToday.map((t) => ({
      kind: "task",
      id: "task:" + t.id,
      refId: t.id,
      title: t.title,
      importance: t.importance,
      weight: t.weight,
      status: t.status, // pendente | em_andamento | concluida | atrasada
      done: t.status === "concluida",
      startTime: t.startTime,
      endTime: t.endTime,
      context: t.context,
      projectId: t.projectId,
      goalId: t.goalId,
      habitId: t.habitId,
      icon: t.icon || (t.habitId ? "habitos" : "taskGeneric"),
      dueDate: t.dueDate,
      completedAt: t.completedAt,
    }));

    const habitActivities = Store.getAll("habits")
      .filter((h) => isHabitScheduledToday(h, dateISO))
      // Evita mostrar duas vezes o mesmo hábito quando ele já tem uma
      // tarefa explícita vinculada para hoje (task.habitId === h.id).
      .filter((h) => !tasksToday.some((t) => t.habitId === h.id))
      .filter((h) => !skippedHabitIds.includes(h.id))
      .map((h) => {
        const log = Store.getAll("habitLogs").find((l) => l.habitId === h.id && l.date === dateISO);
        const status = log ? log.status : "pendente";
        return {
          kind: "habit",
          id: "habit:" + h.id,
          refId: h.id,
          title: h.name,
          importance: h.importance,
          weight: h.weight,
          status: status === "concluido" ? "concluida" : "pendente",
          done: status === "concluido",
          startTime: null,
          endTime: null,
          context: frequencyLabel(h.frequency),
          projectId: null,
          goalId: h.goalId,
          habitId: h.id,
          icon: h.icon && global.App.UI.ICONS[h.icon] ? h.icon : "habitos",
          dueDate: dateISO,
          completedAt: null,
        };
      });

    const all = taskActivities.concat(habitActivities);

    // Ordenação: com horário definido primeiro (por horário), depois por
    // importância (essencial > importante > opcional), depois título.
    all.sort((a, b) => {
      if (a.startTime && b.startTime) return a.startTime.localeCompare(b.startTime);
      if (a.startTime && !b.startTime) return -1;
      if (!a.startTime && b.startTime) return 1;
      if (a.weight !== b.weight) return b.weight - a.weight;
      return a.title.localeCompare(b.title, "pt-BR");
    });

    return all;
  }

  function frequencyLabel(freq) {
    freq = freq || { type: "diaria" };
    if (freq.type === "diaria") return "Todo dia";
    if (freq.type === "semanal") return "Dias específicos da semana";
    if (freq.type === "x_por_semana") return `${freq.count}x por semana`;
    return "";
  }

  /* ------------------------------------------------------------------ *
   * Foco Agora: atividade em andamento pelo horário + próxima atividade
   * ------------------------------------------------------------------ */
  function getFocusNow(activities, now) {
    now = now || new Date();
    const nowHM = pad2(now.getHours()) + ":" + pad2(now.getMinutes());

    const timed = activities.filter((a) => a.startTime && a.endTime);

    const current = timed.find((a) => a.startTime <= nowHM && nowHM <= a.endTime && !a.done) || null;

    const next = timed
      .filter((a) => a.startTime > nowHM && !a.done)
      .sort((a, b) => a.startTime.localeCompare(b.startTime))[0] || null;

    return { current, next };
  }

  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  /* ------------------------------------------------------------------ *
   * Progresso ponderado do dia
   * ------------------------------------------------------------------ */
  function getDayProgress(activities) {
    const totalWeight = activities.reduce((s, a) => s + a.weight, 0);
    const doneWeight = activities.reduce((s, a) => s + (a.done ? a.weight : 0), 0);
    const weightedPct = totalWeight > 0 ? Math.round((doneWeight / totalWeight) * 100) : 0;

    const essentials = activities.filter((a) => a.importance === "essencial");
    const habits = activities.filter((a) => a.kind === "habit");
    const tasksOnly = activities.filter((a) => a.kind === "task");

    return {
      weightedPct,
      total: activities.length,
      done: activities.filter((a) => a.done).length,
      essentialTotal: essentials.length,
      essentialDone: essentials.filter((a) => a.done).length,
      habitsTotal: habits.length,
      habitsDone: habits.filter((a) => a.done).length,
      tasksTotal: tasksOnly.length,
      tasksDone: tasksOnly.filter((a) => a.done).length,
    };
  }

  /* ------------------------------------------------------------------ *
   * Metas trabalhadas hoje — só LEITURA, nunca altera a meta em si
   * (Fase 4 ainda não existe). Considera concluída hoje = tarefa
   * concluída com dueDate/completedAt de hoje, ou habitLog de hoje
   * marcado concluído, quando ligados a uma meta.
   * ------------------------------------------------------------------ */
  function getGoalsWorkedToday(dateISO) {
    dateISO = dateISO || Utils.todayISO();
    const Store = global.App.Store;
    const goalIds = new Set();

    Store.getAll("tasks").forEach((t) => {
      if (t.goalId && t.status === "concluida" && (t.completedAt || "").slice(0, 10) === dateISO) {
        goalIds.add(t.goalId);
      }
    });
    Store.getAll("habitLogs").forEach((log) => {
      if (log.date === dateISO && log.status === "concluido") {
        const habit = Store.getById("habits", log.habitId);
        if (habit && habit.goalId) goalIds.add(habit.goalId);
      }
    });

    return Array.from(goalIds)
      .map((id) => Store.getById("goals", id))
      .filter(Boolean);
  }

  /* ------------------------------------------------------------------ *
   * Insights curtos — regras simples sobre dados que já existem.
   * Sem motor completo (isso é Fase 6): só o que dá pra afirmar hoje.
   * ------------------------------------------------------------------ */
  function weightedPctForDay(dateISO) {
    const activities = getTodayActivities(dateISO);
    // Para dias passados não computamos hábitos "escalados" retroativamente
    // com a mesma regra (evita viés); usamos só tarefas para a média
    // histórica, que é o dado mais estável dia a dia.
    const tasks = global.App.Store.getAll("tasks").filter((t) => t.dueDate === dateISO);
    if (tasks.length === 0) return null;
    const totalWeight = tasks.reduce((s, t) => s + t.weight, 0);
    const doneWeight = tasks.reduce((s, t) => s + (t.status === "concluida" ? t.weight : 0), 0);
    return totalWeight > 0 ? (doneWeight / totalWeight) * 100 : null;
  }

  function getInsights(dateISO) {
    dateISO = dateISO || Utils.todayISO();
    const activities = getTodayActivities(dateISO);
    const progress = getDayProgress(activities);
    const insights = [];

    if (progress.essentialTotal > 0) {
      insights.push(
        progress.essentialDone === progress.essentialTotal
          ? `Você concluiu todas as ${progress.essentialTotal} prioridades essenciais de hoje.`
          : `Você concluiu ${progress.essentialDone} das ${progress.essentialTotal} prioridades essenciais de hoje.`
      );
    }

    // Média das últimas 7 execuções anteriores a hoje, só com dias que
    // tiveram ao menos uma tarefa (dado real, não inventado).
    const pastPcts = [];
    for (let i = 1; i <= 7; i++) {
      const d = new Date(dateISO + "T00:00:00");
      d.setDate(d.getDate() - i);
      const pct = weightedPctForDay(Utils.formatISOFromDate(d));
      if (pct !== null) pastPcts.push(pct);
    }
    if (pastPcts.length >= 2 && progress.tasksTotal > 0) {
      const avg = pastPcts.reduce((s, p) => s + p, 0) / pastPcts.length;
      const todayTaskPct = weightedPctForDay(dateISO) ?? 0;
      const diff = Math.round(todayTaskPct - avg);
      if (Math.abs(diff) >= 5) {
        insights.push(
          diff > 0
            ? `Você está ${diff} pontos acima da sua média de execução desta semana.`
            : `Você está ${Math.abs(diff)} pontos abaixo da sua média de execução desta semana — ainda dá tempo de virar o dia.`
        );
      }
    }

    const goalsToday = getGoalsWorkedToday(dateISO);
    if (goalsToday.length > 0) {
      insights.push(
        goalsToday.length === 1
          ? `Você avançou a meta "${goalsToday[0].title}" hoje.`
          : `Você avançou ${goalsToday.length} metas hoje: ${goalsToday.map((g) => g.title).join(", ")}.`
      );
    }

    return insights.slice(0, 3);
  }

  /* ------------------------------------------------------------------ *
   * Frase curta do dia — determinística por horário + progresso, sem
   * IA/API externa (briefing: inteligência só com regras locais).
   * ------------------------------------------------------------------ */
  function getDayPhrase(progress, now) {
    now = now || new Date();
    const hour = now.getHours();

    if (progress.total === 0) {
      return "Nenhuma atividade planejada para hoje ainda.";
    }
    if (progress.weightedPct >= 100) {
      return "Dia concluído com excelência.";
    }
    if (progress.weightedPct === 0) {
      return hour < 12 ? "Seu dia está pela frente." : "Ainda dá tempo de fazer valer o dia.";
    }
    if (progress.weightedPct >= 70) {
      return "Reta final — quase lá.";
    }
    if (hour < 12) {
      return "Um passo de cada vez.";
    }
    if (hour < 18) {
      return "Bom ritmo. Continue.";
    }
    return "Ainda dá tempo de fechar o dia bem.";
  }

  /* ------------------------------------------------------------------ *
   * FASE 2 — PLANEJAMENTO
   * ------------------------------------------------------------------ */

  function tomorrowISO(fromDateISO) {
    return shiftDateISO(fromDateISO || Utils.todayISO(), 1);
  }

  function shiftDateISO(dateISO, deltaDays) {
    const d = new Date(dateISO + "T00:00:00");
    d.setDate(d.getDate() + deltaDays);
    return Utils.formatISOFromDate(d);
  }

  // Timeline (item 3): mesma lista de atividades do dia (getTodayActivities
  // já é genérica pra qualquer data — reaproveitada tal como está, sem
  // segunda versão), só acrescentando os estados de EXIBIÇÃO que a
  // Timeline precisa mostrar. "em_andamento" e "próximo" só existem hoje,
  // por horário — nunca ficam gravados no status da tarefa.
  function getTimelineForDate(dateISO) {
    dateISO = dateISO || Utils.todayISO();
    const activities = getTodayActivities(dateISO);
    const isToday = dateISO === Utils.todayISO();
    const now = new Date();
    const nowHM = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
    const focus = isToday ? getFocusNow(activities, now) : { current: null, next: null };

    return activities.map((a) => {
      let displayStatus = a.status;
      if (a.status === "pendente" && isToday && a.startTime && a.endTime && a.startTime <= nowHM && nowHM <= a.endTime) {
        displayStatus = "em_andamento";
      }
      const isNext = !!(focus.next && focus.next.id === a.id);
      return Object.assign({}, a, { displayStatus, isNext });
    });
  }

  // Inferência (item 2): "Estudar inglês" associa sozinho ao hábito
  // "Inglês" já cadastrado, sem pedir confirmação manual — comparação
  // simples e sem acento/caixa, nas duas direções (título contém o nome
  // do hábito, ou vice-versa).
  function inferHabitLink(title) {
    const norm = Utils.normalizeText(title);
    if (!norm) return null;
    const habits = global.App.Store.getAll("habits").filter((h) => h.active);
    return (
      habits.find((h) => {
        const hn = Utils.normalizeText(h.name);
        return hn && (norm.includes(hn) || hn.includes(norm));
      }) || null
    );
  }

  // Inbox (item 9): só os itens ainda não convertidos em tarefa.
  function getInboxItems() {
    return global.App.Store
      .getAll("inboxItems")
      .filter((i) => !i.convertedTaskId)
      .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  }

  // Hábitos escalados pra uma data, com a flag de "pulado nesse dia" — usado
  // pela seção de hábitos do "Prepare seu amanhã" (mostra TODOS, mesmo os
  // pulados, pra permitir reativar; a Timeline em si já filtra os pulados).
  function getHabitsScheduledFor(dateISO) {
    const skipped = new Set(getSkippedHabitIds(dateISO));
    return global.App.Store
      .getAll("habits")
      .filter((h) => h.active && isHabitScheduledToday(h, dateISO))
      .map((h) => ({ habit: h, skipped: skipped.has(h.id) }));
  }

  /* ------------------------------------------------------------------ *
   * FASE 3 — HÁBITOS
   * ------------------------------------------------------------------ */

  function daysSinceISO(dateISO) {
    const d = new Date(dateISO + "T00:00:00");
    const today = new Date(Utils.todayISO() + "T00:00:00");
    return Math.round((today - d) / 86400000);
  }

  function buildHabitLogsByDate(habitId) {
    const map = {};
    global.App.Store.getAll("habitLogs").forEach((l) => {
      if (l.habitId === habitId) map[l.date] = l.status;
    });
    return map;
  }

  // Status de UM dia específico pro calendário de aderência — nunca lido
  // direto de habitLogs por uma view; sempre passa por aqui, que já
  // resolve "fora do período", "antes de existir", "futuro" e "fora da
  // frequência" (dia que nem era esperado, não conta como falha).
  function getHabitDayStatus(habit, dateISO, logsByDate) {
    const today = Utils.todayISO();
    const createdDate = (habit.createdAt || today).slice(0, 10);
    if (dateISO > today) return "future";
    if (dateISO < createdDate) return "before_creation";
    if (!isHabitScheduledToday(habit, dateISO)) return "not_scheduled";
    const map = logsByDate || buildHabitLogsByDate(habit.id);
    const status = map[dateISO];
    return status && status !== "pendente" ? status : "not_marked";
  }

  // Sequência atual e recorde (item 6). Um dia só entra na conta quando o
  // hábito estava escalado nele (dias fora da frequência nem somam nem
  // quebram); HOJE nunca zera a sequência sozinho — só quando o dia
  // termina sem marcação é que ele conta como quebra, então quem abre o
  // app de manhã não vê "sequência quebrada" antes mesmo do dia acontecer.
  function computeHabitStreaks(habit) {
    const today = Utils.todayISO();
    const createdDate = (habit.createdAt || today).slice(0, 10);
    const logsByDate = buildHabitLogsByDate(habit.id);

    let running = 0;
    let best = 0;
    let lastBrokenLength = 0;
    let lastBrokenAt = null;
    let cursor = createdDate;

    while (cursor <= today) {
      if (isHabitScheduledToday(habit, cursor)) {
        const status = logsByDate[cursor];
        if (status === "concluido") {
          running += 1;
          if (running > best) best = running;
        } else if (cursor < today) {
          if (running > 0) {
            lastBrokenLength = running;
            lastBrokenAt = cursor;
          }
          running = 0;
        }
        // cursor === today e ainda não concluído: o dia está em curso,
        // não mexe na sequência (evita soar punitivo antes da hora).
      }
      cursor = shiftDateISO(cursor, 1);
    }

    return { current: running, best, lastBrokenLength, lastBrokenAt };
  }

  // Aderência (%) num período — `days` null = desde a criação do hábito.
  // null como retorno (em vez de 0%) quando ainda não houve nenhum dia
  // escalado no período, pra UI mostrar "—" em vez de um 0% enganoso.
  function computeHabitAdherence(habit, days) {
    const today = Utils.todayISO();
    const createdDate = (habit.createdAt || today).slice(0, 10);
    const rangeStart = days ? shiftDateISO(today, -(days - 1)) : createdDate;
    const start = rangeStart < createdDate ? createdDate : rangeStart;
    const logsByDate = buildHabitLogsByDate(habit.id);

    let scheduled = 0;
    let done = 0;
    let cursor = start;
    while (cursor <= today) {
      if (isHabitScheduledToday(habit, cursor)) {
        scheduled += 1;
        const status = logsByDate[cursor];
        if (status === "concluido") done += 1;
        else if (status === "parcial") done += 0.5;
      }
      cursor = shiftDateISO(cursor, 1);
    }
    return scheduled > 0 ? Math.round((done / scheduled) * 100) : null;
  }

  // Progresso da semana atual (seg..dom) — usado no mini-resumo do card
  // do dashboard, pra "compreender a aderência em poucos segundos".
  function getHabitWeekProgress(habit) {
    const today = Utils.todayISO();
    const monday = startOfWeek(today);
    const logsByDate = buildHabitLogsByDate(habit.id);
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = shiftDateISO(monday, i);
      let status;
      if (d > today) status = "future";
      else status = getHabitDayStatus(habit, d, logsByDate);
      days.push({ dateISO: d, status });
    }
    return days;
  }

  // Grade do calendário de aderência (item 4): semanas em colunas, dias
  // da semana em linhas — alinhado à segunda-feira mais próxima antes do
  // início do período, pra desenhar em colunas completas.
  function getHabitHeatmapWeeks(habit, days) {
    const today = Utils.todayISO();
    const rangeStart = shiftDateISO(today, -(days - 1));
    const startWeekday = new Date(rangeStart + "T00:00:00").getDay();
    const pad = (startWeekday + 6) % 7;
    const gridStart = shiftDateISO(rangeStart, -pad);
    const logsByDate = buildHabitLogsByDate(habit.id);

    const weeks = [];
    let week = [];
    let cursor = gridStart;
    while (cursor <= today) {
      const inRange = cursor >= rangeStart;
      week.push({
        dateISO: cursor,
        status: inRange ? getHabitDayStatus(habit, cursor, logsByDate) : "out_of_range",
      });
      if (new Date(cursor + "T00:00:00").getDay() === 0) {
        weeks.push(week);
        week = [];
      }
      cursor = shiftDateISO(cursor, 1);
    }
    if (week.length) weeks.push(week);

    // Um hábito com poucas semanas de vida, visto num período de 90 ou 365
    // dias, teria um vazio enorme antes de existir — tecnicamente correto,
    // mas parece quebrado. Apara as semanas do início totalmente "vazias"
    // (antes da criação e/ou fora do período de alinhamento à segunda —
    // ambos já renderizam transparentes/não-clicáveis), nunca mexendo em
    // vazios legítimos no meio/fim do período.
    while (weeks.length && weeks[0].every((d) => d.status === "before_creation" || d.status === "out_of_range")) {
      weeks.shift();
    }
    return weeks;
  }

  function getHabitsOverview() {
    return global.App.Store
      .getAll("habits")
      .filter((h) => h.active)
      .map((h) => ({
        habit: h,
        adherence30: computeHabitAdherence(h, 30),
        streaks: computeHabitStreaks(h),
        week: getHabitWeekProgress(h),
      }));
  }

  function getArchivedHabits() {
    return global.App.Store.getAll("habits").filter((h) => !h.active);
  }

  /* ------------------------------------------------------------------ *
   * FASE 4 — METAS
   * Objetivo → Meta → Hábitos/Tarefas (item 1): cada função abaixo lê
   * `goalId`/`objectiveId` — já existentes em tasks/habits/goals desde a
   * Fase 0 — sem nenhuma store nova. Progresso e ritmo são computados por
   * TIPO de meta (item 2/5), nunca de um jeito genérico só.
   * ------------------------------------------------------------------ */

  // Diferença em dias (b - a) entre duas datas ISO, sem depender de fuso —
  // generaliza daysSinceISO (que só compara contra hoje) pra duas datas
  // quaisquer (necessário pro cálculo de ritmo, item 5).
  function daysBetweenISO(fromISO, toISO) {
    const a = new Date(fromISO + "T00:00:00");
    const b = new Date(toISO + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }

  // Progresso (0-100) no formato que faz sentido pro TIPO da meta —
  // `null` quando o tipo não comporta um número (briefing item 2: "nem
  // toda meta possui unidade de medida"), nunca um 0% enganoso.
  function computeGoalProgress(goal) {
    if (goal.type === "quantitativa" || goal.type === "percentual") {
      if (typeof goal.targetValue !== "number" || goal.targetValue <= 0) return null;
      const current = typeof goal.currentValue === "number" ? goal.currentValue : 0;
      return Utils.clamp(Math.round((current / goal.targetValue) * 100), 0, 100);
    }
    if (goal.type === "marco") {
      if (!Array.isArray(goal.milestones) || goal.milestones.length === 0) return null;
      const done = goal.milestones.filter((m) => m.done).length;
      return Math.round((done / goal.milestones.length) * 100);
    }
    if (goal.type === "conclusao") {
      return goal.status === "concluida" ? 100 : 0;
    }
    if (goal.type === "data") {
      // Sem tarefa vinculada, uma meta de data não tem "progresso", só
      // prazo (ver getGoalDeadlineInfo) — não inventa um número aqui.
      const linked = getGoalLinkedTasks(goal.id);
      if (linked.length === 0) return goal.status === "concluida" ? 100 : null;
      const done = linked.filter((t) => t.status === "concluida").length;
      return Math.round((done / linked.length) * 100);
    }
    return null; // qualitativa: de propósito sem indicador numérico (item 5)
  }

  // Ritmo (item 5) — só quando há valor-alvo E prazo; sem os dois,
  // "progresso esperado"/"ritmo necessário" não têm como existir.
  // Heurística de status (documentada porque é uma escolha de produto, não
  // algo pedido literalmente): compara o progresso atual com o esperado
  // pra essa altura do prazo, com tolerância pra não marcar "atenção" por
  // pequenas oscilações — >=5 pontos à frente/perto do esperado = no
  // ritmo, até 15 = atenção, mais que isso = atrasado.
  function computeGoalPace(goal) {
    if (goal.type !== "quantitativa" && goal.type !== "percentual") return null;
    if (typeof goal.targetValue !== "number" || goal.targetValue <= 0) return null;
    if (!goal.deadline) return null;
    const createdDate = (goal.createdAt || Utils.todayISO()).slice(0, 10);
    const today = Utils.todayISO();
    const totalDays = daysBetweenISO(createdDate, goal.deadline);
    if (totalDays <= 0) return null; // prazo não-futuro em relação à criação — sem janela pra tracejar ritmo

    const current = typeof goal.currentValue === "number" ? goal.currentValue : 0;
    const elapsedDays = Utils.clamp(daysBetweenISO(createdDate, today), 0, totalDays);
    const remainingDays = Math.max(0, totalDays - elapsedDays);
    const currentPct = Utils.clamp((current / goal.targetValue) * 100, 0, 100);
    const expectedPct = Utils.clamp((elapsedDays / totalDays) * 100, 0, 100);
    const remainingValue = Math.max(0, goal.targetValue - current);

    const paceNeeded = remainingDays > 0 ? remainingValue / remainingDays : remainingValue;
    const paceActual = elapsedDays > 0 ? current / elapsedDays : current;
    const diff = expectedPct - currentPct;
    const status = diff <= 5 ? "no_ritmo" : diff <= 15 ? "atencao" : "atrasado";

    return {
      currentPct: Math.round(currentPct),
      expectedPct: Math.round(expectedPct),
      paceNeeded,
      paceActual,
      status,
      remainingDays,
    };
  }

  // Distância até o prazo, em texto pronto pra exibir — usado no card e
  // no detalhe (item 4). Só existe quando a meta tem `deadline`.
  function getGoalDeadlineInfo(goal) {
    if (!goal.deadline) return null;
    if (goal.status === "concluida") return { label: "Concluída", tone: "success" };
    const today = Utils.todayISO();
    const diff = daysBetweenISO(today, goal.deadline);
    if (diff < 0) return { label: `Atrasada há ${Math.abs(diff)} ${Math.abs(diff) === 1 ? "dia" : "dias"}`, tone: "danger" };
    if (diff === 0) return { label: "Vence hoje", tone: "warning" };
    if (diff <= 7) return { label: `Vence em ${diff} ${diff === 1 ? "dia" : "dias"}`, tone: "warning" };
    return { label: `Vence em ${Utils.formatDateBR(goal.deadline)}`, tone: "neutral" };
  }

  // Tarefas/hábitos vinculados a uma meta (item 7: "quais atividades estão
  // contribuindo") — só leitura, junta o que já existe em tasks/habits via
  // goalId, sem duplicar esse vínculo em outro lugar.
  function getGoalLinkedTasks(goalId) {
    return global.App.Store.getAll("tasks").filter((t) => t.goalId === goalId);
  }
  function getGoalLinkedHabits(goalId) {
    return global.App.Store.getAll("habits").filter((h) => h.goalId === goalId);
  }

  // "Atividade recente" (item 4, no card, e item 7 no detalhe): tarefas
  // concluídas + logs de hábito concluídos vinculados a esta meta,
  // mais recentes primeiro.
  function getGoalRecentActivity(goalId, limit) {
    limit = limit || 5;
    const Store = global.App.Store;
    const fromTasks = getGoalLinkedTasks(goalId)
      .filter((t) => t.status === "concluida" && t.completedAt)
      .map((t) => ({ kind: "task", title: t.title, at: t.completedAt }));
    const habitIds = getGoalLinkedHabits(goalId).map((h) => h.id);
    const fromHabits = Store.getAll("habitLogs")
      .filter((l) => habitIds.includes(l.habitId) && l.status === "concluido")
      .map((l) => {
        const habit = Store.getById("habits", l.habitId);
        return { kind: "habit", title: habit ? habit.name : "Hábito", at: l.date + "T12:00:00.000Z" };
      });
    return fromTasks
      .concat(fromHabits)
      .sort((a, b) => b.at.localeCompare(a.at))
      .slice(0, limit);
  }

  // Painel principal de Metas: só as ativas, já com progresso/ritmo/última
  // atividade computados — a view nunca recalcula isso com as próprias mãos.
  function getGoalsOverview() {
    return global.App.Store
      .getAll("goals")
      .filter((g) => g.status === "ativa")
      .map((g) => ({
        goal: g,
        progress: computeGoalProgress(g),
        pace: computeGoalPace(g),
        deadlineInfo: getGoalDeadlineInfo(g),
        recent: getGoalRecentActivity(g.id, 1)[0] || null,
      }));
  }

  // Metas fora do ciclo ativo (pausada/concluída/abandonada) — mesma ideia
  // da lista de hábitos arquivados (Fase 3), coletada à parte pra não
  // poluir o painel principal.
  function getInactiveGoals() {
    return global.App.Store.getAll("goals").filter((g) => g.status !== "ativa");
  }

  // Hierarquia (item 1): objetivos que têm pelo menos uma meta ATIVA,
  // cada um já com suas metas resolvidas — "nenhuma relação obrigatória"
  // significa que um objetivo sem meta nenhuma simplesmente não aparece
  // aqui (não é um erro, só não há o que agrupar ainda).
  function getObjectivesOverview() {
    const Store = global.App.Store;
    const activeGoals = Store.getAll("goals").filter((g) => g.status === "ativa");
    return Store.getAll("objectives")
      .map((o) => ({ objective: o, goals: activeGoals.filter((g) => g.objectiveId === o.id) }))
      .filter((group) => group.goals.length > 0);
  }

  // Metas ativas sem objetivo — inclui de propósito uma meta cujo
  // objectiveId aponta pra um objetivo que não existe mais (ex.: objetivo
  // excluído), pra ela nunca "desaparecer" do painel principal.
  function getGoalsWithoutObjective() {
    const Store = global.App.Store;
    return Store.getAll("goals").filter((g) => g.status === "ativa" && (!g.objectiveId || !Store.getById("objectives", g.objectiveId)));
  }

  /* ------------------------------------------------------------------ *
   * FASE 5 — EVOLUÇÃO
   * Quatro indicadores operacionais (item 3), cada um medindo UMA coisa
   * específica — nunca uma nota genérica de "quão bem você está indo"
   * (briefing: "não tratar esses números como nota de valor pessoal").
   * Todos retornam `value: null` (nunca 0) quando não há dado suficiente
   * no período, mesmo princípio já usado em Hábitos/Metas.
   * ------------------------------------------------------------------ */

  function getPeriodDates(days, endDateISO) {
    const end = endDateISO || Utils.todayISO();
    const dates = [];
    for (let i = days - 1; i >= 0; i--) dates.push(shiftDateISO(end, -i));
    return dates;
  }

  function previousPeriodEnd(days, endDateISO) {
    return shiftDateISO(endDateISO || Utils.todayISO(), -days);
  }

  // Execução de UM dia: tarefas com prazo nesse dia + hábitos escalados
  // nesse dia, ponderados por importância (mesmo peso de getDayProgress).
  // Não reaproveita getTodayActivities aqui de propósito: ela arrasta
  // tarefas 'atrasada' pra TODOS os dias entre o vencimento original e
  // hoje, o que contaria a mesma tarefa várias vezes numa agregação por
  // período. 'pulada' não pesa nem a favor nem contra (não foi planejada
  // de propósito, então não é "não executada").
  function computeDayExecution(dateISO) {
    const Store = global.App.Store;
    const tasks = Store.getAll("tasks").filter((t) => t.dueDate === dateISO);
    const habits = Store.getAll("habits").filter((h) => isHabitScheduledToday(h, dateISO));
    const logsToday = Store.getAll("habitLogs").filter((l) => l.date === dateISO);

    let totalWeight = 0;
    let doneWeight = 0;
    let essentialTotal = 0;
    let essentialDone = 0;

    tasks.forEach((t) => {
      if (t.status === "pulada") return;
      totalWeight += t.weight;
      if (t.status === "concluida") doneWeight += t.weight;
      if (t.importance === "essencial") {
        essentialTotal += t.weight;
        if (t.status === "concluida") essentialDone += t.weight;
      }
    });
    habits.forEach((h) => {
      totalWeight += h.weight;
      const log = logsToday.find((l) => l.habitId === h.id);
      const status = log ? log.status : "pendente";
      const frac = status === "concluido" ? 1 : status === "parcial" ? 0.5 : 0;
      doneWeight += h.weight * frac;
      if (h.importance === "essencial") {
        essentialTotal += h.weight;
        essentialDone += h.weight * frac;
      }
    });

    return {
      date: dateISO,
      totalWeight,
      doneWeight,
      pct: totalWeight > 0 ? Math.round((doneWeight / totalWeight) * 100) : null,
      essentialTotal,
      essentialDone,
      tasksScheduled: tasks.filter((t) => t.status !== "pulada").length,
      tasksDone: tasks.filter((t) => t.status === "concluida").length,
    };
  }

  // Um dia "planejado com antecedência" (item 4: "diferença entre
  // planejamento e execução") = tarefa com prazo nesse dia mas CRIADA
  // antes dele começar. Sem tarefas assim no dia, não há o que comparar
  // (null, não 0%) — não confundir com "não planejou nada".
  function computeDayPlanningRatio(dateISO) {
    const Store = global.App.Store;
    const tasks = Store.getAll("tasks").filter((t) => t.dueDate === dateISO && t.status !== "pulada");
    const planned = tasks.filter((t) => (t.createdAt || "").slice(0, 10) < dateISO);
    if (planned.length === 0) return null;
    const done = planned.filter((t) => t.status === "concluida").length;
    return Math.round((done / planned.length) * 100);
  }

  function averagePct(series) {
    const withData = series.filter((s) => s.pct !== null);
    if (withData.length === 0) return null;
    return Math.round(withData.reduce((s, d) => s + d.pct, 0) / withData.length);
  }

  // Tendência = média do período atual menos a média do MESMO tamanho de
  // período imediatamente anterior — só pra mostrar uma seta de
  // subindo/caindo/estável no painel, nunca um julgamento de valor.
  function indicatorWithTrend(currentSeries, previousSeries) {
    const value = averagePct(currentSeries);
    const previous = averagePct(previousSeries);
    return { value, trend: value !== null && previous !== null ? value - previous : null };
  }

  // EXECUÇÃO: quanto foi realizado, ponderado por importância.
  function computeExecucao(days) {
    const current = getPeriodDates(days).map((d) => ({ date: d, pct: computeDayExecution(d).pct }));
    const previous = getPeriodDates(days, previousPeriodEnd(days)).map((d) => ({ date: d, pct: computeDayExecution(d).pct }));
    return Object.assign({ series: current }, indicatorWithTrend(current, previous));
  }

  // FOCO: quanto das prioridades (essenciais) foi respeitado — só olha a
  // fatia essencial da execução, nunca o total.
  function computeFoco(days) {
    const dayFocus = (d) => {
      const e = computeDayExecution(d);
      return e.essentialTotal > 0 ? Math.round((e.essentialDone / e.essentialTotal) * 100) : null;
    };
    const current = getPeriodDates(days).map((d) => ({ date: d, pct: dayFocus(d) }));
    const previous = getPeriodDates(days, previousPeriodEnd(days)).map((d) => ({ date: d, pct: dayFocus(d) }));
    return Object.assign({ series: current }, indicatorWithTrend(current, previous));
  }

  // PLANEJAMENTO: do que foi planejado com antecedência, quanto foi
  // executado — a "diferença entre planejamento e execução" do briefing,
  // expressa como proximidade (100% = sem diferença nenhuma).
  function computePlanejamento(days) {
    const current = getPeriodDates(days).map((d) => ({ date: d, pct: computeDayPlanningRatio(d) }));
    const previous = getPeriodDates(days, previousPeriodEnd(days)).map((d) => ({ date: d, pct: computeDayPlanningRatio(d) }));
    return Object.assign({ series: current }, indicatorWithTrend(current, previous));
  }

  // CONSISTÊNCIA: regularidade, não volume — % dos dias com algo planejado
  // em que a execução passou de um piso mínimo (50%). Dois dias a 100% e
  // três a 0% pesam diferente de cinco dias sólidos a 60% — mesmo que a
  // MÉDIA geral seja parecida, só o segundo caso é "regular".
  const CONSISTENCY_THRESHOLD = 50;
  function computeConsistencia(days) {
    function ratio(series) {
      const scheduled = series.filter((d) => d.pct !== null);
      if (scheduled.length === 0) return null;
      return Math.round((scheduled.filter((d) => d.pct >= CONSISTENCY_THRESHOLD).length / scheduled.length) * 100);
    }
    const current = getPeriodDates(days).map((d) => ({ date: d, pct: computeDayExecution(d).pct }));
    const previous = getPeriodDates(days, previousPeriodEnd(days)).map((d) => ({ date: d, pct: computeDayExecution(d).pct }));
    const value = ratio(current);
    const previousValue = ratio(previous);
    return { value, trend: value !== null && previousValue !== null ? value - previousValue : null, series: current };
  }

  // Resumo de Hábitos/Metas pro painel (item 1: a visão geral também inclui
  // essas duas, ao lado dos 4 indicadores — mas como resumo, não recalcula
  // o que as telas de Hábitos/Metas já mostram em detalhe).
  function computeHabitsIndicatorSummary(days) {
    const Store = global.App.Store;
    const habits = Store.getAll("habits").filter((h) => h.active);
    const adherences = habits.map((h) => computeHabitAdherence(h, days)).filter((v) => v !== null);
    return {
      avgAdherence: adherences.length ? Math.round(adherences.reduce((s, v) => s + v, 0) / adherences.length) : null,
      activeCount: habits.length,
    };
  }
  function computeGoalsIndicatorSummary(days) {
    const Store = global.App.Store;
    const since = shiftDateISO(Utils.todayISO(), -(days - 1));
    return {
      activeCount: Store.getAll("goals").filter((g) => g.status === "ativa").length,
      concludedInPeriod: Store.getAll("goals").filter((g) => g.status === "concluida" && (g.updatedAt || "").slice(0, 10) >= since).length,
    };
  }

  function getEvolutionOverview(days) {
    return {
      days,
      execucao: computeExecucao(days),
      consistencia: computeConsistencia(days),
      foco: computeFoco(days),
      planejamento: computePlanejamento(days),
      habits: computeHabitsIndicatorSummary(days),
      goals: computeGoalsIndicatorSummary(days),
    };
  }

  /* ---- Fechamento do dia (item 5) ---- */
  function habitLogStatusOn(habitId, dateISO) {
    const log = global.App.Store.getAll("habitLogs").find((l) => l.habitId === habitId && l.date === dateISO);
    return log ? log.status : "pendente";
  }

  function getDayClosing(dateISO) {
    dateISO = dateISO || Utils.todayISO();
    const Store = global.App.Store;
    const tasks = Store.getAll("tasks").filter((t) => t.dueDate === dateISO);
    const completedTasks = tasks.filter((t) => t.status === "concluida");
    const pendingTasks = tasks.filter((t) => t.status !== "concluida" && t.status !== "pulada");
    const essentials = tasks.filter((t) => t.importance === "essencial");
    const essentialsDone = essentials.filter((t) => t.status === "concluida");
    const habitsScheduled = Store.getAll("habits").filter((h) => h.active && isHabitScheduledToday(h, dateISO));
    const habitsDone = habitsScheduled.filter((h) => habitLogStatusOn(h.id, dateISO) === "concluido");
    const goalsWorked = getGoalsWorkedToday(dateISO);
    const exec = computeDayExecution(dateISO);

    // Ao menos uma informação útil (item 5): comparação com a média dos
    // 7 dias anteriores que tiveram algo planejado — nunca só o número cru.
    const priorPcts = [];
    for (let i = 1; i <= 7; i++) {
      const p = computeDayExecution(shiftDateISO(dateISO, -i)).pct;
      if (p !== null) priorPcts.push(p);
    }
    const avgPrior = priorPcts.length ? Math.round(priorPcts.reduce((s, p) => s + p, 0) / priorPcts.length) : null;

    return {
      date: dateISO,
      pct: exec.pct,
      tasksTotal: tasks.filter((t) => t.status !== "pulada").length,
      tasksDone: completedTasks.length,
      tasksPending: pendingTasks,
      essentialsTotal: essentials.length,
      essentialsDone: essentialsDone.length,
      habitsTotal: habitsScheduled.length,
      habitsDone: habitsDone.length,
      goalsWorked,
      comparison: { avgPrior, diff: exec.pct !== null && avgPrior !== null ? exec.pct - avgPrior : null },
    };
  }

  /* ---- Check-in noturno (item 4) ---- */
  function getNightlyCheckin(dateISO) {
    dateISO = dateISO || Utils.todayISO();
    return global.App.Store.getAll("checkins").find((c) => c.date === dateISO && c.type === "daily") || null;
  }

  /* ---- Diário (item 6) ---- */
  function getJournalEntries(limit) {
    const entries = global.App.Store
      .getAll("journalEntries")
      .slice()
      .sort((a, b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
    return limit ? entries.slice(0, limit) : entries;
  }

  /* ---- Conquistas (item 7) — catálogo completo (desbloqueadas +
     bloqueadas), pra a tela poder mostrar "o que vem a seguir" sem
     estética infantil: bloqueadas aparecem discretas, não como enigma. ---- */
  function getAchievementsCatalog() {
    const Store = global.App.Store;
    const unlocked = Store.getAll("achievements");
    return Store.ACHIEVEMENT_RULES.map((rule) => {
      const found = unlocked.find((a) => a.criteria === rule.key);
      return {
        key: rule.key,
        title: rule.title,
        description: rule.description,
        icon: rule.icon,
        achieved: !!found,
        unlockedAt: found ? found.unlockedAt : null,
      };
    }).sort((a, b) => {
      if (a.achieved !== b.achieved) return a.achieved ? -1 : 1;
      if (a.achieved && b.achieved) return (b.unlockedAt || "").localeCompare(a.unlockedAt || "");
      return 0;
    });
  }

  /* ---- Histórico (item 8) — timeline consolidada, sem duplicar dado:
     lê `history` (Fase 1) + checkins + diário + conquistas, cada um já
     armazenado no lugar certo desde que nasceu. ---- */
  const HISTORY_ACTION_LABEL = {
    criada: "criada",
    concluida: "concluída",
    reaberta: "reaberta",
    editada: "editada",
    reagendada: "reagendada",
    pulada: "marcada como não realizada",
    excluida: "excluída",
    concluido: "concluído",
    parcial: "marcado como parcial",
    nao_realizado: "marcado como não realizado",
    pendente: "reaberto",
    ativa: "reativada",
    pausada: "pausada",
    abandonada: "abandonada",
    valor_atualizado: "valor atualizado",
    marco_atualizado: "marco atualizado",
    checkin_noturno: "registrado",
  };
  const HISTORY_ENTITY_LABEL = { task: "Tarefa", habit: "Hábito", goal: "Meta", checkin: "Check-in" };

  function describeHistoryEntry(h) {
    const Store = global.App.Store;
    let title = "";
    if (h.entity === "task") title = (Store.getById("tasks", h.entityId) || {}).title || "Tarefa removida";
    else if (h.entity === "habit") title = (Store.getById("habits", h.entityId) || {}).name || "Hábito removido";
    else if (h.entity === "goal") title = (Store.getById("goals", h.entityId) || {}).title || "Meta removida";
    else if (h.entity === "checkin") title = "Check-in noturno";
    const actionLabel = HISTORY_ACTION_LABEL[h.action] || h.action;
    return `${HISTORY_ENTITY_LABEL[h.entity] || ""} "${title}" — ${actionLabel}`.trim();
  }

  function getEvolutionHistory(days) {
    const Store = global.App.Store;
    const since = shiftDateISO(Utils.todayISO(), -(days - 1));
    // Exclui entity:'checkin' daqui — o check-in noturno já vira sua PRÓPRIA
    // linha abaixo (fromCheckins, com mais detalhe), então incluir a entrada
    // genérica de `history` também duplicaria o mesmo evento na timeline.
    const fromHistory = Store.getAll("history")
      .filter((h) => h.date >= since && h.entity !== "checkin")
      .map((h) => ({ kind: "history", date: h.date, at: h.timestamp, text: describeHistoryEntry(h) }));
    const fromCheckins = Store.getAll("checkins")
      .filter((c) => c.type === "daily" && c.date >= since)
      .map((c) => ({ kind: "checkin", date: c.date, at: c.createdAt, checkin: c }));
    const fromJournal = Store.getAll("journalEntries")
      .filter((j) => j.date >= since)
      .map((j) => ({ kind: "journal", date: j.date, at: j.createdAt, entry: j }));
    const fromAchievements = Store.getAll("achievements")
      .filter((a) => (a.unlockedAt || "").slice(0, 10) >= since)
      .map((a) => ({ kind: "achievement", date: (a.unlockedAt || "").slice(0, 10), at: a.unlockedAt, achievement: a }));
    return fromHistory
      .concat(fromCheckins, fromJournal, fromAchievements)
      .sort((a, b) => (b.at || "").localeCompare(a.at || ""));
  }

  global.App.Selectors = {
    isHabitScheduledToday,
    getTodayActivities,
