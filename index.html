<script>
/* ==== js/utils.js ==== */
/* ==========================================================================
   UTILS — funções puras compartilhadas por todo o app
   Carregar ANTES de qualquer outro módulo (models, db, store, ui, views...).
   ========================================================================== */
window.App = window.App || {};

(function (global) {
  "use strict";

  function uid() {
    // id local simples, suficiente para uma base 100% client-side.
    return (
      Date.now().toString(36) +
      "-" +
      Math.random().toString(36).slice(2, 10)
    );
  }

  function nowISO() {
    return new Date().toISOString();
  }

  // Formata um Date qualquer como "YYYY-MM-DD" em hora LOCAL (não UTC) —
  // evita o clássico bug de "virar o dia errado" perto da meia-noite.
  function formatISOFromDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function todayISO() {
    return formatISOFromDate(new Date());
  }

  function formatDateBR(isoDate) {
    if (!isoDate) return "";
    const [y, m, d] = isoDate.split("-");
    if (!y || !m || !d) return isoDate;
    return `${d}/${m}/${y}`;
  }

  function formatDateLong(isoDate) {
    if (!isoDate) return "";
    const parts = isoDate.split("-").map(Number);
    const dt = new Date(parts[0], parts[1] - 1, parts[2]);
    return dt.toLocaleDateString("pt-BR", {
      weekday: "long",
      day: "2-digit",
      month: "long",
    });
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function debounce(fn, wait) {
    let t = null;
    return function debounced(...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), wait);
    };
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function capitalize(str) {
    if (!str) return "";
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function classNames(...args) {
    return args.filter(Boolean).join(" ");
  }

  // Compara duas datas ISO (YYYY-MM-DD) sem depender de Date/fuso.
  function isPastDate(isoDate) {
    if (!isoDate) return false;
    return isoDate < todayISO();
  }

  // Remove acentos e normaliza caixa — usado pela inferência de hábito da
  // Fase 2 (comparar títulos digitados livremente com nomes já cadastrados).
  function normalizeText(str) {
    if (!str) return "";
    return String(str)
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .toLowerCase()
      .trim();
  }

  // Soma minutos a um horário "HH:MM", com wrap ao virar a meia-noite —
  // usado para derivar endTime a partir de horário+duração (Fase 2).
  function addMinutesToTime(hm, minutes) {
    if (!hm || !minutes) return null;
    const [h, m] = hm.split(":").map(Number);
    let total = h * 60 + m + Number(minutes);
    total = ((total % 1440) + 1440) % 1440;
    const nh = Math.floor(total / 60);
    const nm = total % 60;
    return `${String(nh).padStart(2, "0")}:${String(nm).padStart(2, "0")}`;
  }

  global.App = global.App || {};
  global.App.Utils = {
    uid,
    nowISO,
    todayISO,
    formatISOFromDate,
    formatDateBR,
    formatDateLong,
    clamp,
    debounce,
    escapeHtml,
    capitalize,
    classNames,
    isPastDate,
    normalizeText,
    addMinutesToTime,
  };
})(window);

/* ==== js/models.js ==== */
/* ==========================================================================
   MODELS — Modelo de Dados do Sistema Pessoal de Execução
   ==========================================================================
   Este arquivo é a ÚNICA fonte de verdade sobre o "formato" de cada entidade
   do sistema. Nenhuma outra parte do app deve criar objetos de tarefa, hábito,
   meta etc. "à mão" — sempre passar por App.Models.create*().

   Princípio de não-duplicação (ver Fase 0, item 4 e 12 do briefing):
   - Uma TAREFA é sempre um registro em `tasks`. Uma tarefa concluída no
     Dashboard (Fase 1) e uma tarefa vista em Planejamento (Fase 2) são o
     MESMO registro — nunca cópias.
   - Um HÁBITO define o comportamento recorrente (`habits`); cada execução
     diária dele vira um `habitLog` (não uma tarefa nova).
   - Uma META (`goals`) pode opcionalmente evoluir a partir de um OBJETIVO
     (`objectives`), mas objetivo e meta nunca se confundem.
   ========================================================================== */
(function (global) {
  "use strict";

  const Utils = global.App.Utils;

  /* -------------------------------------------------------------------- *
   * ENUMS / CONSTANTES DE DOMÍNIO
   * -------------------------------------------------------------------- */

  // Nível de importância — o usuário SÓ escolhe um destes três. O peso
  // numérico é derivado internamente e nunca exposto como campo editável
  // (briefing item 5: "Não quero que o usuário informe um peso numérico").
  const IMPORTANCE_LEVELS = ["essencial", "importante", "opcional"];
  const IMPORTANCE_WEIGHT = { essencial: 3, importante: 2, opcional: 1 };
  const IMPORTANCE_LABEL = {
    essencial: "Essencial",
    importante: "Importante",
    opcional: "Opcional",
  };

  // Status possíveis de uma tarefa/atividade (briefing item 11 — estados).
  // "pulada" chega na Fase 2 (item 6: reagendar/concluir/marcar como não
  // realizada). "em_andamento" e "próximo" continuam sendo estados
  // exibidos, não armazenados — computados a partir do horário na hora de
  // exibir (ver App.Selectors.getTimelineForDate), pra não exigir um job
  // de fundo reescrevendo status o tempo todo.
  const TASK_STATUS = ["pendente", "em_andamento", "concluida", "atrasada", "pulada"];

  // Status possível de uma execução de hábito num dia específico.
  const HABIT_LOG_STATUS = ["concluido", "parcial", "nao_realizado", "pendente"];

  // Tipos de meta — nem toda meta tem número (briefing item 6).
  const GOAL_TYPES = [
    "quantitativa", // ex: correr 500km no ano
    "percentual", // ex: reduzir 20% do tempo de tela
    "marco", // ex: lançar o produto X
    "data", // ex: terminar até 30/11
    "conclusao", // ex: ler o livro Y (binário: feito/não feito)
    "qualitativa", // ex: "me sentir mais confiante em apresentações"
  ];
  const GOAL_TYPE_LABEL = {
    quantitativa: "Quantitativa",
    percentual: "Percentual",
    marco: "Marco",
    data: "Baseada em data",
    conclusao: "Conclusão",
    qualitativa: "Qualitativa",
  };
  const GOAL_STATUS = ["ativa", "pausada", "concluida", "abandonada"];

  const OBJECTIVE_TIMEFRAME = ["curto_prazo", "medio_prazo", "longo_prazo"];

  /* -------------------------------------------------------------------- *
   * FACTORIES
   * Cada função devolve um objeto "pronto para salvar", já com id,
   * timestamps e campos derivados preenchidos. Campos não informados
   * recebem um default seguro — nunca `undefined` (IndexedDB não indexa
   * bem `undefined` em índices).
   * -------------------------------------------------------------------- */

  function baseFields(isDemo) {
    const now = Utils.nowISO();
    return {
      id: Utils.uid(),
      createdAt: now,
      updatedAt: now,
      isDemo: !!isDemo,
    };
  }

  // TAREFA: atividade específica e executável.
  function createTask(input) {
    input = input || {};
    const importance = IMPORTANCE_LEVELS.includes(input.importance)
      ? input.importance
      : "importante";
    return Object.assign(baseFields(input.isDemo), {
      entity: "task",
      title: input.title || "Nova tarefa",
      description: input.description || "",
      importance: importance,
      weight: IMPORTANCE_WEIGHT[importance], // derivado, não editável pelo usuário
      status: TASK_STATUS.includes(input.status) ? input.status : "pendente",
      dueDate: input.dueDate || null, // "YYYY-MM-DD"
      startTime: input.startTime || null, // "HH:MM", opcional — usado por Hoje/Foco Agora
      endTime: input.endTime || null, // "HH:MM", opcional
      context: input.context || "", // frase curta de contexto, opcional (ex.: "com o personal")
      icon: input.icon || null, // opcional — se ausente, a UI usa um ícone padrão por tipo
      projectId: input.projectId || null,
      habitId: input.habitId || null, // presente quando a tarefa nasceu de um hábito do dia
      goalId: input.goalId || null, // vínculo opcional a uma meta que essa tarefa avança
      // Recorrência (Fase 2, item 8): só a tarefa "raiz" carrega a regra —
      // {type:'diaria'} | {type:'semanal', days:[0-6]}. Ocorrências geradas
      // a partir dela (App.Store.ensureRecurrenceInstancesForDate) nascem
      // com recurrence:null e recurrenceRootId apontando pra raiz, então
      // nunca criam uma segunda cadeia de repetição.
      recurrence: input.recurrence || null,
      recurrenceRootId: input.recurrenceRootId || null,
      // Planejado x Real (Fase 2, item 7): a duração vem do formulário de
      // criação/edição; endTime, quando existe horário, é derivado dela.
      // actualDurationMin fica pronto pra Evolução/Insights registrarem o
      // tempo real gasto — nenhuma tela desta fase exige o preenchimento.
      plannedDurationMin: typeof input.plannedDurationMin === "number" ? input.plannedDurationMin : null,
      actualDurationMin: typeof input.actualDurationMin === "number" ? input.actualDurationMin : null,
      completedAt: input.completedAt || null,
      order: typeof input.order === "number" ? input.order : 0,
    });
  }

  // HÁBITO: comportamento recorrente. Não guarda "conclusão" nele mesmo —
  // isso vive em habitLogs (um registro por dia).
  function createHabit(input) {
    input = input || {};
    const importance = IMPORTANCE_LEVELS.includes(input.importance)
      ? input.importance
      : "importante";
    return Object.assign(baseFields(input.isDemo), {
      entity: "habit",
      name: input.name || "Novo hábito",
      description: input.description || "",
      importance: importance,
      weight: IMPORTANCE_WEIGHT[importance],
      frequency: input.frequency || { type: "diaria" }, // {type:'diaria'} | {type:'semanal', days:[1,3,5]} | {type:'x_por_semana', count:3}
      active: input.active !== false,
      goalId: input.goalId || null,
      icon: input.icon || "habitos",
      color: input.color || "accent",
      // Horário sugerido (Fase 3, item 1) — só informativo/de exibição.
      // Não move o hábito pra um horário fixo na Timeline; isso continua
      // acontecendo só via tarefa vinculada (habitId numa Task).
      preferredTime: input.preferredTime || null,
    });
  }

  // REGISTRO DE EXECUÇÃO DE HÁBITO (um por hábito por dia).
  function createHabitLog(input) {
    input = input || {};
    return Object.assign(baseFields(input.isDemo), {
      entity: "habitLog",
      habitId: input.habitId,
      date: input.date || Utils.todayISO(), // "YYYY-MM-DD"
      status: HABIT_LOG_STATUS.includes(input.status) ? input.status : "pendente",
      note: input.note || "",
    });
  }

  // META: resultado de médio/longo prazo. Suporta tipos sem número.
  function createGoal(input) {
    input = input || {};
    const type = GOAL_TYPES.includes(input.type) ? input.type : "conclusao";
    return Object.assign(baseFields(input.isDemo), {
      entity: "goal",
      title: input.title || "Nova meta",
      description: input.description || "",
      type: type,
      // Só populados quando o tipo faz sentido ter número — a UI decide o
      // que mostrar com base em `type`, nunca assume que existe valor.
      targetValue: type === "quantitativa" || type === "percentual" ? input.targetValue ?? null : null,
      currentValue: type === "quantitativa" || type === "percentual" ? input.currentValue ?? 0 : null,
      unit: input.unit || null, // ex: "km", "livros", "%"
      deadline: input.deadline || null, // "YYYY-MM-DD", relevante p/ tipo 'data' mas disponível a todos
      milestones: Array.isArray(input.milestones) ? input.milestones : [], // [{id,label,done}] — usado pelo tipo 'marco'
      status: GOAL_STATUS.includes(input.status) ? input.status : "ativa",
      importance: IMPORTANCE_LEVELS.includes(input.importance) ? input.importance : "importante",
      objectiveId: input.objectiveId || null,
      projectId: input.projectId || null,
    });
  }

  // OBJETIVO: direção maior, guarda-chuva de uma ou mais metas.
  function createObjective(input) {
    input = input || {};
    return Object.assign(baseFields(input.isDemo), {
      entity: "objective",
      title: input.title || "Novo objetivo",
      description: input.description || "",
      timeframe: OBJECTIVE_TIMEFRAME.includes(input.timeframe) ? input.timeframe : "medio_prazo",
      status: input.status || "ativo",
    });
  }

  // PLANO DIÁRIO: o ritual de planejamento (briefing: até ~20min).
  function createDailyPlan(input) {
    input = input || {};
    return Object.assign(baseFields(input.isDemo), {
      entity: "dailyPlan",
      date: input.date || Utils.todayISO(),
      taskIds: Array.isArray(input.taskIds) ? input.taskIds : [],
      intention: input.intention || "", // "foco do dia" em uma frase
      notes: input.notes || "",
      // Hábitos escalados automaticamente para esse dia que o usuário
      // optou por NÃO realizar (Fase 2, item 4 — "selecionar hábitos que
      // deseja realizar"). Não pausa o hábito, só aquela ocorrência.
      skippedHabitIds: Array.isArray(input.skippedHabitIds) ? input.skippedHabitIds : [],
      plannedAt: input.plannedAt || null, // preenchido ao concluir "Prepare seu amanhã"
      reviewedAt: input.reviewedAt || null, // preenchido no check-in noturno (fase futura)
    });
  }

  // CHECK-IN: avaliação diária/semanal. O check-in NOTURNO (Fase 5, item 4)
  // é um checkin type:'daily' — mesma entidade que já existia desde a
  // Fase 0 (o campo `reviewedAt` do dailyPlan já antecipava isso: "preenchido
  // no check-in noturno"), só ganhando os 4 campos de escala rápida + a
  // dificuldade principal que o briefing pede, sem criar uma store nova.
  const CHECKIN_DIFFICULTY_OPTIONS = ["tempo", "energia", "foco", "imprevistos", "motivacao", "outra"];
  function createCheckin(input) {
    input = input || {};
    return Object.assign(baseFields(input.isDemo), {
      entity: "checkin",
      date: input.date || Utils.todayISO(),
      type: input.type === "weekly" ? "weekly" : "daily",
      mood: input.mood ?? null, // escala simples 1-5, opcional
      energy: input.energy ?? null, // escala simples 1-5, opcional
      focus: input.focus ?? null, // escala simples 1-5, opcional (Fase 5)
      stress: input.stress ?? null, // escala simples 1-5, opcional (Fase 5)
      mainDifficulty: CHECKIN_DIFFICULTY_OPTIONS.includes(input.mainDifficulty) ? input.mainDifficulty : null, // Fase 5
      notes: input.notes || "", // observação opcional — de propósito sem exigir texto longo
      answers: input.answers || {}, // perguntas livres de reflexão, chave->resposta
    });
  }

  // DIÁRIO: entrada visual do dia (Fase 5, item 6) — como foi o dia, a
  // vitória, a principal dificuldade e o aprendizado. `content` continua
  // sendo o texto livre de "como foi o dia"; os três campos novos são
  // opcionais de propósito (não obrigar o usuário a preencher os quatro).
  function createJournalEntry(input) {
    input = input || {};
    return Object.assign(baseFields(input.isDemo), {
      entity: "journalEntry",
      date: input.date || Utils.todayISO(),
      content: input.content || "",
      win: input.win || "", // vitória do dia (Fase 5)
      difficulty: input.difficulty || "", // principal dificuldade (Fase 5)
      learning: input.learning || "", // aprendizado (Fase 5)
      tags: Array.isArray(input.tags) ? input.tags : [],
      mood: input.mood ?? null,
      linkedTaskIds: Array.isArray(input.linkedTaskIds) ? input.linkedTaskIds : [],
    });
  }

  // ITEM DE INBOX (Fase 2, item 9): captura rápida de algo que ainda não
  // virou atividade — sem data, sem importância, sem decisão nenhuma
  // ainda. `convertedTaskId` marca quando já virou uma tarefa de verdade;
  // a Inbox nunca duplica esse dado, só aponta pra ele.
  function createInboxItem(input) {
    input = input || {};
    return Object.assign(baseFields(input.isDemo), {
      entity: "inboxItem",
      text: input.text || "",
      convertedTaskId: input.convertedTaskId || null,
    });
  }

  // PROJETO: agrupador opcional de tarefas/metas.
  function createProject(input) {
    input = input || {};
    return Object.assign(baseFields(input.isDemo), {
      entity: "project",
      name: input.name || "Novo projeto",
      description: input.description || "",
      color: input.color || "accent",
      status: input.status || "ativo",
    });
  }

  // CONQUISTA: reconhecimento gerado pelo sistema (não gamificação pesada).
  function createAchievement(input) {
    input = input || {};
    return Object.assign(baseFields(input.isDemo), {
      entity: "achievement",
      title: input.title || "",
      description: input.description || "",
      criteria: input.criteria || "",
      icon: input.icon || "award",
      unlockedAt: input.unlockedAt || Utils.nowISO(),
      relatedEntity: input.relatedEntity || null, // {type,id} opcional
    });
  }

  // INSIGHT: observação gerada por regras (Fase 6 — sem IA externa).
  // `type` funciona como a "chave de deduplicação" da regra que gerou o
  // insight (ex.: "queda_habito:<habitId>") — é o que App.Insights usa pra
  // aplicar o cooldown (item 1: "evitar repetir o mesmo insight
  // excessivamente"), nunca uma categoria solta.
  function createInsight(input) {
    input = input || {};
    return Object.assign(baseFields(input.isDemo), {
      entity: "insight",
      type: input.type || "observacao",
      message: input.message || "",
      severity: input.severity || "info", // info | atencao | positivo
      relatedEntity: input.relatedEntity || null,
      generatedAt: input.generatedAt || Utils.nowISO(),
      dismissed: !!input.dismissed,
      // Fase 6: nível de relevância (a UI ordena por ele) e sugestão
      // estruturada opcional — sempre apresentada como recomendação baseada
      // em dados, nunca como julgamento (briefing item 4).
      relevance: typeof input.relevance === "number" ? input.relevance : 2,
      suggestion: input.suggestion || null, // {label, action, data} opcional
    });
  }

  // CONFIGURAÇÕES: registro único (id fixo "app").
  function defaultSettings() {
    return {
      id: "app",
      theme: "auto", // 'light' | 'dark' | 'auto'
      userName: "",
      onboardingSeenAt: null,
      demoDataSeededAt: null,
      updatedAt: Utils.nowISO(),
    };
  }

  // HISTÓRICO: registro append-only de transições de estado (Fase 1 item 3).
  // Nunca é editado depois de criado — é o "diário de bordo" que a Evolução
  // (Fase 5) e o motor de insights (Fase 6) vão consumir. Não duplica o
  // estado da entidade: apenas registra QUE uma transição aconteceu.
  function createHistoryEntry(input) {
    input = input || {};
    const ts = input.timestamp || Utils.nowISO();
    return Object.assign(baseFields(input.isDemo), {
      entity: input.entity, // 'task' | 'habit'
      entityId: input.entityId,
      action: input.action, // ex.: 'concluida' | 'reaberta' | 'concluido' | 'pendente' | 'parcial'
      timestamp: ts,
      date: ts.slice(0, 10), // "YYYY-MM-DD", pra consultas rápidas por dia
      meta: input.meta || {},
    });
  }

  global.App.Models = {
    IMPORTANCE_LEVELS,
    IMPORTANCE_WEIGHT,
    IMPORTANCE_LABEL,
    TASK_STATUS,
    HABIT_LOG_STATUS,
    GOAL_TYPES,
    GOAL_TYPE_LABEL,
    GOAL_STATUS,
    OBJECTIVE_TIMEFRAME,
    CHECKIN_DIFFICULTY_OPTIONS,
    createTask,
    createHabit,
    createHabitLog,
    createGoal,
    createObjective,
    createDailyPlan,
    createCheckin,
    createJournalEntry,
    createInboxItem,
    createProject,
    createAchievement,
    createInsight,
    defaultSettings,
    createHistoryEntry,
  };
})(window);

/* ==== js/db.js ==== */
/* ==========================================================================
   DB — Camada de armazenamento (Fase 0)
   ==========================================================================
   Objetivo desta camada: NENHUM outro módulo do app deve tocar em
   `indexedDB` ou `localStorage` diretamente. Tudo passa por App.DB, que
   expõe uma API assíncrona (Promises) e uniforme, independente de qual
   mecanismo de armazenamento está por trás.

   Estratégia:
   1) Tenta IndexedDB (suporta bem dados estruturados/históricos, é o
      preferido pelo briefing).
   2) Se IndexedDB não existir ou falhar ao abrir (ex.: modo privado em
      alguns navegadores, contexto restrito, etc.), cai automaticamente
      para um adaptador baseado em localStorage com a MESMA API — o
      restante do app nunca precisa saber qual dos dois está em uso.

   Isso também é o que deixa o app pronto para exportação/importação
   futura (briefing item 3): exportAll()/importAll() já existem aqui,
   mesmo que a Fase 0 não construa a tela para isso ainda.
   ========================================================================== */
window.App = window.App || {};

(function (global) {
  "use strict";

  const DB_NAME = "execucao_pessoal_db";
  // v2 (Fase 1): adiciona a store 'history' (append-only).
  // v3 (Fase 2): adiciona a store 'inboxItems'. A migração continua
  // aditiva — só cria o que ainda não existe — nenhum dado de v1/v2 é
  // tocado ou perdido.
  const DB_VERSION = 3;
  const LS_PREFIX = "execucao_pessoal::"; // usado só pelo fallback localStorage

  // Schema: nome da store -> { keyPath, indexes: [[nome, caminho, opções?]] }
  // Isto é a representação técnica do modelo de dados definido em models.js.
  const STORE_SCHEMA = {
    tasks: {
      keyPath: "id",
      indexes: [
        ["status", "status"],
        ["dueDate", "dueDate"],
        ["projectId", "projectId"],
        ["habitId", "habitId"],
        ["goalId", "goalId"],
        ["isDemo", "isDemo"],
      ],
    },
    habits: {
      keyPath: "id",
      indexes: [
        ["active", "active"],
        ["goalId", "goalId"],
        ["isDemo", "isDemo"],
      ],
    },
    habitLogs: {
      keyPath: "id",
      indexes: [
        ["habitId", "habitId"],
        ["date", "date"],
        ["isDemo", "isDemo"],
      ],
    },
    goals: {
      keyPath: "id",
      indexes: [
        ["status", "status"],
        ["objectiveId", "objectiveId"],
        ["projectId", "projectId"],
        ["isDemo", "isDemo"],
      ],
    },
    objectives: {
      keyPath: "id",
      indexes: [
        ["status", "status"],
        ["isDemo", "isDemo"],
      ],
    },
    dailyPlans: {
      keyPath: "id",
      indexes: [
        ["date", "date"],
        ["isDemo", "isDemo"],
      ],
    },
    checkins: {
      keyPath: "id",
      indexes: [
        ["date", "date"],
        ["type", "type"],
        ["isDemo", "isDemo"],
      ],
    },
    journalEntries: {
      keyPath: "id",
      indexes: [
        ["date", "date"],
        ["isDemo", "isDemo"],
      ],
    },
    projects: {
      keyPath: "id",
      indexes: [
        ["status", "status"],
        ["isDemo", "isDemo"],
      ],
    },
    achievements: {
      keyPath: "id",
      indexes: [["isDemo", "isDemo"]],
    },
    insights: {
      keyPath: "id",
      indexes: [
        ["dismissed", "dismissed"],
        ["isDemo", "isDemo"],
      ],
    },
    settings: {
      keyPath: "id",
      indexes: [],
    },
    history: {
      keyPath: "id",
      indexes: [
        ["entityId", "entityId"],
        ["date", "date"],
        ["isDemo", "isDemo"],
      ],
    },
    inboxItems: {
      keyPath: "id",
      indexes: [
        ["convertedTaskId", "convertedTaskId"],
        ["isDemo", "isDemo"],
      ],
    },
  };

  const STORE_NAMES = Object.keys(STORE_SCHEMA);

  /* ---------------------------------------------------------------------
   * ADAPTADOR: IndexedDB
   * ------------------------------------------------------------------- */
  function createIndexedDbAdapter() {
    let dbPromise = null;

    function open() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!("indexedDB" in global)) {
          reject(new Error("IndexedDB indisponível"));
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (evt) => {
          const db = evt.target.result;
          STORE_NAMES.forEach((storeName) => {
            if (!db.objectStoreNames.contains(storeName)) {
              const schema = STORE_SCHEMA[storeName];
              const os = db.createObjectStore(storeName, { keyPath: schema.keyPath });
              schema.indexes.forEach(([indexName, path, opts]) => {
                os.createIndex(indexName, path, opts || { unique: false });
              });
            }
          });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error("Falha ao abrir IndexedDB"));
        req.onblocked = () => reject(new Error("Abertura do IndexedDB bloqueada"));
      });
      return dbPromise;
    }

    function withStore(storeName, mode, work) {
      return open().then(
        (db) =>
          new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, mode);
            const store = tx.objectStore(storeName);
            let result;
            try {
              result = work(store);
            } catch (err) {
              reject(err);
              return;
            }
            tx.oncomplete = () => resolve(result);
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error || new Error("Transação abortada"));
          })
      );
    }

    function reqToPromise(request) {
      return new Promise((resolve, reject) => {
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    return {
      name: "indexeddb",
      init: () => open().then(() => true),
      add(storeName, obj) {
        return withStore(storeName, "readwrite", (s) => s.put(obj)).then(() => obj);
      },
      put(storeName, obj) {
        return withStore(storeName, "readwrite", (s) => s.put(obj)).then(() => obj);
      },
      get(storeName, id) {
        return open().then(
          (db) =>
            new Promise((resolve, reject) => {
              const tx = db.transaction(storeName, "readonly");
              reqToPromise(tx.objectStore(storeName).get(id)).then(resolve, reject);
            })
        );
      },
      getAll(storeName) {
        return open().then(
          (db) =>
            new Promise((resolve, reject) => {
              const tx = db.transaction(storeName, "readonly");
              reqToPromise(tx.objectStore(storeName).getAll()).then(
                (rows) => resolve(rows || []),
                reject
              );
            })
        );
      },
      getByIndex(storeName, indexName, value) {
        return open().then(
          (db) =>
            new Promise((resolve, reject) => {
              const tx = db.transaction(storeName, "readonly");
              const idx = tx.objectStore(storeName).index(indexName);
              reqToPromise(idx.getAll(value)).then((rows) => resolve(rows || []), reject);
            })
        );
      },
      remove(storeName, id) {
        return withStore(storeName, "readwrite", (s) => s.delete(id)).then(() => true);
      },
      clearStore(storeName) {
        return withStore(storeName, "readwrite", (s) => s.clear()).then(() => true);
      },
    };
  }

  /* ---------------------------------------------------------------------
   * ADAPTADOR: localStorage (fallback)
   * Mantém a MESMA assinatura assíncrona para ser 100% intercambiável.
   * ------------------------------------------------------------------- */
  function createLocalStorageAdapter() {
    function readStore(storeName) {
      try {
        const raw = localStorage.getItem(LS_PREFIX + storeName);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }
    function writeStore(storeName, rows) {
      try {
        localStorage.setItem(LS_PREFIX + storeName, JSON.stringify(rows));
      } catch (e) {
        // Armazenamento indisponível/cheio — falha silenciosa e controlada;
        // a UI trata isso como "não foi possível salvar" via try/catch no
        // chamador (ver App.Store).
      }
    }
    return {
      name: "localstorage",
      init: () => Promise.resolve(true),
      add(storeName, obj) {
        const rows = readStore(storeName);
        rows.push(obj);
        writeStore(storeName, rows);
        return Promise.resolve(obj);
      },
      put(storeName, obj) {
        const rows = readStore(storeName);
        const idx = rows.findIndex((r) => r.id === obj.id);
        if (idx >= 0) rows[idx] = obj;
        else rows.push(obj);
        writeStore(storeName, rows);
        return Promise.resolve(obj);
      },
      get(storeName, id) {
        const rows = readStore(storeName);
        return Promise.resolve(rows.find((r) => r.id === id));
      },
      getAll(storeName) {
        return Promise.resolve(readStore(storeName));
      },
      getByIndex(storeName, indexName, value) {
        const rows = readStore(storeName);
        return Promise.resolve(rows.filter((r) => r[indexName] === value));
      },
      remove(storeName, id) {
        const rows = readStore(storeName).filter((r) => r.id !== id);
        writeStore(storeName, rows);
        return Promise.resolve(true);
      },
      clearStore(storeName) {
        writeStore(storeName, []);
        return Promise.resolve(true);
      },
    };
  }

  /* ---------------------------------------------------------------------
   * SELEÇÃO DE ADAPTADOR + API PÚBLICA
   * ------------------------------------------------------------------- */
  let adapter = null;
  let initPromise = null;

  function init() {
    if (initPromise) return initPromise;
    const idb = createIndexedDbAdapter();
    initPromise = idb
      .init()
      .then(() => {
        adapter = idb;
        return { backend: "indexeddb" };
      })
      .catch(() => {
        adapter = createLocalStorageAdapter();
        return adapter.init().then(() => ({ backend: "localstorage" }));
      });
    return initPromise;
  }

  function ensureReady() {
    if (!adapter) {
      throw new Error("App.DB.init() precisa ser chamado (e aguardado) antes de qualquer operação.");
    }
  }

  async function clearDemoData() {
    ensureReady();
    let removed = 0;
    for (const storeName of STORE_NAMES) {
      const rows = await adapter.getAll(storeName);
      const demoRows = rows.filter((r) => r.isDemo);
      for (const row of demoRows) {
        await adapter.remove(storeName, row.id);
        removed++;
      }
    }
    return removed;
  }

  async function exportAll() {
    ensureReady();
    const data = {};
    for (const storeName of STORE_NAMES) {
      data[storeName] = await adapter.getAll(storeName);
    }
    return {
      app: "Sistema Pessoal de Execução",
      version: DB_VERSION,
      exportedAt: new Date().toISOString(),
      data,
    };
  }

  // Disponível para fases futuras (ex.: Refinamento/Backup). Sobrescreve
  // por completo cada store presente no payload — não faz merge.
  async function importAll(payload) {
    ensureReady();
    if (!payload || typeof payload.data !== "object") {
      throw new Error("Formato de backup inválido.");
    }
    for (const storeName of Object.keys(payload.data)) {
      if (!STORE_NAMES.includes(storeName)) continue;
      await adapter.clearStore(storeName);
      for (const row of payload.data[storeName]) {
        await adapter.put(storeName, row);
      }
    }
    return true;
  }

  global.App.DB = {
    STORE_NAMES,
    STORE_SCHEMA,
    init,
    get backend() {
      return adapter ? adapter.name : null;
    },
    add: (storeName, obj) => {
      ensureReady();
      return adapter.add(storeName, obj);
    },
    put: (storeName, obj) => {
      ensureReady();
      return adapter.put(storeName, obj);
    },
    get: (storeName, id) => {
      ensureReady();
      return adapter.get(storeName, id);
    },
    getAll: (storeName) => {
      ensureReady();
      return adapter.getAll(storeName);
    },
    getByIndex: (storeName, indexName, value) => {
      ensureReady();
      return adapter.getByIndex(storeName, indexName, value);
    },
    remove: (storeName, id) => {
      ensureReady();
      return adapter.remove(storeName, id);
    },
    clearStore: (storeName) => {
      ensureReady();
      return adapter.clearStore(storeName);
    },
    clearDemoData,
    exportAll,
    importAll,
  };
})(window);

/* ==== js/store.js ==== */
/* ==========================================================================
   STORE — camada de estado em memória + pub/sub (sem framework)
   ==========================================================================
   Por que existe: App.DB já resolve "onde os dados moram", mas toda leitura
   ali é assíncrona (Promise) e sem cache. Como várias views vão precisar
   ler os MESMOS dados (ex.: uma tarefa aparece no Dashboard, em
   Planejamento e em Hábitos), App.Store mantém uma cópia em memória por
   coleção e avisa quem está "inscrito" sempre que ela muda.

   Regra de ouro (briefing: "não criar sistemas paralelos que armazenem a
   mesma informação"): App.Store é a única cópia em memória. Views nunca
   guardam seu próprio array de tarefas — sempre leem via
   App.Store.getAll('tasks') e se inscrevem para re-renderizar quando mudar.
   ========================================================================== */
window.App = window.App || {};

(function (global) {
  "use strict";

  const DB = global.App.DB;

  const cache = {}; // storeName -> array de registros
  const listeners = {}; // storeName -> Set<fn>
  let ready = false;

  function notify(storeName) {
    (listeners[storeName] || new Set()).forEach((fn) => {
      try {
        fn(cache[storeName] || []);
      } catch (err) {
        console.error("[App.Store] listener falhou para", storeName, err);
      }
    });
  }

  async function reload(storeName) {
    try {
      cache[storeName] = await DB.getAll(storeName);
    } catch (err) {
      console.error("[App.Store] falha ao carregar", storeName, err);
      cache[storeName] = cache[storeName] || [];
    }
    notify(storeName);
    return cache[storeName];
  }

  async function initAll() {
    await DB.init();
    await Promise.all(DB.STORE_NAMES.map(reload));
    ready = true;
    return true;
  }

  function subscribe(storeName, fn) {
    if (!listeners[storeName]) listeners[storeName] = new Set();
    listeners[storeName].add(fn);
    return () => listeners[storeName].delete(fn);
  }

  function getAll(storeName) {
    return cache[storeName] || [];
  }

  function getById(storeName, id) {
    return getAll(storeName).find((r) => r.id === id) || null;
  }

  async function add(storeName, obj) {
    await DB.add(storeName, obj);
    return reload(storeName);
  }

  async function update(storeName, obj) {
    obj.updatedAt = global.App.Utils.nowISO();
    await DB.put(storeName, obj);
    return reload(storeName);
  }

  async function remove(storeName, id) {
    await DB.remove(storeName, id);
    return reload(storeName);
  }

  /* ---------------------------------------------------------------- *
   * AÇÕES DE DOMÍNIO — único ponto de mutação para "concluir/reabrir"
   * uma atividade. Qualquer tela (Hoje, e futuramente Planejamento,
   * Hábitos, Dashboard) DEVE chamar estas funções em vez de escrever
   * status/completedAt na mão — é o que garante uma única fonte de
   * verdade (briefing Fase 1, item 3) e o registro automático de
   * histórico, pronto para a Evolução (Fase 5) e os Insights (Fase 6).
   * ---------------------------------------------------------------- */

  async function logHistory({ entity, entityId, action, meta, isDemo }) {
    const entry = global.App.Models.createHistoryEntry({ entity, entityId, action, meta, isDemo });
    await DB.add("history", entry);
    return reload("history");
  }

  // Cria ou atualiza o registro de execução de um hábito num dia — é a
  // ÚNICA forma de marcar um hábito como feito/não feito. Nunca cria uma
  // tarefa paralela para representar isso.
  async function setHabitLogStatus(habitId, date, status, opts) {
    opts = opts || {};
    const existing = getAll("habitLogs").find((l) => l.habitId === habitId && l.date === date);
    let log;
    if (existing) {
      log = Object.assign({}, existing, { status });
      await update("habitLogs", log);
    } else {
      log = global.App.Models.createHabitLog({ habitId, date, status, isDemo: opts.isDemo });
      await add("habitLogs", log);
    }
    await logHistory({ entity: "habit", entityId: habitId, action: status, meta: { date }, isDemo: opts.isDemo });
    // Integração com Metas (Fase 4, item 6): um hábito vinculado a uma
    // meta (habit.goalId) que acaba de ser concluído pode avançá-la —
    // só onde dá pra inferir isso sem chutar número (ver bumpGoalFromActivity).
    if (status === "concluido") {
      const habit = getById("habits", habitId);
      if (habit && habit.goalId) await bumpGoalFromActivity(habit.goalId);
      await syncAchievements();
    }
    return log;
  }

  async function toggleHabitLog(habitId, date) {
    const existing = getAll("habitLogs").find((l) => l.habitId === habitId && l.date === date);
    const next = existing && existing.status === "concluido" ? "pendente" : "concluido";
    return setHabitLogStatus(habitId, date, next);
  }

  // Conclui uma tarefa. Se ela nasceu de um hábito (task.habitId), o
  // habitLog correspondente do dia é sincronizado junto — sem duplicar
  // o registro, só refletindo a mesma conclusão nos dois lugares que a
  // representam.
  async function completeTask(taskId) {
    const task = getById("tasks", taskId);
    if (!task) return null;
    const updated = Object.assign({}, task, {
      status: "concluida",
      completedAt: global.App.Utils.nowISO(),
    });
    await update("tasks", updated);
    await logHistory({ entity: "task", entityId: task.id, action: "concluida", isDemo: task.isDemo });
    if (task.habitId) {
      await setHabitLogStatus(task.habitId, task.dueDate || global.App.Utils.todayISO(), "concluido", { isDemo: task.isDemo });
    }
    // Integração com Metas (Fase 4, item 6): uma tarefa vinculada a uma
    // meta (task.goalId) que acaba de ser concluída pode avançá-la.
    if (task.goalId) {
      await bumpGoalFromActivity(task.goalId);
    }
    await syncAchievements();
    return updated;
  }

  async function reopenTask(taskId) {
    const task = getById("tasks", taskId);
    if (!task) return null;
    const updated = Object.assign({}, task, { status: "pendente", completedAt: null });
    await update("tasks", updated);
    await logHistory({ entity: "task", entityId: task.id, action: "reaberta", isDemo: task.isDemo });
    if (task.habitId) {
      await setHabitLogStatus(task.habitId, task.dueDate || global.App.Utils.todayISO(), "pendente", { isDemo: task.isDemo });
    }
    return updated;
  }

  async function toggleTask(taskId) {
    const task = getById("tasks", taskId);
    if (!task) return null;
    return task.status === "concluida" ? reopenTask(taskId) : completeTask(taskId);
  }

  // Roda uma vez no boot: qualquer tarefa pendente cujo prazo já passou
  // vira 'atrasada' — assim ela continua aparecendo em Hoje em vez de
  // silenciosamente desaparecer. Não mexe em tarefas concluídas/futuras.
  async function syncOverdueTasks() {
    const today = global.App.Utils.todayISO();
    const overdue = getAll("tasks").filter((t) => t.status === "pendente" && t.dueDate && t.dueDate < today);
    for (const task of overdue) {
      await update("tasks", Object.assign({}, task, { status: "atrasada" }));
    }
    return overdue.length;
  }

  async function clearDemoData() {
    await DB.clearDemoData();
    await Promise.all(DB.STORE_NAMES.map(reload));
  }

  async function reloadAll() {
    await Promise.all(DB.STORE_NAMES.map(reload));
  }

  // "Limpar todos os dados" (Ajustes): zera literalmente tudo — diferente
  // de clearDemoData, que só remove os registros marcados como fictícios.
  // Ação de usuário explícita, sempre atrás de confirmDialog (ver app.js).
  async function clearAllData() {
    for (const storeName of DB.STORE_NAMES) {
      await DB.clearStore(storeName);
    }
    await reloadAll();
    // Mesmo princípio do boot() em app.js: o app sempre espera encontrar
    // uma linha de configurações — recria o padrão na hora, sem esperar
    // o próximo carregamento da página (o tema em si sobrevive à parte,
    // via localStorage — ver theme.js).
    if (!getById("settings", "app")) {
      await add("settings", global.App.Models.defaultSettings());
    }
  }

  /* ---------------------------------------------------------------- *
   * FASE 2 — PLANEJAMENTO
   * Mesmo princípio da Fase 1: toda criação/edição/reagendamento de
   * tarefa passa por aqui (nunca App.DB direto de uma view), e cada
   * transição relevante vira uma entrada em `history` — o "diário de
   * bordo" que preserva a ocorrência original mesmo quando ela é
   * reagendada (briefing item 6).
   * ---------------------------------------------------------------- */

  async function createTask(input) {
    const task = global.App.Models.createTask(input);
    await add("tasks", task);
    await logHistory({ entity: "task", entityId: task.id, action: "criada", isDemo: task.isDemo });
    return task;
  }

  // Edição rápida (item 5): aplica só os campos informados — nome,
  // horário, duração, importância — sem recriar a tarefa.
  async function updateTaskFields(taskId, patch) {
    const task = getById("tasks", taskId);
    if (!task) return null;
    const next = Object.assign({}, task, patch);
    if (patch.importance) {
      next.weight = global.App.Models.IMPORTANCE_WEIGHT[patch.importance] || task.weight;
    }
    await update("tasks", next);
    await logHistory({ entity: "task", entityId: task.id, action: "editada", meta: { fields: Object.keys(patch) }, isDemo: task.isDemo });
    return next;
  }

  // Reagendamento (item 6): muda só a data e volta pra pendente — o MESMO
  // registro, nunca uma cópia. A ocorrência original fica preservada no
  // histórico via a entrada 'reagendada' (from/to), não duplicando a tarefa.
  async function rescheduleTask(taskId, newDate) {
    const task = getById("tasks", taskId);
    if (!task) return null;
    const from = task.dueDate;
    const next = Object.assign({}, task, { dueDate: newDate, status: "pendente", completedAt: null });
    await update("tasks", next);
    await logHistory({ entity: "task", entityId: task.id, action: "reagendada", meta: { from, to: newDate }, isDemo: task.isDemo });
    return next;
  }

  // "Marcar como não realizada" — alterna, então clicar de novo desfaz.
  async function setTaskSkipped(taskId, skipped) {
    const task = getById("tasks", taskId);
    if (!task) return null;
    const next = Object.assign({}, task, { status: skipped ? "pulada" : "pendente" });
    await update("tasks", next);
    await logHistory({ entity: "task", entityId: task.id, action: skipped ? "pulada" : "reaberta", isDemo: task.isDemo });
    return next;
  }

  async function deleteTask(taskId) {
    const task = getById("tasks", taskId);
    if (!task) return false;
    await logHistory({ entity: "task", entityId: task.id, action: "excluida", isDemo: task.isDemo });
    return remove("tasks", taskId);
  }

  /* ---- Inbox (item 9) ---- */
  async function addInboxItem(text) {
    const item = global.App.Models.createInboxItem({ text });
    await add("inboxItems", item);
    return item;
  }

  async function removeInboxItem(inboxId) {
    return remove("inboxItems", inboxId);
  }

  // Liga um item já capturado à tarefa que acabou de nascer dele — a
  // Inbox nunca guarda uma segunda cópia do que virou atividade, só a
  // referência (convertedTaskId), e some da lista ativa a partir daí.
  async function linkInboxToTask(inboxId, taskId) {
    const item = getById("inboxItems", inboxId);
    if (!item) return null;
    const next = Object.assign({}, item, { convertedTaskId: taskId });
    await update("inboxItems", next);
    return next;
  }

  /* ---- Plano diário / "Prepare seu amanhã" (item 4) ---- */
  async function ensureDailyPlan(dateISO) {
    let plan = getAll("dailyPlans").find((p) => p.date === dateISO);
    if (plan) return plan;
    plan = global.App.Models.createDailyPlan({ date: dateISO });
    await add("dailyPlans", plan);
    return plan;
  }

  async function toggleSkippedHabit(dateISO, habitId) {
    const plan = await ensureDailyPlan(dateISO);
    const skipped = new Set(plan.skippedHabitIds || []);
    if (skipped.has(habitId)) skipped.delete(habitId);
    else skipped.add(habitId);
    const next = Object.assign({}, plan, { skippedHabitIds: Array.from(skipped) });
    await update("dailyPlans", next);
    return next;
  }

  async function markPlanFinished(dateISO) {
    const plan = await ensureDailyPlan(dateISO);
    const next = Object.assign({}, plan, { plannedAt: global.App.Utils.nowISO() });
    await update("dailyPlans", next);
    return next;
  }

  /* ---- Recorrência básica (item 8) ----
     Só a tarefa raiz carrega `recurrence`. Gerar a ocorrência de um dia
     é sob demanda (chamado ao navegar pra uma data em Planejamento) —
     nunca retroage antes da data de origem da raiz, e nunca duplica se
     aquele dia já tem uma ocorrência dessa série. */
  function recurrenceMatchesDate(recurrence, dateISO) {
    if (!recurrence) return false;
    if (recurrence.type === "diaria") return true;
    if (recurrence.type === "semanal" && Array.isArray(recurrence.days)) {
      const weekday = new Date(dateISO + "T00:00:00").getDay();
      return recurrence.days.includes(weekday);
    }
    return false;
  }

  async function ensureRecurrenceInstancesForDate(dateISO) {
    const roots = getAll("tasks").filter((t) => t.recurrence && !t.recurrenceRootId);
    for (const root of roots) {
      if (!root.dueDate || dateISO < root.dueDate) continue; // nunca retroage
      if (dateISO === root.dueDate) continue; // a própria raiz já representa esse dia
      if (!recurrenceMatchesDate(root.recurrence, dateISO)) continue;
      const exists = getAll("tasks").some((t) => t.recurrenceRootId === root.id && t.dueDate === dateISO);
      if (exists) continue;
      await createTask({
        title: root.title,
        importance: root.importance,
        startTime: root.startTime,
        endTime: root.endTime,
        plannedDurationMin: root.plannedDurationMin,
        context: root.context,
        icon: root.icon,
        projectId: root.projectId,
        goalId: root.goalId,
        habitId: root.habitId,
        dueDate: dateISO,
        recurrenceRootId: root.id,
        isDemo: root.isDemo,
      });
    }
  }

  /* ---------------------------------------------------------------- *
   * FASE 3 — HÁBITOS
   * Cadastro/edição do hábito em si (o comportamento recorrente) — as
   * marcações diárias continuam passando por setHabitLogStatus/
   * toggleHabitLog, já existentes desde a Fase 1, único ponto de
   * mutação pra "fiz/não fiz" (item 2: nunca duas marcações).
   * ---------------------------------------------------------------- */

  async function createHabit(input) {
    const habit = global.App.Models.createHabit(input);
    await add("habits", habit);
    return habit;
  }

  async function updateHabitFields(habitId, patch) {
    const habit = getById("habits", habitId);
    if (!habit) return null;
    const next = Object.assign({}, habit, patch);
    await update("habits", next);
    return next;
  }

  // "Arquivar" em vez de excluir — some do painel ativo, mas preserva todo
  // o histórico de logs (streaks/aderência continuam íntegros se reativado).
  async function setHabitActive(habitId, active) {
    const habit = getById("habits", habitId);
    if (!habit) return null;
    const next = Object.assign({}, habit, { active });
    await update("habits", next);
    return next;
  }

  // Clique num dia do calendário de aderência (item 4): cicla
  // não-marcado -> concluído -> não realizado -> não-marcado, sempre via
  // setHabitLogStatus (o mesmo mutador usado pela Timeline/Hoje).
  const HABIT_LOG_CYCLE = ["pendente", "concluido", "nao_realizado"];
  async function cycleHabitLogStatus(habitId, dateISO) {
    const existing = getAll("habitLogs").find((l) => l.habitId === habitId && l.date === dateISO);
    const current = existing ? existing.status : "pendente";
    const idx = HABIT_LOG_CYCLE.includes(current) ? HABIT_LOG_CYCLE.indexOf(current) : 0;
    const next = HABIT_LOG_CYCLE[(idx + 1) % HABIT_LOG_CYCLE.length];
    return setHabitLogStatus(habitId, dateISO, next);
  }

  /* ---------------------------------------------------------------- *
   * FASE 4 — METAS
   * Objetivo → Meta → Hábitos/Tarefas (item 1), nenhuma relação
   * obrigatória: uma meta nasce sem objectiveId, um hábito/tarefa nasce
   * sem goalId, e tudo funciona igual. Cada tipo de meta guarda seu
   * progresso do jeito que faz sentido pra ele (App.Selectors resolve
   * a leitura) — aqui só vivem os mutadores.
   * ---------------------------------------------------------------- */

  async function createGoal(input) {
    const goal = global.App.Models.createGoal(input);
    await add("goals", goal);
    await logHistory({ entity: "goal", entityId: goal.id, action: "criada", isDemo: goal.isDemo });
    return goal;
  }

  async function updateGoalFields(goalId, patch) {
    const goal = getById("goals", goalId);
    if (!goal) return null;
    const next = Object.assign({}, goal, patch);
    // Mesma normalização defensiva da factory (models.js): se o tipo virou
    // algo sem número, o valor-alvo antigo não deve sobreviver escondido.
    const numeric = next.type === "quantitativa" || next.type === "percentual";
    if (!numeric) next.targetValue = null;
    await update("goals", next);
    await logHistory({ entity: "goal", entityId: goal.id, action: "editada", meta: { fields: Object.keys(patch) }, isDemo: goal.isDemo });
    return next;
  }

  // Único mutador de currentValue (item 5): não existe forma confiável de
  // inferir "quantas unidades" uma tarefa concluída representa pra uma
  // meta quantitativa/percentual, então esse valor é sempre atualizado à
  // mão — tarefas/hábitos vinculados continuam alimentando a "atividade
  // recente" e o Dashboard normalmente, sem depender deste número.
  async function updateGoalValue(goalId, value) {
    const goal = getById("goals", goalId);
    if (!goal) return null;
    const next = Object.assign({}, goal, { currentValue: value });
    await update("goals", next);
    await logHistory({ entity: "goal", entityId: goal.id, action: "valor_atualizado", meta: { value }, isDemo: goal.isDemo });
    return next;
  }

  async function setGoalStatus(goalId, status) {
    const goal = getById("goals", goalId);
    if (!goal) return null;
    const next = Object.assign({}, goal, { status });
    await update("goals", next);
    await logHistory({ entity: "goal", entityId: goal.id, action: status, isDemo: goal.isDemo });
    if (status === "concluida") await syncAchievements();
    return next;
  }

  async function deleteGoal(goalId) {
    const goal = getById("goals", goalId);
    if (!goal) return false;
    await logHistory({ entity: "goal", entityId: goal.id, action: "excluida", isDemo: goal.isDemo });
    return remove("goals", goalId);
  }

  /* ---- Marcos (tipo 'marco') — a meta guarda a lista, nenhuma store
     paralela pra isso, mesmo princípio de não-duplicação do resto do app. ---- */
  async function addMilestone(goalId, label) {
    const goal = getById("goals", goalId);
    if (!goal) return null;
    const milestone = { id: global.App.Utils.uid(), label, done: false };
    const next = Object.assign({}, goal, { milestones: (goal.milestones || []).concat(milestone) });
    await update("goals", next);
    return next;
  }

  async function toggleMilestone(goalId, milestoneId) {
    const goal = getById("goals", goalId);
    if (!goal) return null;
    const milestones = (goal.milestones || []).map((m) => (m.id === milestoneId ? Object.assign({}, m, { done: !m.done }) : m));
    const next = Object.assign({}, goal, { milestones });
    await update("goals", next);
    await logHistory({ entity: "goal", entityId: goal.id, action: "marco_atualizado", meta: { milestoneId }, isDemo: goal.isDemo });
    return next;
  }

  async function removeMilestone(goalId, milestoneId) {
    const goal = getById("goals", goalId);
    if (!goal) return null;
    const next = Object.assign({}, goal, { milestones: (goal.milestones || []).filter((m) => m.id !== milestoneId) });
    await update("goals", next);
    return next;
  }

  /* ---- Integração (item 6) — chamado de completeTask/setHabitLogStatus
     quando a atividade concluída carrega um goalId. Só avança a meta
     sozinha onde isso não exige inventar um número: tipo 'conclusao' vira
     concluída direto. Quantitativa/percentual dependem de
     updateGoalValue (acima, manual); marco depende de toggleMilestone (o
     sistema não sabe qual marco uma tarefa representa); data/qualitativa
     continuam manuais via setGoalStatus. Não mexe em metas
     pausadas/concluídas/abandonadas — só reativação manual as traz de volta. ---- */
  async function bumpGoalFromActivity(goalId) {
    const goal = getById("goals", goalId);
    if (!goal || goal.status !== "ativa") return;
    if (goal.type === "conclusao") {
      await setGoalStatus(goalId, "concluida");
    }
  }

  /* ---- Objetivos (guarda-chuva opcional de uma ou mais metas) ---- */
  async function createObjective(input) {
    const objective = global.App.Models.createObjective(input);
    await add("objectives", objective);
    return objective;
  }

  async function updateObjectiveFields(objectiveId, patch) {
    const objective = getById("objectives", objectiveId);
    if (!objective) return null;
    const next = Object.assign({}, objective, patch);
    await update("objectives", next);
    return next;
  }

  // Excluir um objetivo NUNCA apaga as metas que apontavam pra ele —
  // elas continuam existindo, só passam a aparecer como "sem objetivo"
  // (ver App.Selectors.getGoalsWithoutObjective, que já trata objectiveId
  // pendurado em um objetivo que não existe mais).
  async function deleteObjective(objectiveId) {
    return remove("objectives", objectiveId);
  }

  /* ---------------------------------------------------------------- *
   * FASE 5 — EVOLUÇÃO
   * Check-in noturno, diário e conquistas. Os indicadores/gráficos do
   * painel são só leitura (App.Selectors) — aqui vivem só os mutadores.
   * ---------------------------------------------------------------- */

  // Check-in noturno (item 4): um único registro por dia (checkin
  // type:'daily') — reabrir o check-in de hoje e salvar de novo atualiza
  // o MESMO registro, nunca duplica. Também fecha o ciclo planejar ->
  // executar -> revisar marcando dailyPlan.reviewedAt (já previsto desde
  // a Fase 0, só sem quem o preenchesse até agora).
  async function saveNightlyCheckin(dateISO, fields) {
    const existing = getAll("checkins").find((c) => c.date === dateISO && c.type === "daily");
    let checkin;
    if (existing) {
      checkin = Object.assign({}, existing, fields);
      await update("checkins", checkin);
    } else {
      checkin = global.App.Models.createCheckin(Object.assign({ date: dateISO, type: "daily" }, fields));
      await add("checkins", checkin);
    }
    const plan = await ensureDailyPlan(dateISO);
    await update("dailyPlans", Object.assign({}, plan, { reviewedAt: global.App.Utils.nowISO() }));
    await logHistory({ entity: "checkin", entityId: checkin.id, action: "checkin_noturno", meta: { date: dateISO } });
    await syncAchievements();
    return checkin;
  }

  /* ---- Diário (item 6) ---- */
  async function createJournalEntry(input) {
    const entry = global.App.Models.createJournalEntry(input);
    await add("journalEntries", entry);
    await syncAchievements();
    return entry;
  }
  async function updateJournalEntry(entryId, patch) {
    const entry = getById("journalEntries", entryId);
    if (!entry) return null;
    const next = Object.assign({}, entry, patch);
    await update("journalEntries", next);
    return next;
  }
  async function deleteJournalEntry(entryId) {
    return remove("journalEntries", entryId);
  }

  /* ---- Conquistas (item 7) — motor de regras simples, sem IA externa.
     Cada regra tem uma `key` estável (vira `achievement.criteria`): uma
     vez desbloqueada, nunca é reavaliada — mesmo que a condição deixe de
     ser verdadeira depois (ex.: uma sequência quebra), porque uma
     conquista já obtida não deve "desaparecer" do histórico. ---- */
  function achievementRuleContext() {
    const Sel = global.App.Selectors;
    const habits = getAll("habits");
    const goals = getAll("goals");
    return {
      bestHabitStreak: habits.reduce((max, h) => Math.max(max, Sel.computeHabitStreaks(h).best), 0),
      currentHabitStreaks: habits.map((h) => Sel.computeHabitStreaks(h).current),
      goalsConcluded: goals.filter((g) => g.status === "concluida").length,
      checkinsCount: getAll("checkins").filter((c) => c.type === "daily").length,
      journalCount: getAll("journalEntries").length,
      consistencia30: Sel.computeConsistencia(30).value,
    };
  }

  const ACHIEVEMENT_RULES = [
    {
      key: "streak_habito_essencial >= 7",
      title: "Primeira semana de constância",
      description: "7 dias seguidos com pelo menos um hábito essencial cumprido.",
      icon: "sparkles",
      check: (ctx) => ctx.bestHabitStreak >= 7,
    },
    {
      key: "streak_habito >= 21",
      title: "Três semanas seguidas",
      description: "21 dias seguidos de constância em um hábito.",
      icon: "flag",
      check: (ctx) => ctx.bestHabitStreak >= 21,
    },
    {
      key: "streak_habito >= 100",
      title: "Cem dias de constância",
      description: "100 dias seguidos de constância em um hábito — um recorde pessoal e tanto.",
      icon: "evolucao",
      check: (ctx) => ctx.bestHabitStreak >= 100,
    },
    {
      key: "meta_concluida >= 1",
      title: "Primeira meta concluída",
      description: "Você concluiu sua primeira meta.",
      icon: "metas",
      check: (ctx) => ctx.goalsConcluded >= 1,
    },
    {
      key: "meta_concluida >= 3",
      title: "Três metas concluídas",
      description: "Três metas concluídas até aqui.",
      icon: "metas",
      check: (ctx) => ctx.goalsConcluded >= 3,
    },
    {
      key: "checkin_noturno >= 7",
      title: "Hábito de revisar o dia",
      description: "7 check-ins noturnos registrados.",
      icon: "moonStars",
      check: (ctx) => ctx.checkinsCount >= 7,
    },
    {
      key: "diario >= 5",
      title: "Registro em dia",
      description: "5 entradas no diário.",
      icon: "book",
      check: (ctx) => ctx.journalCount >= 5,
    },
    {
      key: "consistencia_30 >= 80",
      title: "Regularidade sólida",
      description: "Consistência de 80% ou mais nos últimos 30 dias.",
      icon: "check",
      check: (ctx) => ctx.consistencia30 !== null && ctx.consistencia30 >= 80,
    },
  ];

  async function syncAchievements() {
    const existingKeys = new Set(getAll("achievements").map((a) => a.criteria));
    const ctx = achievementRuleContext();
    for (const rule of ACHIEVEMENT_RULES) {
      if (existingKeys.has(rule.key)) continue;
      if (rule.check(ctx)) {
        const achievement = global.App.Models.createAchievement({
          title: rule.title,
          description: rule.description,
          criteria: rule.key,
          icon: rule.icon,
        });
        await add("achievements", achievement);
      }
    }
    // Fase 6: mesmo gatilho das conquistas — toda mutação relevante já
    // chama syncAchievements(), então reavaliar o motor de insights aqui
    // cobre os mesmos pontos sem espalhar uma segunda chamada por todo
    // app.js. App.Insights pode ainda não existir (ordem de carregamento
    // não garante isso em todo teste isolado), daí o guard.
    if (global.App.Insights && typeof global.App.Insights.refresh === "function") {
      await global.App.Insights.refresh();
    }
  }

  global.App.Store = {
    initAll,
    reloadAll,
    subscribe,
    getAll,
    getById,
    add,
    update,
    remove,
    completeTask,
    reopenTask,
    toggleTask,
    setHabitLogStatus,
    toggleHabitLog,
    logHistory,
    syncOverdueTasks,
    clearDemoData,
    clearAllData,
    createTask,
    updateTaskFields,
    rescheduleTask,
    setTaskSkipped,
    deleteTask,
    addInboxItem,
    removeInboxItem,
    linkInboxToTask,
    ensureDailyPlan,
    toggleSkippedHabit,
    markPlanFinished,
    ensureRecurrenceInstancesForDate,
    createHabit,
    updateHabitFields,
    setHabitActive,
    cycleHabitLogStatus,
    createGoal,
    updateGoalFields,
    updateGoalValue,
    setGoalStatus,
    deleteGoal,
    addMilestone,
    toggleMilestone,
    removeMilestone,
    createObjective,
    updateObjectiveFields,
    deleteObjective,
    saveNightlyCheckin,
    createJournalEntry,
    updateJournalEntry,
    deleteJournalEntry,
    syncAchievements,
    ACHIEVEMENT_RULES,
    get isReady() {
      return ready;
    },
  };
})(window);

/* ==== js/theme.js ==== */
/* ==========================================================================
   THEME — Light / Dark / Automático
   ==========================================================================
   'auto' = não fixa data-theme no <html>; quem decide é o CSS via
   prefers-color-scheme (ver tokens.css). 'light'/'dark' fixam
   data-theme explicitamente e sempre vencem a preferência do sistema.
   A preferência é salva tanto em localStorage (leitura instantânea, antes
   mesmo do banco terminar de abrir — evita "flash" de tema errado) quanto,
   quando o Store já está pronto, em App.Store (settings), como fonte
   durável de configuração ao lado das demais.
   ========================================================================== */
window.App = window.App || {};

(function (global) {
  "use strict";

  const LS_KEY = "execucao_pessoal::theme";
  const VALID = ["light", "dark", "auto"];

  function readLocal() {
    try {
      const v = localStorage.getItem(LS_KEY);
      return VALID.includes(v) ? v : "auto";
    } catch (e) {
      return "auto";
    }
  }

  function writeLocal(pref) {
    try {
      localStorage.setItem(LS_KEY, pref);
    } catch (e) {
      /* silencioso: preferência de tema não é crítica o bastante para travar a UI */
    }
  }

  function apply(pref) {
    const root = document.documentElement;
    if (pref === "auto") {
      root.removeAttribute("data-theme");
    } else {
      root.setAttribute("data-theme", pref);
    }
  }

  let current = readLocal();

  function get() {
    return current;
  }

  async function set(pref) {
    if (!VALID.includes(pref)) return;
    current = pref;
    apply(pref);
    writeLocal(pref);
    // Persiste também nas configurações do Store, se já estiver pronto —
    // mantém uma única fonte de verdade de configurações (App.Store/settings)
    // sem duplicar a lógica de tema em outro lugar.
    if (global.App.Store && global.App.Store.isReady) {
      const settings = global.App.Store.getById("settings", "app") || global.App.Models.defaultSettings();
      settings.theme = pref;
      await global.App.Store.update("settings", settings);
    }
  }

  function init() {
    apply(current);
  }

  global.App.Theme = { init, get, set, VALID };
})(window);
