/* ==== css/tokens.css ==== */
/* ==========================================================================
   DESIGN TOKENS
   ==========================================================================
   Paleta: grafite quente + cobre/bronze como cor de destaque única (ação,
   progresso, marca) e azul-ardósia como cor secundária/informativa — como
   os instrumentos de um painel de precisão, não um app "gamificado".

   Estrutura em 3 camadas, conforme o contrato de tema do Artifact:
   1) :root            -> paleta clara (default, "sem tema definido")
   2) @media (dark)     -> reescreve os tokens quando o SO pede escuro E
                            não há escolha explícita de tema claro
   3) [data-theme=...] -> escolha explícita do usuário, sempre vence
   ========================================================================== */

:root {
  /* --- Superfícies --- */
  --bg: #f7f5f1;
  --bg-elevated: #ffffff;
  --card: #ffffff;
  --card-hover: #fbf9f5;
  --border: rgba(26, 24, 21, 0.09);
  --border-strong: rgba(26, 24, 21, 0.16);

  /* --- Texto --- */
  --text-primary: #1a1815;
  --text-secondary: #635c52;
  --text-tertiary: #8c8477;
  --text-on-accent: #ffffff;

  /* --- Cor de destaque (cobre) --- */
  --accent: #96631e;
  --accent-bright: #c08a3e;
  --accent-soft: rgba(150, 99, 30, 0.12);

  /* --- Cor secundária / informativa (azul-ardósia) --- */
  --accent-2: #4453c4;
  --accent-2-soft: rgba(68, 83, 196, 0.1);

  /* --- Semânticas de status --- */
  --success: #3f7a4e;
  --success-soft: rgba(63, 122, 78, 0.1);
  --danger: #b23b2c;
  --danger-soft: rgba(178, 59, 44, 0.1);
  --warning: #8c6a0c;
  --warning-soft: rgba(140, 106, 12, 0.12);

  /* --- Elevação --- */
  --shadow: 0 8px 24px rgba(26, 24, 21, 0.08);
  --shadow-sm: 0 2px 8px rgba(26, 24, 21, 0.06);

  /* --- Forma --- */
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --radius-full: 999px;

  /* --- Tipografia --- */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
    Helvetica, Arial, sans-serif;

  color-scheme: light;
}

/* Escuro automático (segue o sistema operacional) — só se aplica quando
   NÃO há escolha explícita de tema claro ([data-theme="light"]). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16151a;
    --bg-elevated: #1c1b21;
    --card: #1f1e25;
    --card-hover: #26252d;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);

    --text-primary: #f3f1ec;
    --text-secondary: #a6a1b0;
    --text-tertiary: #8c879a;
    --text-on-accent: #1a1409;

    --accent: #e0a455;
    --accent-bright: #f0bc7a;
    --accent-soft: rgba(224, 164, 85, 0.16);

    --accent-2: #7c8af0;
    --accent-2-soft: rgba(124, 138, 240, 0.16);

    --success: #6fbe83;
    --success-soft: rgba(111, 190, 131, 0.16);
    --danger: #e27462;
    --danger-soft: rgba(226, 116, 98, 0.16);
    --warning: #e0b94d;
    --warning-soft: rgba(224, 185, 77, 0.16);

    --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);

    color-scheme: dark;
  }
}

/* Escolha explícita: Escuro — vence sempre, independente do SO. */
:root[data-theme="dark"] {
  --bg: #16151a;
  --bg-elevated: #1c1b21;
  --card: #1f1e25;
  --card-hover: #26252d;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);

  --text-primary: #f3f1ec;
  --text-secondary: #a6a1b0;
  --text-tertiary: #8c879a;
  --text-on-accent: #1a1409;

  --accent: #e0a455;
  --accent-bright: #f0bc7a;
  --accent-soft: rgba(224, 164, 85, 0.16);

  --accent-2: #7c8af0;
  --accent-2-soft: rgba(124, 138, 240, 0.16);

  --success: #6fbe83;
  --success-soft: rgba(111, 190, 131, 0.16);
  --danger: #e27462;
  --danger-soft: rgba(226, 116, 98, 0.16);
  --warning: #e0b94d;
  --warning-soft: rgba(224, 185, 77, 0.16);

  --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);

  color-scheme: dark;
}

/* Escolha explícita: Claro — reforça a paleta clara mesmo com SO escuro. */
:root[data-theme="light"] {
  --bg: #f7f5f1;
  --bg-elevated: #ffffff;
  --card: #ffffff;
  --card-hover: #fbf9f5;
  --border: rgba(26, 24, 21, 0.09);
  --border-strong: rgba(26, 24, 21, 0.16);

  --text-primary: #1a1815;
  --text-secondary: #635c52;
  --text-tertiary: #8c8477;
  --text-on-accent: #ffffff;

  --accent: #96631e;
  --accent-bright: #c08a3e;
  --accent-soft: rgba(150, 99, 30, 0.12);

  --accent-2: #4453c4;
  --accent-2-soft: rgba(68, 83, 196, 0.1);

  --success: #3f7a4e;
  --success-soft: rgba(63, 122, 78, 0.1);
  --danger: #b23b2c;
  --danger-soft: rgba(178, 59, 44, 0.1);
  --warning: #8c6a0c;
  --warning-soft: rgba(140, 106, 12, 0.12);

  --shadow: 0 8px 24px rgba(26, 24, 21, 0.08);
  --shadow-sm: 0 2px 8px rgba(26, 24, 21, 0.06);

  color-scheme: light;
}

/* ==== css/base.css ==== */
/* ==========================================================================
   BASE — reset, tipografia e fundamentos de acessibilidade
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  padding: 0;
}
button {
  font: inherit;
}
ul {
  margin: 0;
  padding: 0;
  list-style: none;
}
h1,
h2,
h3,
h4,
p {
  margin: 0;
}
a {
  color: inherit;
}

html {
  overflow-x: hidden;
}

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  transition: background 0.25s ease, color 0.25s ease;
  overscroll-behavior-y: none;
  overflow-x: hidden;
  max-width: 100vw;
}

h1,
h2,
h3 {
  text-wrap: balance;
  letter-spacing: -0.2px;
}

/* Números alinhados em coluna (datas, estatísticas, contadores). */
.num,
.tabular {
  font-variant-numeric: tabular-nums;
}

/* --- Acessibilidade: foco visível apenas quando navegando por teclado --- */
a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}

/* --- Respeita preferência do sistema por menos animação --- */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* --- Utilitários mínimos, reaproveitados por vários componentes --- */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.text-secondary {
  color: var(--text-secondary);
}
.text-tertiary {
  color: var(--text-tertiary);
}

/* ==== css/layout.css ==== */
/* ==========================================================================
   LAYOUT — shell do app (sidebar desktop, bottom-nav mobile)
   ==========================================================================
   Prioridade de responsividade (briefing item 12): MacBook/Desktop primeiro,
   depois iPhone, depois tablet. O layout mobile NÃO é o desktop espremido:
   a navegação muda de lugar (sidebar -> barra inferior) e o conteúdo ganha
   respiro próprio, não apenas colunas menores.
   ========================================================================== */

#app {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  min-height: 100vh;
}

/* ---- Sidebar (desktop) ---- */
.sidebar {
  background: var(--bg-elevated);
  border-right: 1px solid var(--border);
  padding: 22px 14px;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 10px 26px;
}
.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 14px rgba(150, 99, 30, 0.28);
}
.brand-mark svg {
  width: 19px;
  height: 19px;
}
.brand-text {
  line-height: 1.15;
  min-width: 0;
}
.brand-text strong {
  display: block;
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: -0.2px;
}
.brand-text span {
  display: block;
  font-size: 10.5px;
  color: var(--text-tertiary);
  font-weight: 600;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  margin-top: 2px;
}

nav.main-nav {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
  overflow-y: auto;
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  text-align: left;
  font-size: 13.5px;
  font-weight: 600;
  transition: background 0.15s ease, color 0.15s ease;
}
.nav-btn svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nav-btn:hover {
  background: var(--card-hover);
  color: var(--text-primary);
}
.nav-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
}
.nav-btn .nav-label {
  flex: 1;
  white-space: nowrap;
}
.nav-btn .nav-phase {
  font-size: 9.5px;
  font-weight: 700;
  color: var(--text-tertiary);
  background: var(--border);
  padding: 2px 6px;
  border-radius: var(--radius-full);
}
.nav-btn.active .nav-phase {
  color: var(--accent);
  background: var(--accent-soft);
}

.sidebar-footer {
  margin-top: 14px;
  padding: 12px 12px 2px;
  border-top: 1px solid var(--border);
}
.storage-badge {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 11px;
  color: var(--text-tertiary);
  line-height: 1.45;
  padding-top: 12px;
}
.storage-badge svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  margin-top: 1px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 1.8;
}

/* ---- Coluna principal ---- */
.main-col {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar h1 {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.2px;
}
.topbar .topbar-sub {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 2px;
  font-weight: 500;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.theme-toggle {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-primary);
  transition: border-color 0.15s ease, background 0.15s ease;
}
.theme-toggle:hover {
  border-color: var(--border-strong);
  background: var(--card-hover);
}
.theme-toggle svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.view-container {
  padding: 8px 28px 48px;
  flex: 1;
  max-width: 1080px;
}

.view-header {
  margin: 20px 0 4px;
}
.view-header p {
  color: var(--text-secondary);
  font-size: 13.5px;
  margin-top: 4px;
  max-width: 60ch;
  line-height: 1.55;
}

/* ---- Bottom nav (mobile) ---- */
.bottom-nav {
  display: none;
}

/* ==========================================================================
   RESPONSIVO
   ========================================================================== */

/* Tablet: sidebar colapsa para ícones */
@media (max-width: 1100px) and (min-width: 768px) {
  #app {
    grid-template-columns: 80px minmax(0, 1fr);
  }
  .brand-text,
  .nav-btn .nav-label,
  .nav-btn .nav-phase,
  .sidebar-footer {
    display: none;
  }
  .brand {
    justify-content: center;
    padding-bottom: 18px;
  }
  .nav-btn {
    justify-content: center;
    padding: 11px;
  }
}

/* Mobile (iPhone): sidebar some, entra bottom nav */
@media (max-width: 767px) {
  #app {
    grid-template-columns: minmax(0, 1fr);
  }
  .sidebar {
    display: none;
  }
  .topbar {
    padding: 14px 18px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  .topbar h1 {
    font-size: 16.5px;
  }
  .view-container {
    padding: 4px 16px calc(96px + env(safe-area-inset-bottom, 0px));
    max-width: none;
  }

  .bottom-nav {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding: 7px 4px calc(7px + env(safe-area-inset-bottom, 0px));
    overflow-x: auto;
    scrollbar-width: none;
  }
  .bottom-nav::-webkit-scrollbar {
    display: none;
  }
  .bottom-nav .nav-btn {
    flex-direction: column;
    gap: 3px;
    padding: 6px 6px;
    flex: 0 0 64px;
    width: 64px;
    font-size: 9.5px;
    border-radius: 12px;
  }
  .bottom-nav .nav-btn svg {
    width: 19px;
    height: 19px;
  }
  .bottom-nav .nav-btn .nav-phase {
    display: none;
  }
  .bottom-nav .nav-btn .nav-label {
    white-space: normal;
    text-align: center;
    line-height: 1.15;
    width: 100%;
  }
}

/* ==== css/components.css ==== */
/* ==========================================================================
   COMPONENTS — peças reutilizáveis do Design System
   Cada bloco aqui corresponde a um builder em js/ui.js. Nenhuma view deve
   inventar estilos novos de card/botão/badge fora daqui.
   ========================================================================== */

/* ---- Cartão base ---- */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  box-shadow: var(--shadow-sm);
}
.card-hover:hover {
  background: var(--card-hover);
  border-color: var(--border-strong);
}

/* ---- Botões ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 10px;
  font-weight: 700;
  font-size: 13px;
  padding: 10px 18px;
  cursor: pointer;
  transition: filter 0.15s ease, background 0.15s ease, transform 0.08s ease;
}
.btn:active {
  transform: scale(0.97);
}
.btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-bright));
  color: var(--text-on-accent);
}
.btn-primary:hover {
  filter: brightness(1.06);
}
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
}
.btn-ghost:hover {
  border-color: var(--border-strong);
  color: var(--text-primary);
}
.btn-danger {
  background: var(--danger-soft);
  color: var(--danger);
  border: 1px solid rgba(178, 59, 44, 0.25);
}
.btn-danger:hover {
  filter: brightness(1.05);
}
.btn-sm {
  padding: 7px 13px;
  font-size: 12px;
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn-block {
  width: 100%;
}

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.icon-btn:hover {
  background: var(--card-hover);
  color: var(--text-primary);
}
.icon-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
}

/* ---- Badges ---- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: var(--radius-full);
  white-space: nowrap;
}
.badge-accent {
  background: var(--accent-soft);
  color: var(--accent);
}
.badge-info {
  background: var(--accent-2-soft);
  color: var(--accent-2);
}
.badge-success {
  background: var(--success-soft);
  color: var(--success);
}
.badge-warning {
  background: var(--warning-soft);
  color: var(--warning);
}
.badge-danger {
  background: var(--danger-soft);
  color: var(--danger);
}
.badge-neutral {
  background: var(--border);
  color: var(--text-tertiary);
}

/* ---- Barra de progresso ---- */
.progress-track {
  width: 100%;
  height: 9px;
  border-radius: var(--radius-full);
  background: var(--border);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 0.4s ease;
}
.progress-meta-row {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--text-secondary);
  margin-top: 6px;
}

/* ---- Segmented control (ex.: seletor de tema) ---- */
.segmented {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  width: fit-content;
}
.segmented button {
  border: none;
  background: transparent;
  color: var(--text-secondary);
  padding: 8px 14px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s ease, color 0.15s ease;
}
.segmented button svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
}
.segmented button.active {
  background: var(--accent-soft);
  color: var(--accent);
}

/* ---- Estado vazio ---- */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
  padding: 34px 16px;
  color: var(--text-tertiary);
}
.empty-state svg {
  width: 28px;
  height: 28px;
  stroke: var(--text-tertiary);
  fill: none;
  stroke-width: 1.6;
  opacity: 0.85;
}
.empty-state p {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.55;
  max-width: 320px;
}

/* ---- Placeholder de fase futura (usado nas 5 áreas na Fase 0) ---- */
.placeholder-card {
  max-width: 640px;
  margin-top: 20px;
}
.placeholder-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
}
.placeholder-icon svg {
  width: 24px;
  height: 24px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.placeholder-card h2 {
  font-size: 19px;
  margin-bottom: 4px;
}
.phase-tag {
  display: inline-block;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-tertiary);
  background: var(--border);
  padding: 3px 9px;
  border-radius: var(--radius-full);
  margin-bottom: 12px;
  letter-spacing: 0.3px;
}
.placeholder-card p.desc {
  color: var(--text-secondary);
  font-size: 13.5px;
  line-height: 1.6;
  margin-bottom: 16px;
}
.placeholder-card ul.feature-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.placeholder-card ul.feature-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--text-secondary);
}
.placeholder-card ul.feature-list li::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* ---- Ajustes: cartões de configuração ---- */
.settings-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 640px;
  margin-top: 20px;
}
.settings-card h3 {
  font-size: 14.5px;
  margin-bottom: 4px;
}
.settings-card p {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin: 0 0 14px;
  line-height: 1.55;
}
/* Única ação destrutiva e irreversível de Ajustes — borda discreta em tom
   de alerta, só pra separar visualmente de "Remover exemplos" (que é
   seguro) sem gritar ou adicionar outro padrão visual novo. */
.settings-card-danger {
  border-color: var(--danger-soft);
}
.row-between {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.info-banner {
  display: flex;
  gap: 12px;
  background: var(--accent-soft);
  border: 1px solid rgba(150, 99, 30, 0.22);
  border-radius: var(--radius-md);
  padding: 14px 16px;
}
.info-banner svg {
  width: 18px;
  height: 18px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 1.8;
  flex-shrink: 0;
  margin-top: 1px;
}
.info-banner p {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--text-primary);
}
.info-banner strong {
  color: var(--accent);
}

/* ---- Modal ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(15, 13, 10, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: modalOverlayIn 0.18s ease both;
}
.modal-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px;
  max-width: 440px;
  width: 100%;
  box-shadow: var(--shadow);
  max-height: 85vh;
  overflow-y: auto;
  animation: modalCardIn 0.22s ease both;
}
.modal-card h3 {
  font-size: 16px;
  margin-bottom: 4px;
}
.modal-card p {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
  margin: 0 0 14px;
}
.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  flex-wrap: wrap;
  margin-top: 4px;
}
@keyframes modalOverlayIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes modalCardIn {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
.modal-overlay.is-closing {
  animation: modalOverlayOut 0.14s ease both;
}
.modal-overlay.is-closing .modal-card {
  animation: modalCardOut 0.14s ease both;
}
@keyframes modalOverlayOut {
  to {
    opacity: 0;
  }
}
@keyframes modalCardOut {
  to {
    opacity: 0;
    transform: translateY(6px) scale(0.98);
  }
}

/* ---- Toast ---- */
.toast-stack {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: stretch;
  width: min(92vw, 420px);
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  box-shadow: var(--shadow);
  font-size: 13px;
  font-weight: 600;
  width: 100%;
  opacity: 0;
  transform: translateY(12px) scale(0.98);
  transition: opacity 0.22s ease, transform 0.22s ease;
}
.toast.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.toast.hide {
  opacity: 0;
  transform: translateY(6px) scale(0.98);
}
.toast-icon {
  display: flex;
  flex-shrink: 0;
}
.toast-icon svg {
  width: 17px;
  height: 17px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
}
.toast-msg {
  flex: 1;
  line-height: 1.35;
}
.toast-success .toast-icon {
  color: var(--success);
}
.toast-error {
  border-color: rgba(178, 59, 44, 0.4);
}
.toast-error .toast-icon {
  color: var(--danger);
}
.toast-info .toast-icon {
  color: var(--accent-2);
}

@media (max-width: 640px) {
  .toast-stack {
    bottom: 84px;
  }
  .icon-btn {
    min-width: 34px;
    min-height: 34px;
  }
  .placeholder-card,
  .settings-grid {
    max-width: none;
  }
}

/* ==========================================================================
   FASE 1 — TELA "HOJE"
   ========================================================================== */

/* ---- Cabeçalho do dia ---- */
.hoje-header {
  margin: 20px 0 22px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hoje-header .hoje-date {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.hoje-header h2 {
  font-size: 24px;
  letter-spacing: -0.3px;
}
.hoje-header .hoje-phrase {
  font-size: 13.5px;
  color: var(--text-secondary);
}
.hoje-header .hoje-progress-wrap {
  max-width: 360px;
  margin-top: 4px;
}
.hoje-progress-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 6px;
  font-weight: 600;
}

/* ---- Seção genérica ---- */
.hoje-section {
  margin-top: 28px;
}
.hoje-section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 12px;
}
.hoje-section-title svg {
  width: 15px;
  height: 15px;
  stroke: var(--text-tertiary);
  fill: none;
  stroke-width: 1.8;
}

/* ---- Foco Agora ---- */
.focus-now-card {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent-soft), var(--shadow-sm);
}
.focus-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.5px;
  color: var(--accent);
}
.focus-eyebrow svg {
  width: 14px;
  height: 14px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 2;
}
.focus-main {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.focus-icon {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-md);
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.focus-icon svg {
  width: 26px;
  height: 26px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 1.8;
}
.focus-icon.tone-info {
  background: var(--accent-2-soft);
}
.focus-icon.tone-info svg {
  stroke: var(--accent-2);
}
.focus-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.2px;
}
.focus-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.focus-main .btn {
  margin-left: auto;
}
.focus-next-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--text-secondary);
}
.focus-next-row svg {
  width: 14px;
  height: 14px;
  stroke: var(--text-tertiary);
  fill: none;
  stroke-width: 1.8;
  flex-shrink: 0;
}
.focus-now-empty .focus-empty-msg {
  margin-top: 10px;
  font-size: 13.5px;
  color: var(--text-secondary);
}

/* ---- Item de meta/horário reutilizado em vários lugares ---- */
.activity-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-secondary);
}
.activity-meta-item svg {
  width: 13px;
  height: 13px;
  stroke: var(--text-tertiary);
  fill: none;
  stroke-width: 1.8;
}

/* ---- Prioridades (chips) ---- */
.priorities-strip {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.priority-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  padding: 7px 14px 7px 8px;
  cursor: pointer;
  font: inherit;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.priority-chip:hover {
  border-color: var(--accent);
}
.priority-chip-check {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: #fff;
}
.priority-chip-check svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.4;
}
.priority-chip.is-done .priority-chip-check {
  background: var(--accent);
}
.priority-chip-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}
.priority-chip.is-done .priority-chip-label {
  color: var(--text-tertiary);
  text-decoration: line-through;
}
.priority-chip-time {
  font-size: 11.5px;
  color: var(--text-tertiary);
}
.priorities-empty {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--success);
  font-weight: 600;
}
.priorities-empty svg {
  width: 16px;
  height: 16px;
  stroke: var(--success);
  fill: none;
  stroke-width: 2;
}

/* ---- Grade de atividades ---- */
.activities-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
@media (max-width: 640px) {
  .activities-grid {
    grid-template-columns: 1fr;
  }
}

.activity-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  transition: opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
.activity-card.importance-essencial {
  border-left-color: var(--accent);
}
.activity-card.importance-importante {
  border-left-color: var(--accent-2);
}
.activity-card.importance-opcional {
  border-left-color: var(--border-strong);
}
.activity-card.is-done {
  background: var(--card-hover);
}
.activity-card.is-done .activity-title {
  color: var(--text-tertiary);
  text-decoration: line-through;
}
.activity-card.is-done .activity-body {
  opacity: 0.72;
}

.activity-check {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  color: #fff;
  margin-top: 1px;
  transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
}
.activity-check svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.6;
}
.activity-check:hover {
  border-color: var(--accent);
}
.activity-check:active {
  transform: scale(0.88);
}
.activity-check.is-done {
  background: var(--success);
  border-color: var(--success);
}

.activity-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.activity-icon svg {
  width: 17px;
  height: 17px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 1.8;
}
.activity-icon.tone-info {
  background: var(--accent-2-soft);
}
.activity-icon.tone-info svg {
  stroke: var(--accent-2);
}
.activity-card.is-done .activity-icon {
  background: var(--border);
}
.activity-card.is-done .activity-icon svg {
  stroke: var(--text-tertiary);
}

.activity-body {
  min-width: 0;
  flex: 1;
  transition: opacity 0.2s ease;
}
.activity-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.1px;
  margin-bottom: 5px;
}
.activity-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.activity-context {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 5px;
  font-style: italic;
}

/* ---- Progresso do dia (medidores radiais) ---- */
.progress-rings-row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.progress-ring-card {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1 1 220px;
}
.progress-ring {
  position: relative;
  flex-shrink: 0;
}
.progress-ring svg {
  display: block;
}
.progress-ring-fill {
  transition: stroke-dashoffset 0.5s ease;
}
.progress-ring-label {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.1;
}
.progress-ring-label strong {
  font-size: 16px;
  font-weight: 700;
}
.progress-ring-label span {
  font-size: 9.5px;
  color: var(--text-tertiary);
}
.progress-ring-meta strong {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
}
.progress-ring-meta span {
  font-size: 12px;
  color: var(--text-secondary);
}

/* ---- Insights curtos ---- */
.insights-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.insight-line {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  color: var(--text-primary);
  background: var(--accent-soft);
  border-radius: var(--radius-md);
  padding: 11px 14px;
  line-height: 1.5;
}
.insight-line svg {
  width: 15px;
  height: 15px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 1.8;
  flex-shrink: 0;
  margin-top: 2px;
}

/* ---- Campo de texto simples (ex.: nome em Ajustes) ---- */
.field-inline {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.backup-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 4px;
}
.text-input {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13.5px;
  color: var(--text-primary);
  font-family: var(--font);
  min-width: 200px;
}
.text-input:focus {
  outline: none;
  border-color: var(--accent);
}

@media (max-width: 640px) {
  .focus-main .btn {
    margin-left: 0;
    width: 100%;
  }
  .progress-ring-card {
    flex: 1 1 100%;
  }
}

/* ==========================================================================
   FASE 2 — PLANEJAMENTO
   ========================================================================== */

.plan-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
}
.plan-mode-switch svg {
  width: 15px;
  height: 15px;
}

.day-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 20px 0 6px;
}
.day-nav-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 190px;
  text-align: center;
}
.day-nav-label strong {
  font-size: 14px;
  font-weight: 700;
}
.day-nav-today {
  border: none;
  background: none;
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  padding: 0;
}

.plan-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 20px;
  margin-top: 18px;
  align-items: start;
}
@media (max-width: 900px) {
  .plan-layout {
    grid-template-columns: 1fr;
  }
}

/* ---- Timeline ---- */
.timeline-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.timeline-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  transition: opacity 0.2s ease, background 0.2s ease;
}
.timeline-item.importance-essencial {
  border-left-color: var(--accent);
}
.timeline-item.importance-importante {
  border-left-color: var(--accent-2);
}
.timeline-item.importance-opcional {
  border-left-color: var(--border-strong);
}
.timeline-item.is-next {
  box-shadow: 0 0 0 1px var(--accent-soft);
}
.timeline-item.is-done {
  background: var(--card-hover);
}
.timeline-item.is-done .timeline-title {
  color: var(--text-tertiary);
  text-decoration: line-through;
}
.timeline-item.is-skipped {
  opacity: 0.62;
}
.timeline-item.is-skipped .timeline-title {
  text-decoration: line-through;
}

.timeline-time-col {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  min-width: 52px;
  padding-top: 3px;
  gap: 2px;
  flex-shrink: 0;
}
.timeline-time-col .num {
  font-size: 13px;
  font-weight: 700;
}
.timeline-duration {
  font-size: 10.5px;
  color: var(--text-tertiary);
}
.timeline-no-time {
  display: flex;
  color: var(--text-tertiary);
}
.timeline-no-time svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
}

.timeline-body {
  flex: 1;
  min-width: 0;
  padding-top: 2px;
}
.timeline-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.timeline-title {
  font-size: 13.5px;
  font-weight: 700;
}

.timeline-actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}

/* ---- Inbox ---- */
.inbox-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.inbox-header {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.inbox-add-row {
  display: flex;
  gap: 8px;
}
.inbox-add-row .text-input {
  /* .text-input tem min-width:200px por padrão (pensado pro campo largo de
     Ajustes) — dentro do painel estreito da Inbox (300px) isso empurrava o
     botão "Adicionar" pra fora do card. Aqui o input precisa poder encolher. */
  min-width: 0;
}
.inbox-add-row .btn {
  flex-shrink: 0;
}
.inbox-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 320px;
  overflow-y: auto;
}
.inbox-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 2px;
  border-bottom: 1px solid var(--border);
}
.inbox-row:last-child {
  border-bottom: none;
}
.inbox-text {
  font-size: 12.5px;
  flex: 1;
  min-width: 0;
}
.inbox-row-actions {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}

/* ---- Hábitos programados (Prepare seu amanhã) ---- */
.habit-plan-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.habit-plan-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 14px;
}
.habit-plan-row.is-skipped {
  opacity: 0.6;
}
.habit-plan-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.habit-plan-name {
  font-size: 13px;
  font-weight: 700;
}

.plan-finish-row {
  margin-top: 28px;
  display: flex;
  justify-content: flex-end;
}

/* ---- Formulário de atividade (modal) ---- */
.form-row {
  margin-bottom: 14px;
}
.form-row:last-child {
  margin-bottom: 0;
}
.form-row > label {
  display: block;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 6px;
}
.form-row > label svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  vertical-align: -1px;
  margin-right: 1px;
}
.form-row-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.form-row-split .text-input {
  width: 100%;
}

.duration-chips {
  display: flex;
  gap: 5px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.chip-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  border-radius: var(--radius-full);
  padding: 3px 9px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.chip-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.segmented-radio {
  display: inline-flex;
}
.segmented-radio input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.segmented-radio span {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
}
.segmented-radio input:checked + span {
  background: var(--accent-soft);
  color: var(--accent);
}
.segmented-radio input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}

.form-more {
  margin-top: 4px;
}
.form-more summary {
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  padding: 6px 0;
  list-style: none;
}
.form-more summary::-webkit-details-marker {
  display: none;
}
.form-more[open] summary {
  margin-bottom: 8px;
}

.weekday-picker {
  display: none;
  gap: 6px;
  margin-top: 8px;
}
.form-row:has(#recWeekly:checked) .weekday-picker {
  display: flex;
}
.weekday-chip input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.weekday-chip span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
  cursor: pointer;
}
.weekday-chip input:checked + span {
  background: var(--accent);
  color: var(--text-on-accent);
  border-color: var(--accent);
}

@media (max-width: 640px) {
  .form-row-split {
    grid-template-columns: 1fr;
  }
  .plan-toolbar {
    flex-direction: column;
    align-items: stretch;
  }
  .day-nav-label {
    min-width: 0;
  }
}

/* ==========================================================================
   FASE 3 — HÁBITOS
   ========================================================================== */

.habits-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  margin-top: 18px;
}

.habit-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  cursor: pointer;
  text-align: left;
}
.habit-card-top {
  display: flex;
  align-items: center;
  gap: 12px;
}
.habit-card-title {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.habit-card-title strong {
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.habit-card-title span {
  font-size: 11.5px;
}
.streak-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  padding: 4px 9px;
  border-radius: var(--radius-full);
  flex-shrink: 0;
}
.streak-pill svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
}

.habit-card-mid {
  display: flex;
  align-items: center;
  gap: 16px;
}
.habit-card-stats {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.habit-card-stats strong {
  font-size: 15px;
  font-weight: 700;
}
.habit-card-stats span {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-left: 6px;
}

.habit-week-row {
  display: flex;
  gap: 5px;
}
.habit-week-dot {
  flex: 1;
  height: 7px;
  border-radius: var(--radius-full);
  background: var(--border);
}
.habit-week-dot.status-concluido {
  background: var(--accent);
}
.habit-week-dot.status-parcial {
  background: color-mix(in srgb, var(--accent) 45%, transparent);
}
.habit-week-dot.status-future {
  background: var(--border);
  opacity: 0.4;
}
.habit-week-dot.status-not_scheduled {
  background: transparent;
  border: 1px dashed var(--border-strong);
}

/* ---- Detalhe do hábito ---- */
.habit-detail-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 20px 0 22px;
}
.habit-detail-icon {
  width: 44px;
  height: 44px;
}
.habit-detail-icon svg {
  width: 22px;
  height: 22px;
}
.habit-detail-title {
  flex: 1;
  min-width: 0;
}
.habit-detail-title h2 {
  font-size: 19px;
}
.habit-detail-title span {
  font-size: 12.5px;
}

.habit-stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin-bottom: 26px;
}
.habit-stat-tile {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.habit-stat-tile strong {
  font-size: 18px;
  font-weight: 700;
}
.habit-stat-tile span {
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.streak-break-banner {
  margin-bottom: 20px;
}

.heatmap-range-switch button {
  font-size: 11.5px;
  padding: 7px 12px;
}

/* ---- Calendário de aderência (heatmap) ---- */
.heatmap-wrap {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.heatmap-weekday-col {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex-shrink: 0;
  padding-top: 1px;
}
.heatmap-weekday-col span {
  width: 12px;
  height: 12px;
  font-size: 9px;
  font-weight: 700;
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  justify-content: center;
}
.heatmap-weekday-col span.is-dim {
  opacity: 0;
}
.heatmap-grid {
  display: flex;
  gap: 3px;
}
.heatmap-col {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.heatmap-cell {
  width: 12px;
  height: 12px;
  border-radius: 3.5px;
  background: var(--border);
  display: block;
}
.heatmap-cell.status-concluido {
  background: var(--accent);
  cursor: pointer;
}
.heatmap-cell.status-parcial {
  background: color-mix(in srgb, var(--accent) 45%, transparent);
  cursor: pointer;
}
.heatmap-cell.status-not_marked,
.heatmap-cell.status-nao_realizado {
  background: var(--border-strong);
  cursor: pointer;
}
.heatmap-cell.status-not_scheduled {
  background: transparent;
  border: 1px dashed var(--border);
  opacity: 0.6;
}
.heatmap-cell.status-future,
.heatmap-cell.status-before_creation,
.heatmap-cell.status-out_of_range {
  background: transparent;
  opacity: 0;
  pointer-events: none;
}
.heatmap-cell.status-concluido:hover,
.heatmap-cell.status-parcial:hover,
.heatmap-cell.status-not_marked:hover,
.heatmap-cell.status-nao_realizado:hover {
  outline: 1.5px solid var(--accent);
  outline-offset: 1px;
}

.heatmap-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 14px;
  font-size: 11px;
  color: var(--text-tertiary);
}
.heatmap-legend .heatmap-cell {
  cursor: default;
  margin-left: 8px;
}
.heatmap-legend .heatmap-cell:first-child {
  margin-left: 0;
}

/* ---- Seletor de ícone (cadastro de hábito) ---- */
.icon-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.icon-radio input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.icon-radio span {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
}
.icon-radio span svg {
  width: 17px;
  height: 17px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
}
.icon-radio input:checked + span {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.icon-radio input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.freq-count-picker {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.form-row:has(#habitFreqWeekly:checked) .weekday-picker {
  display: flex;
}
.form-row:has(#habitFreqCount:checked) .freq-count-picker {
  display: flex;
}

/* ---- Hábitos arquivados ---- */
.archived-habit-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.archived-habit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 2px;
  border-bottom: 1px solid var(--border);
}
.archived-habit-row:last-child {
  border-bottom: none;
}
.archived-habit-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}
.archived-habit-name svg {
  width: 15px;
  height: 15px;
  stroke: var(--text-tertiary);
  fill: none;
  stroke-width: 1.8;
}

@media (max-width: 640px) {
  .habits-grid {
    grid-template-columns: 1fr;
  }
  .habit-stats-row {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* ==========================================================================
   FASE 4 — METAS
   ========================================================================== */

/* Cores de texto por tom — usado no prazo do card/detalhe da meta
   (item 4/5: "atrasada"/"vence em breve"/"no prazo"), sempre a partir da
   mesma rampa de cor do resto do app, nunca uma cor nova. */
.tone-success { color: var(--success); }
.tone-warning { color: var(--warning); }
.tone-danger { color: var(--danger); }
.tone-neutral { color: var(--text-tertiary); }
.tone-accent { color: var(--accent); }

/* ---- Objetivos + grade de metas ---- */
.objective-group {
  margin-top: 22px;
}
.objective-group:first-of-type {
  margin-top: 18px;
}
.objective-group-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.objective-group-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-secondary);
}

.goals-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}

.goal-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  cursor: pointer;
  text-align: left;
}
.goal-card-top {
  display: flex;
  align-items: center;
  gap: 12px;
}
.goal-card-title {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.goal-card-title strong {
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.goal-card-title span {
  font-size: 11.5px;
}
.goal-card-mid {
  display: flex;
  align-items: center;
  gap: 16px;
}
.goal-card-ring-placeholder {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--border);
  opacity: 0.5;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.goal-card-ring-placeholder svg {
  width: 22px;
  height: 22px;
  stroke: var(--text-secondary);
  fill: none;
  stroke-width: 1.8;
}
.goal-card-stats {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.goal-card-value-line {
  font-size: 13px;
  font-weight: 700;
}
.goal-card-deadline {
  font-size: 11.5px;
  font-weight: 600;
}
.goal-card-activity {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--text-tertiary);
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.goal-card-activity svg {
  width: 13px;
  height: 13px;
  stroke: var(--accent);
  fill: none;
  stroke-width: 1.8;
  flex-shrink: 0;
}

/* ---- Detalhe da meta ---- */
.goal-status-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.goal-description {
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 18px;
  white-space: pre-wrap;
}
.goal-progress-main {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 16px;
}
.goal-progress-main.goal-progress-qualitative .activity-icon {
  width: 44px;
  height: 44px;
}
.goal-progress-meta {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.goal-progress-meta strong {
  font-size: 15px;
  font-weight: 700;
}
.goal-progress-meta span {
  font-size: 12px;
}
.goal-value-editor {
  margin-bottom: 20px;
}
.goal-pace-status {
  margin-top: -14px;
  margin-bottom: 20px;
}

/* ---- Marcos (tipo 'marco') ---- */
.milestone-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.milestone-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 2px;
  border-bottom: 1px solid var(--border);
}
.milestone-row:last-child {
  border-bottom: none;
}
.milestone-label {
  flex: 1;
  min-width: 0;
  font-size: 13px;
}
.milestone-label.is-done {
  color: var(--text-tertiary);
  text-decoration: line-through;
}
.milestone-add-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.milestone-add-row .text-input {
  min-width: 0;
  flex: 1;
}
.milestone-add-row .btn {
  flex-shrink: 0;
}

/* ---- Tarefas/hábitos vinculados + atividade recente ---- */
.goal-linked-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.goal-linked-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 2px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.goal-linked-row:last-child {
  border-bottom: none;
}
.goal-linked-text {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.goal-linked-text svg {
  width: 14px;
  height: 14px;
  stroke: var(--text-tertiary);
  fill: none;
  stroke-width: 1.8;
  flex-shrink: 0;
}

/* ---- Seletor de tipo de meta (cadastro) ---- */
.goal-type-picker {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.goal-type-chip input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.goal-type-chip span {
  display: flex;
  flex-direction: column;
  gap: 2px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  cursor: pointer;
}
.goal-type-chip strong {
  font-size: 12px;
  font-weight: 700;
}
.goal-type-chip em {
  font-size: 10.5px;
  font-style: normal;
  color: var(--text-tertiary);
}
.goal-type-chip input:checked + span {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.goal-type-chip input:checked + span strong {
  color: var(--accent);
}
.goal-type-chip input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* Campos condicionais ao tipo escolhido (mesmo padrão :has() já usado na
   frequência de hábito — aqui escopado ao FORM inteiro, não só à linha,
   porque valor-alvo/unidade e o aviso de marcos ficam em linhas diferentes
   do seletor de tipo). */
#goalForm .goal-value-fields,
#goalForm .goal-marco-hint {
  display: none;
}
#goalForm:has(#goalType_quantitativa:checked) .goal-value-fields,
#goalForm:has(#goalType_percentual:checked) .goal-value-fields {
  display: flex;
}
#goalForm:has(#goalType_marco:checked) .goal-marco-hint {
  display: block;
}

@media (max-width: 640px) {
  .goals-grid {
    grid-template-columns: 1fr;
  }
  .goal-type-picker {
    grid-template-columns: repeat(2, 1fr);
  }
  .goal-progress-main {
    flex-wrap: wrap;
  }
}

/* ==========================================================================
   FASE 5 — EVOLUÇÃO
   ========================================================================== */

.evo-subnav {
  margin-top: 18px;
  margin-bottom: 20px;
}

.evo-period-switch button {
  font-size: 11.5px;
  padding: 7px 12px;
}

.evo-indicators-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-top: 16px;
}
.evo-indicator-card {
  display: flex;
  flex-direction: column;
}
.evo-indicator-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.evo-indicator-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-secondary);
}
.evo-indicator-label svg {
  width: 16px;
  height: 16px;
  stroke: var(--text-tertiary);
  fill: none;
}
.evo-indicator-value {
  font-size: 32px;
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: 2px;
}
.evo-trend {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  white-space: nowrap;
}
.evo-trend-up {
  background: var(--success-soft);
  color: var(--success);
}
.evo-trend-down {
  background: var(--danger-soft);
  color: var(--danger);
}
.evo-trend-flat {
  background: var(--border);
  color: var(--text-tertiary);
}

.evo-sparkline {
  margin-top: auto;
}
.evo-sparkline svg {
  display: block;
}
.evo-sparkline-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed var(--border);
  border-radius: var(--radius-md);
}

.evo-closing-card {
  display: flex;
  flex-direction: column;
}
.evo-closing-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.evo-closing-pct {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
}
.evo-pending-list {
  margin-top: 4px;
  line-height: 1.6;
}

/* ---- Check-in noturno (item 4) ---- */
.checkin-scale {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.checkin-scale-opt input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.checkin-scale-opt span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  cursor: pointer;
}
.checkin-scale-opt input:checked + span {
  background: var(--accent);
  color: var(--text-on-accent);
  border-color: var(--accent);
}
.checkin-scale-opt input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.chip-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.chip-radio input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.chip-radio span {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
}
.chip-radio input:checked + span {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}
.chip-radio input:focus-visible + span {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* ---- Diário (item 6) — cards visuais ---- */
.journal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-top: 18px;
}
.journal-card {
  cursor: pointer;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.journal-card-date {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: var(--text-tertiary);
}
.journal-card-content {
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-secondary);
}
.journal-card-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.journal-card-block {
  border-radius: var(--radius-md);
  padding: 8px 10px;
  background: var(--card);
  border: 1px solid var(--border);
}
.journal-card-block span {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 3px;
}
.journal-card-block span svg {
  width: 13px;
  height: 13px;
  fill: none;
}
.journal-card-block p {
  font-size: 12.5px;
  color: var(--text-primary);
  line-height: 1.5;
}
.journal-card-block.tone-success span svg { stroke: var(--success); }
.journal-card-block.tone-warning span svg { stroke: var(--warning); }
.journal-card-block.tone-info span svg { stroke: var(--accent-2); }

/* ---- Conquistas (item 7) — gamificação discreta ---- */
.achievements-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  margin-top: 18px;
}
.achievement-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.achievement-icon {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-soft);
}
.achievement-icon svg {
  width: 19px;
  height: 19px;
  stroke: var(--accent);
  fill: none;
}
.achievement-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.achievement-body strong {
  font-size: 13.5px;
}
.achievement-body span {
  font-size: 12px;
  color: var(--text-tertiary);
  line-height: 1.5;
}
.achievement-card.is-locked {
  opacity: 0.45;
}
.achievement-card.is-locked .achievement-icon {
  background: var(--border);
}
.achievement-card.is-locked .achievement-icon svg {
  stroke: var(--text-tertiary);
}

/* ---- Histórico (item 8) ---- */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 18px;
}
.history-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 4px;
  border-bottom: 1px solid var(--border);
}
.history-row:last-child {
  border-bottom: none;
}
.history-row-body {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
  font-size: 13px;
}

@media (max-width: 640px) {
  .evo-indicators-grid {
    grid-template-columns: 1fr;
  }
  .journal-grid,
  .achievements-grid {
    grid-template-columns: 1fr;
  }
  .checkin-scale {
    justify-content: space-between;
  }
  .checkin-scale-opt span {
    width: 34px;
    height: 34px;
  }
}

/* ==========================================================================
   FASE 6 — MOTOR DE INTELIGÊNCIA LOCAL
   ========================================================================== */

/* ---- Cartão de insight (Hoje + Evolução) — mais rico que .insight-line:
   cor por severidade, sugestão opcional (sempre recomendação, nunca
   julgamento — item 4 do briefing) e um jeito de dispensar. ---- */
.insight-cards-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.insight-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 14px;
}
.insight-card-icon {
  flex-shrink: 0;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-soft);
}
.insight-card-icon svg {
  width: 15px;
  height: 15px;
  fill: none;
  stroke-width: 1.8;
  stroke: var(--accent);
}
.insight-card-info .insight-card-icon { background: var(--accent-2-soft); }
.insight-card-info .insight-card-icon svg { stroke: var(--accent-2); }
.insight-card-warning .insight-card-icon { background: var(--warning-soft); }
.insight-card-warning .insight-card-icon svg { stroke: var(--warning); }
.insight-card-success .insight-card-icon { background: var(--success-soft); }
.insight-card-success .insight-card-icon svg { stroke: var(--success); }
.insight-card-body {
  flex: 1;
  min-width: 0;
}
.insight-card-body p {
  margin: 0;
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-primary);
}
.insight-card-actions {
  margin-top: 9px;
}
.insight-card-dismiss {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
}
.insight-card-dismiss svg {
  width: 13px;
  height: 13px;
}

/* ---- Frase motivacional junto do fechamento do dia / "Prepare amanhã" ---- */
.evo-closing-phrase {
  margin-top: 10px;
  font-size: 12.5px;
  font-style: italic;
  color: var(--text-tertiary);
}
.plan-amanha-phrase {
  margin-bottom: 18px;
}

@media (max-width: 640px) {
  .insight-card {
    flex-wrap: wrap;
  }
}

/* ---- Transição discreta de navegação ---- */
@keyframes viewEnter {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.view-container.view-enter {
  animation: viewEnter 0.24s ease both;
}

</style>
</head>
