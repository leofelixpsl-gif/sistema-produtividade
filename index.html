    repeat: '<svg viewBox="0 0 24 24"><path d="M4.5 11.5a7.5 7.5 0 0 1 12.6-5.5"/><path d="M17.5 3v4.2h-4.2"/><path d="M19.5 12.5a7.5 7.5 0 0 1-12.6 5.5"/><path d="M6.5 21v-4.2h4.2"/></svg>',
    chevronLeft: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
    // ---- Fase 3 — Hábitos (ícones à escolha no cadastro) ----
    book: '<svg viewBox="0 0 24 24"><path d="M4 4.5h7a3 3 0 0 1 3 3V20a3 3 0 0 0-3-2.5H4z"/><path d="M20 4.5h-7a3 3 0 0 0-3 3V20a3 3 0 0 1 3-2.5h7z"/></svg>',
    droplet: '<svg viewBox="0 0 24 24"><path d="M12 3s6.5 7 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 10 12 3 12 3z"/></svg>',
    dumbbell: '<svg viewBox="0 0 24 24"><path d="M5 9v6M3 10.5v3M19 9v6M21 10.5v3M8 12h8"/></svg>',
    brain: '<svg viewBox="0 0 24 24"><path d="M9 4.5a3 3 0 0 0-3 3v.3A3 3 0 0 0 4 10.5a3 3 0 0 0 1.3 5.4A3 3 0 0 0 8 20a3 3 0 0 0 3-3V6a1.5 1.5 0 0 0-2-1.5z"/><path d="M15 4.5a3 3 0 0 1 3 3v.3a3 3 0 0 1 2 3.7 3 3 0 0 1-1.3 5.4A3 3 0 0 1 16 20a3 3 0 0 1-3-3V6a1.5 1.5 0 0 1 2-1.5z"/></svg>',
    heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.8-9.2C.9 7.6 2.4 4.5 5.6 4a4.8 4.8 0 0 1 6.4 2.1A4.8 4.8 0 0 1 18.4 4c3.2.5 4.7 3.6 3.4 6.8C19.5 15.4 12 20 12 20z"/></svg>',
    // ---- Fase 7 — Refinamento (backup) ----
    download: '<svg viewBox="0 0 24 24"><path d="M12 3.5v11.5M7.5 10.5L12 15l4.5-4.5"/><path d="M4.5 16.5v2A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5v-2"/></svg>',
    upload: '<svg viewBox="0 0 24 24"><path d="M12 15.5V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4.5 16.5v2A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5v-2"/></svg>',
  };

  function icon(name) {
    return ICONS[name] || "";
  }

  // Converte uma chave camelCase (ex.: "taskId") pro nome de atributo
  // data-* correspondente ("data-task-id") — é assim que `el.dataset.taskId`
  // (camelCase) encontra o valor de volta. Sem isso, "data-taskId" vira
  // "data-taskid" depois do parser HTML (que sempre minúsculo os nomes de
  // atributo) e `dataset.taskId` nunca bate com ele.
  function dataAttrName(key) {
    return key.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase());
  }
  function buildDataAttrs(data) {
    return Object.entries(data)
      .map(([k, v]) => `data-${dataAttrName(k)}="${esc(v)}"`)
      .join(" ");
  }

  /* ------------------------------------------------------------------ *
   * CARD / BADGE / BOTÃO / PROGRESSO / ESTADO VAZIO
   * ------------------------------------------------------------------ */

  function card({ content = "", className = "", hover = false } = {}) {
    return `<div class="card ${hover ? "card-hover" : ""} ${className}">${content}</div>`;
  }

  function badge({ label, variant = "neutral" }) {
    return `<span class="badge badge-${variant}">${esc(label)}</span>`;
  }

  function button({ label, variant = "ghost", size = "", iconName = "", action = "", data = {}, type = "button", disabled = false }) {
    const dataAttrs = buildDataAttrs(data);
    return `<button type="${type}" class="btn btn-${variant} ${size ? "btn-" + size : ""}"
        ${action ? `data-action="${esc(action)}"` : ""} ${dataAttrs} ${disabled ? "disabled" : ""}>
        ${iconName ? icon(iconName) : ""}<span>${esc(label)}</span>
      </button>`;
  }

  function progressBar({ value, max = 100, label = "", meta = "" }) {
    const pct = max > 0 ? global.App.Utils.clamp((value / max) * 100, 0, 100) : 0;
    return `
      <div class="progress-wrap">
        ${label ? `<div class="text-secondary" style="font-size:12.5px;margin-bottom:6px;">${esc(label)}</div>` : ""}
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${meta ? `<div class="progress-meta-row"><span>${esc(meta)}</span><span class="num">${Math.round(pct)}%</span></div>` : ""}
      </div>`;
  }

  function emptyState({ iconName = "info", message, actionLabel = "", action = "", actionData = {} }) {
    return `
      <div class="empty-state">
        ${icon(iconName)}
        <p>${esc(message)}</p>
        ${actionLabel ? button({ label: actionLabel, variant: "ghost", size: "sm", action, data: actionData }) : ""}
      </div>`;
  }

  // Botão só-ícone (ações secundárias compactas: editar, reagendar, pular,
  // remover) — reaproveita o mesmo `.icon-btn` já usado no topbar.
  function iconActionBtn({ iconName, action, data = {}, label }) {
    const dataAttrs = buildDataAttrs(data);
    return `<button type="button" class="icon-btn" data-action="${esc(action)}" ${dataAttrs} aria-label="${esc(label)}" title="${esc(label)}">${icon(iconName)}</button>`;
  }

  function placeholderCard({ iconName, phase, title, desc, features = [] }) {
    return `
      <div class="card placeholder-card">
        <div class="placeholder-icon">${icon(iconName)}</div>
        <span class="phase-tag">${esc(phase)}</span>
        <h2>${esc(title)}</h2>
        <p class="desc">${esc(desc)}</p>
        <ul class="feature-list">
          ${features.map((f) => `<li>${esc(f)}</li>`).join("")}
        </ul>
      </div>`;
  }

  /* ------------------------------------------------------------------ *
   * Formatação de horário/duração (só para exibição — nunca a fonte da
   * verdade; os campos brutos startTime/endTime continuam em Task).
   * ------------------------------------------------------------------ */
  function minutesOf(hm) {
    const [h, m] = hm.split(":").map(Number);
    return h * 60 + m;
  }
  function formatTimeRange(start, end) {
    if (!start) return "";
    return end ? `${start} — ${end}` : start;
  }
  function formatDuration(start, end) {
    if (!start || !end) return "";
    let mins = minutesOf(end) - minutesOf(start);
    if (mins < 0) mins += 24 * 60; // atravessa a meia-noite
    if (mins === 0) return "";
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (h === 0) return `${m}min`;
    if (m === 0) return `${h}h`;
    return `${h}h${String(m).padStart(2, "0")}`;
  }

  const IMPORTANCE_BADGE_VARIANT = { essencial: "accent", importante: "info", opcional: "neutral" };

  /* ------------------------------------------------------------------ *
   * MEDIDOR RADIAL (meter) — "razão contra um limite", conforme a skill
   * de dataviz: preenchimento na cor de destaque, trilho num tom mais
   * claro da MESMA rampa (nunca um cinza neutro), sem eixo/legenda —
   * o número no centro já é o rótulo.
   * ------------------------------------------------------------------ */
  // tone -> [cor de preenchimento, cor de trilho] — "warning"/"danger"
  // entraram na Fase 4 (ritmo de metas: no ritmo/atenção/atrasado), mas
  // servem qualquer medidor futuro que precise dos mesmos 5 tons já
  // usados no resto do app (nunca uma cor nova fora da rampa).
  const RING_TONE_VARS = {
    success: ["var(--success)", "var(--success-soft)"],
    info: ["var(--accent-2)", "var(--accent-2-soft)"],
    warning: ["var(--warning)", "var(--warning-soft)"],
    danger: ["var(--danger)", "var(--danger-soft)"],
    accent: ["var(--accent)", "var(--accent-soft)"],
  };
  function progressRing({ pct, size = 76, stroke = 7, tone = "accent", centerLabel = "", subLabel = "" }) {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const clamped = global.App.Utils.clamp(pct, 0, 100);
    const offset = c * (1 - clamped / 100);
    const [colorVar, trackVar] = RING_TONE_VARS[tone] || RING_TONE_VARS.accent;
    const cx = size / 2;
    const label = centerLabel !== "" ? centerLabel : `${Math.round(clamped)}%`;
    return `
      <div class="progress-ring" style="width:${size}px;height:${size}px;">
        <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
          <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${trackVar}" stroke-width="${stroke}"/>
          <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${colorVar}" stroke-width="${stroke}"
            stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
            transform="rotate(-90 ${cx} ${cx})" class="progress-ring-fill"/>
        </svg>
        <div class="progress-ring-label">
          <strong>${esc(label)}</strong>
          ${subLabel ? `<span>${esc(subLabel)}</span>` : ""}
        </div>
      </div>`;
  }

  /* ------------------------------------------------------------------ *
   * CARD DE ATIVIDADE — a peça central da tela Hoje.
   * ------------------------------------------------------------------ */
  function activityCard(a) {
    const timeRange = formatTimeRange(a.startTime, a.endTime);
    const duration = formatDuration(a.startTime, a.endTime);
    return `
      <div class="activity-card importance-${a.importance} ${a.done ? "is-done" : ""}" data-activity-id="${esc(a.id)}">
        <button type="button" class="activity-check ${a.done ? "is-done" : ""}" data-action="toggleActivity" data-kind="${a.kind}" data-ref="${esc(a.refId)}" data-date="${esc(a.dueDate)}"
          aria-pressed="${a.done}" aria-label="${a.done ? "Marcar como não concluída" : "Concluir"}">
          ${a.done ? icon("check") : ""}
        </button>
        <div class="activity-icon ${a.kind === "habit" ? "tone-info" : ""}">${icon(a.icon)}</div>
        <div class="activity-body">
          <div class="activity-title">${esc(a.title)}</div>
          <div class="activity-meta">
            ${timeRange ? `<span class="activity-meta-item">${icon("clock")}${esc(timeRange)}</span>` : ""}
            ${duration ? `<span class="activity-meta-item num">${esc(duration)}</span>` : ""}
            ${badge({ label: IMPORTANCE_LABEL[a.importance], variant: IMPORTANCE_BADGE_VARIANT[a.importance] })}
            ${a.status === "atrasada" ? badge({ label: "Atrasada", variant: "danger" }) : ""}
          </div>
          ${a.context ? `<div class="activity-context">${esc(a.context)}</div>` : ""}
        </div>
      </div>`;
  }

  const IMPORTANCE_LABEL = { essencial: "Essencial", importante: "Importante", opcional: "Opcional" };

  /* ------------------------------------------------------------------ *
   * FOCO AGORA
   * ------------------------------------------------------------------ */
  function focusNowCard({ current, next }) {
    if (!current && !next) {
      return `
        <div class="card focus-now-card focus-now-empty">
          <span class="focus-eyebrow">${icon("crosshair")} FOCO AGORA</span>
          <p class="focus-empty-msg">Você não possui uma atividade planejada agora. Nenhuma atividade com horário está pendente hoje.</p>
        </div>`;
    }
    const nextRow = next
      ? `<div class="focus-next-row">${icon("chevronRight")}<span>A seguir: <strong>${esc(next.title)}</strong> às ${esc(next.startTime)}</span></div>`
      : `<div class="focus-next-row">${icon("chevronRight")}<span>Última atividade com horário marcado hoje.</span></div>`;

    if (!current) {
      return `
        <div class="card focus-now-card focus-now-empty">
          <span class="focus-eyebrow">${icon("crosshair")} FOCO AGORA</span>
          <p class="focus-empty-msg">Você não possui uma atividade planejada agora.</p>
          ${nextRow}
        </div>`;
    }

    const duration = formatDuration(current.startTime, current.endTime);
    return `
      <div class="card focus-now-card">
        <span class="focus-eyebrow">${icon("crosshair")} FOCO AGORA</span>
        <div class="focus-main">
          <div class="focus-icon ${current.kind === "habit" ? "tone-info" : ""}">${icon(current.icon)}</div>
          <div>
            <div class="focus-title">${esc(current.title)}</div>
            <div class="focus-meta">
              <span class="activity-meta-item">${icon("clock")}${esc(formatTimeRange(current.startTime, current.endTime))}</span>
              ${duration ? `<span class="activity-meta-item num">${esc(duration)}</span>` : ""}
              ${badge({ label: IMPORTANCE_LABEL[current.importance], variant: IMPORTANCE_BADGE_VARIANT[current.importance] })}
            </div>
          </div>
          ${button({ label: "Concluir", variant: "primary", size: "sm", iconName: "check", action: "toggleActivity", data: { kind: current.kind, ref: current.refId, date: current.dueDate } })}
        </div>
        ${nextRow}
      </div>`;
  }

  /* ------------------------------------------------------------------ *
   * PRIORIDADES — chip compacto por atividade essencial
   * ------------------------------------------------------------------ */
  function priorityChip(a) {
    return `
      <button type="button" class="priority-chip ${a.done ? "is-done" : ""}" data-action="toggleActivity" data-kind="${a.kind}" data-ref="${esc(a.refId)}" data-date="${esc(a.dueDate)}">
        <span class="priority-chip-check">${a.done ? icon("check") : ""}</span>
        <span class="priority-chip-label">${esc(a.title)}</span>
        ${a.startTime ? `<span class="priority-chip-time num">${esc(a.startTime)}</span>` : ""}
      </button>`;
  }

  function insightLine(text) {
    return `<div class="insight-line">${icon("sparkles")}<span>${esc(text)}</span></div>`;
  }

  /* ------------------------------------------------------------------ *
   * FASE 6 — INSIGHTS (motor de regras local)
   * Cartão mais rico que insightLine: cor por severidade, sugestão
   * opcional (sempre como recomendação, nunca julgamento) e um jeito de
   * dispensar — persistido, não só escondido na sessão.
   * ------------------------------------------------------------------ */
  const INSIGHT_SEVERITY_ICON = { info: "sparkles", atencao: "alert", positivo: "check" };
  const INSIGHT_SEVERITY_TONE = { info: "info", atencao: "warning", positivo: "success" };
  function insightCard(insight) {
    const tone = INSIGHT_SEVERITY_TONE[insight.severity] || "info";
    return `
      <div class="card insight-card insight-card-${tone}">
        <div class="insight-card-icon tone-${tone}">${icon(INSIGHT_SEVERITY_ICON[insight.severity] || "sparkles")}</div>
        <div class="insight-card-body">
          <p>${esc(insight.message)}</p>
          ${
            insight.suggestion
              ? `<div class="insight-card-actions">${button({ label: insight.suggestion.label, variant: "ghost", size: "sm", action: insight.suggestion.action, data: insight.suggestion.data || {} })}</div>`
              : ""
          }
        </div>
        <button type="button" class="icon-btn insight-card-dismiss" data-action="dismissInsight" data-insight-id="${esc(insight.id)}" aria-label="Dispensar insight">${icon("close")}</button>
      </div>`;
  }

  /* ======================================================================
     FASE 2 — PLANEJAMENTO
     ====================================================================== */

  /* ---- Navegação entre dias (Timeline) ---- */
  function dayNav({ dateISO }) {
    const isToday = dateISO === global.App.Utils.todayISO();
    const label = isToday ? "Hoje" : global.App.Utils.capitalize(global.App.Utils.formatDateLong(dateISO));
    return `
      <div class="day-nav">
        <button type="button" class="icon-btn" data-action="planShiftDay" data-delta="-1" aria-label="Dia anterior">${icon("chevronLeft")}</button>
        <div class="day-nav-label">
          <strong>${esc(label)}</strong>
          ${!isToday ? `<button type="button" class="day-nav-today" data-action="planJumpToday">Ir para hoje</button>` : ""}
        </div>
        <button type="button" class="icon-btn" data-action="planShiftDay" data-delta="1" aria-label="Próximo dia">${icon("chevronRight")}</button>
      </div>`;
  }

  const TIMELINE_STATUS_META = {
    concluida: { label: "Concluída", variant: "success" },
    em_andamento: { label: "Em andamento", variant: "warning" },
    atrasada: { label: "Atrasada", variant: "danger" },
    pulada: { label: "Pulada", variant: "neutral" },
  };

  // Item da Timeline (item 3): horário, duração, status e importância —
  // mais as ações rápidas de edição/reagendamento/pular (itens 5 e 6).
  // Hábitos aparecem na lista (mesma fonte que a tela Hoje), mas sem essas
  // ações — hábito em si só ganha CRUD na Fase 3.
  function timelineItem(a) {
    const timeRange = formatTimeRange(a.startTime, a.endTime);
    const duration = formatDuration(a.startTime, a.endTime) || (a.plannedDurationMin ? `${a.plannedDurationMin}min` : "");
    const statusMeta = TIMELINE_STATUS_META[a.displayStatus];
    const done = a.status === "concluida";
    const skipped = a.status === "pulada";
    return `
      <div class="timeline-item importance-${a.importance} ${done ? "is-done" : ""} ${skipped ? "is-skipped" : ""} ${a.isNext ? "is-next" : ""}" data-activity-id="${esc(a.id)}">
        <div class="timeline-time-col">
          ${timeRange ? `<span class="num">${esc(timeRange)}</span>` : `<span class="timeline-no-time">${icon("clock")}</span>`}
          ${duration ? `<span class="timeline-duration num">${esc(duration)}</span>` : ""}
        </div>
        <button type="button" class="activity-check ${done ? "is-done" : ""}" data-action="toggleActivity" data-kind="${a.kind}" data-ref="${esc(a.refId)}" data-date="${esc(a.dueDate)}"
          aria-pressed="${done}" aria-label="${done ? "Marcar como não concluída" : "Concluir"}">
          ${done ? icon("check") : ""}
        </button>
        <div class="timeline-body">
          <div class="timeline-title-row">
            <span class="timeline-title">${esc(a.title)}</span>
            ${a.isNext ? badge({ label: "Próxima", variant: "accent" }) : ""}
            ${statusMeta ? badge({ label: statusMeta.label, variant: statusMeta.variant }) : ""}
            ${badge({ label: IMPORTANCE_LABEL[a.importance], variant: IMPORTANCE_BADGE_VARIANT[a.importance] })}
          </div>
          ${a.context ? `<div class="activity-context">${esc(a.context)}</div>` : ""}
        </div>
        ${
          a.kind === "task"
            ? `<div class="timeline-actions">
                ${iconActionBtn({ iconName: "pencil", action: "openActivityModal", data: { taskId: a.refId }, label: "Editar" })}
                ${iconActionBtn({ iconName: "reschedule", action: "openRescheduleModal", data: { taskId: a.refId }, label: "Reagendar" })}
                ${iconActionBtn({ iconName: "skip", action: "toggleSkipActivity", data: { taskId: a.refId }, label: skipped ? "Reabrir" : "Marcar como não realizada" })}
              </div>`
            : ""
        }
      </div>`;
  }

  /* ---- Inbox (item 9) ---- */
  function inboxPanel(items) {
    return `
      <div class="card inbox-panel">
        <div class="inbox-header">
          <span class="hoje-section-title" style="margin:0;">${icon("inbox")} Inbox</span>
          <span class="text-tertiary" style="font-size:11.5px;">Capture rápido, decida depois.</span>
        </div>
        <div class="inbox-add-row">
          <input type="text" id="inboxQuickInput" class="text-input" style="flex:1;" placeholder="ex.: Marcar dentista" maxlength="120">
          ${button({ label: "Adicionar", variant: "ghost", size: "sm", iconName: "plus", action: "submitInboxItem" })}
        </div>
        ${
          items.length === 0
            ? `<div class="text-tertiary" style="font-size:12px;padding:4px 2px 2px;">Nada capturado por aqui ainda.</div>`
            : `<div class="inbox-list">${items
                .map(
                  (i) => `
              <div class="inbox-row">
                <span class="inbox-text">${esc(i.text)}</span>
                <div class="inbox-row-actions">
                  ${iconActionBtn({ iconName: "chevronRight", action: "openActivityModal", data: { inboxId: i.id }, label: "Transformar em atividade" })}
                  ${iconActionBtn({ iconName: "close", action: "removeInboxItem", data: { inboxId: i.id }, label: "Remover" })}
                </div>
              </div>`
                )
                .join("")}</div>`
        }
      </div>`;
  }

  /* ---- Hábitos programados para o dia planejado (Prepare seu amanhã) ---- */
  function habitPlanRow({ habit, skipped, dateISO }) {
    return `
      <div class="habit-plan-row ${skipped ? "is-skipped" : ""}">
        <div class="activity-icon tone-info">${icon(habit.icon && ICONS[habit.icon] ? habit.icon : "habitos")}</div>
        <div class="habit-plan-body">
          <span class="habit-plan-name">${esc(habit.name)}</span>
          <span class="text-tertiary" style="font-size:11.5px;">${esc(global.App.Selectors.frequencyLabel(habit.frequency))} · incluído automaticamente</span>
        </div>
        ${button({
          label: skipped ? "Reativar" : "Não fazer",
          variant: "ghost",
          size: "sm",
          action: "toggleHabitSkipForDate",
          data: { habitId: habit.id, date: dateISO },
        })}
      </div>`;
  }

  /* ---- Formulário de nova atividade / edição rápida (modal) ---- */
  const IMPORTANCE_OPTIONS = [
    { id: "essencial", label: "Essencial" },
    { id: "importante", label: "Importante" },
    { id: "opcional", label: "Opcional" },
  ];
  const WEEKDAY_LETTERS = ["D", "S", "T", "Q", "Q", "S", "S"];

  function importanceRadios(current) {
    current = current || "importante";
    return `
      <div class="segmented">
        ${IMPORTANCE_OPTIONS.map(
          (o) => `
          <label class="segmented-radio">
            <input type="radio" name="actImportance" value="${o.id}" ${o.id === current ? "checked" : ""}>
            <span>${o.label}</span>
          </label>`
        ).join("")}
      </div>`;
  }

  function durationChips() {
    return `
      <div class="duration-chips">
        ${[15, 30, 45, 60, 90].map((m) => `<button type="button" class="chip-btn" data-action="setDurationChip" data-min="${m}">${m}min</button>`).join("")}
      </div>`;
  }

  // Vínculo com hábito (item 2 + correção pós-Fase 3): a inferência por
  // nome cobre o caso comum sozinha, mas quando o título não bate com o
  // nome do hábito (ex.: hábito "Ler 20 minutos", atividade "Leitura da
  // tarde"), o usuário precisa poder escolher/corrigir isso à mão — senão
  // o hábito vira uma atividade "fantasma" duplicada no dia. "Detectar
  // automaticamente" preserva o fluxo original (sem pedir confirmação
  // manual na maioria dos casos); as outras opções são o escape hatch.
  function habitLinkSelect({ habits, selected, includeAuto }) {
    return `
      <select id="actHabitId" class="text-input" style="width:100%;">
        ${includeAuto ? `<option value="__auto__" ${selected === "__auto__" ? "selected" : ""}>Detectar automaticamente</option>` : ""}
        <option value="" ${selected === "" ? "selected" : ""}>Nenhum hábito</option>
        ${habits.map((h) => `<option value="${esc(h.id)}" ${selected === h.id ? "selected" : ""}>${esc(h.name)}</option>`).join("")}
      </select>`;
  }

  // Vínculo com meta (Fase 4, item 6/7): opcional, sem inferência — a
  // tarefa só avança uma meta quando o usuário escolhe explicitamente.
  function goalLinkSelect({ goals, selected }) {
    return `
      <select id="actGoalId" class="text-input" style="width:100%;">
        <option value="" ${!selected ? "selected" : ""}>Nenhuma</option>
        ${goals.map((g) => `<option value="${esc(g.id)}" ${selected === g.id ? "selected" : ""}>${esc(g.title)}</option>`).join("")}
      </select>`;
  }

  // Criação (item 1): nome + horário + duração + importância na frente;
  // contexto, recorrência (item 8) e o vínculo com hábito ficam discretos
  // dentro de "Mais opções".
  function activityForm({ dueDate, inboxText = "", inboxId = "", habits = [], goals = [] }) {
    return `
      <form id="activityForm">
        <input type="hidden" id="actDueDate" value="${esc(dueDate)}">
        <input type="hidden" id="actInboxId" value="${esc(inboxId)}">
        <div class="form-row">
          <label for="actTitle">Nome</label>
          <input type="text" id="actTitle" class="text-input" style="width:100%" value="${esc(inboxText)}" placeholder="O que você vai fazer?" maxlength="80">
        </div>
        <div class="form-row form-row-split">
          <div>
            <label for="actStart">Horário (opcional)</label>
            <input type="time" id="actStart" class="text-input">
          </div>
          <div>
            <label for="actDuration">Duração (opcional)</label>
            <input type="number" id="actDuration" class="text-input" min="0" step="5" placeholder="min">
            ${durationChips()}
          </div>
        </div>
        <div class="form-row">
          <label>Importância</label>
          ${importanceRadios("importante")}
        </div>
        <details class="form-more">
          <summary>Mais opções</summary>
          <div class="form-row">
            <label for="actContext">Contexto (opcional)</label>
            <input type="text" id="actContext" class="text-input" style="width:100%" maxlength="80" placeholder="ex.: com o personal">
          </div>
          <div class="form-row">
            <label>${icon("repeat")} Repetir</label>
            <div class="segmented">
              <label class="segmented-radio"><input type="radio" name="actRecurrence" value="none" checked><span>Não repete</span></label>
              <label class="segmented-radio"><input type="radio" name="actRecurrence" value="diaria"><span>Todo dia</span></label>
              <label class="segmented-radio"><input type="radio" name="actRecurrence" id="recWeekly" value="semanal"><span>Dias da semana</span></label>
            </div>
            <div class="weekday-picker">
              ${[0, 1, 2, 3, 4, 5, 6]
                .map((d) => `<label class="weekday-chip"><input type="checkbox" name="actWeekday" value="${d}"><span>${WEEKDAY_LETTERS[d]}</span></label>`)
                .join("")}
            </div>
          </div>
          ${
            habits.length
              ? `<div class="form-row">
            <label for="actHabitId">Vincular a hábito</label>
            ${habitLinkSelect({ habits, selected: "__auto__", includeAuto: true })}
          </div>`
              : ""
          }
          ${
            goals.length
              ? `<div class="form-row">
            <label for="actGoalId">Meta relacionada</label>
            ${goalLinkSelect({ goals, selected: "" })}
          </div>`
              : ""
          }
        </details>
      </form>`;
  }

  // Edição rápida (item 5): horário/duração/importância (+ nome) na frente,
  // de propósito bem menor que o formulário de criação — o vínculo com
  // hábito fica visível (não escondido em "Mais opções") porque é
  // exatamente o que corrige uma atividade que devia estar ligada a um
  // hábito e não ficou (ou o inverso); o vínculo com meta fica discreto
  // dentro de "Mais opções", já que não tem o mesmo problema a corrigir.
  function quickEditForm({ task, habits = [], goals = [] }) {
    return `
      <form id="activityForm">
        <input type="hidden" id="actTaskId" value="${esc(task.id)}">
        <div class="form-row">
          <label for="actTitle">Nome</label>
          <input type="text" id="actTitle" class="text-input" style="width:100%" value="${esc(task.title)}" maxlength="80">
        </div>
        <div class="form-row form-row-split">
          <div>
            <label for="actStart">Horário</label>
            <input type="time" id="actStart" class="text-input" value="${task.startTime || ""}">
          </div>
          <div>
            <label for="actDuration">Duração (min)</label>
            <input type="number" id="actDuration" class="text-input" min="0" step="5" value="${task.plannedDurationMin ?? ""}">
            ${durationChips()}
          </div>
        </div>
        <div class="form-row">
          <label>Importância</label>
          ${importanceRadios(task.importance)}
        </div>
        <div class="form-row">
          <label for="actActualDuration">Duração real (opcional)</label>
          <input type="number" id="actActualDuration" class="text-input" min="0" step="5" value="${task.actualDurationMin ?? ""}" placeholder="min">
          <span class="text-tertiary" style="font-size:11.5px;">Quanto tempo levou de verdade — alimenta os insights de planejamento × execução, na Evolução.</span>
        </div>
        ${
          habits.length
            ? `<div class="form-row">
          <label for="actHabitId">Hábito vinculado</label>
          ${habitLinkSelect({ habits, selected: task.habitId || "", includeAuto: false })}
        </div>`
            : ""
        }
        ${
          goals.length
            ? `<details class="form-more" ${task.goalId ? "open" : ""}>
          <summary>Meta relacionada (opcional)</summary>
          <div class="form-row">
            ${goalLinkSelect({ goals, selected: task.goalId || "" })}
          </div>
        </details>`
            : ""
        }
      </form>`;
  }

  /* ======================================================================
     FASE 3 — HÁBITOS
     ====================================================================== */

  const HABIT_WEEKDAY_LETTERS_MON = ["S", "T", "Q", "Q", "S", "S", "D"]; // seg..dom

  // Card do dashboard (item 3): aderência dos últimos 30 dias no medidor
  // radial já existente (Fase 1), sequência atual em destaque, e um resumo
  // da semana em 7 pontinhos — tudo pensado pra ler em poucos segundos.
  function habitCard({ habit, adherence30, streaks, week }) {
    return `
      <div class="card card-hover habit-card" data-action="habitOpenDetail" data-habit-id="${esc(habit.id)}" role="button" tabindex="0">
        <div class="habit-card-top">
          <div class="activity-icon tone-info">${icon(habit.icon && ICONS[habit.icon] ? habit.icon : "habitos")}</div>
          <div class="habit-card-title">
            <strong>${esc(habit.name)}</strong>
            <span class="text-tertiary">${esc(global.App.Selectors.frequencyLabel(habit.frequency))}</span>
          </div>
          ${streaks.current > 0 ? `<span class="streak-pill">${icon("sparkles")}${streaks.current}</span>` : ""}
        </div>
        <div class="habit-card-mid">
          ${progressRing({ pct: adherence30 || 0, size: 56, stroke: 6, tone: "accent", centerLabel: adherence30 === null ? "—" : undefined })}
          <div class="habit-card-stats">
            <div><strong>${adherence30 === null ? "—" : adherence30 + "%"}</strong><span>Aderência 30d</span></div>
            <div><strong>${streaks.best}</strong><span>Melhor sequência</span></div>
          </div>
        </div>
        <div class="habit-week-row">
          ${week.map((d, i) => `<span class="habit-week-dot status-${d.status}" title="${esc(HABIT_WEEKDAY_LETTERS_MON[i])}"></span>`).join("")}
        </div>
      </div>`;
  }

  const HEATMAP_STATUS_LABEL = {
    concluido: "Concluído",
    parcial: "Parcial",
    not_marked: "Sem marcação",
    nao_realizado: "Não realizado",
    not_scheduled: "Fora da frequência",
    future: "Ainda não chegou",
    before_creation: "Antes do hábito existir",
    out_of_range: "",
  };
  const HEATMAP_CLICKABLE_STATUSES = ["not_marked", "concluido", "parcial", "nao_realizado"];

  // Calendário de aderência (item 4) — inspirado em heatmap (semanas em
  // colunas, dias da semana em linhas), com paleta e cantos arredondados
  // do próprio design system, não uma cópia de outra interface. Dias
  // dentro do período e não-futuros são clicáveis: cicla não
  // marcado -> concluído -> não realizado, pra corrigir um dia esquecido.
  function habitHeatmap({ habitId, weeks }) {
    return `
      <div class="heatmap-wrap">
        <div class="heatmap-weekday-col">
          ${HABIT_WEEKDAY_LETTERS_MON.map((l, i) => `<span class="${i % 2 === 0 ? "" : "is-dim"}">${l}</span>`).join("")}
        </div>
        <div class="heatmap-grid">
          ${weeks
            .map(
              (week) => `
            <div class="heatmap-col">
              ${week
                .map((d) => {
                  const clickable = HEATMAP_CLICKABLE_STATUSES.includes(d.status);
                  return `<span class="heatmap-cell status-${d.status}" ${clickable ? `data-action="cycleHabitDayStatus" data-habit-id="${esc(habitId)}" data-date="${esc(d.dateISO)}"` : ""} title="${esc(d.dateISO)}${HEATMAP_STATUS_LABEL[d.status] ? " — " + esc(HEATMAP_STATUS_LABEL[d.status]) : ""}"></span>`;
                })
                .join("")}
            </div>`
            )
            .join("")}
        </div>
      </div>`;
  }

  function habitStatsRow({ overall, monthly, weekly, current, best }) {
    const tile = (label, value) => `<div class="habit-stat-tile"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`;
    return `
      <div class="habit-stats-row">
        ${tile("Aderência geral", overall === null ? "—" : overall + "%")}
        ${tile("Aderência mensal", monthly === null ? "—" : monthly + "%")}
        ${tile("Aderência semanal", weekly === null ? "—" : weekly + "%")}
        ${tile("Sequência atual", `${current} ${current === 1 ? "dia" : "dias"}`)}
        ${tile("Melhor sequência", `${best} ${best === 1 ? "dia" : "dias"}`)}
      </div>`;
  }

  // Linguagem não-punitiva ao quebrar uma sequência (item 6) — mesma
  // frase literal do briefing.
  function streakBreakBanner(days) {
    return `<div class="insight-line streak-break-banner">${icon("sparkles")}<span>Sua sequência de ${days} ${days === 1 ? "dia" : "dias"} terminou. Um novo ciclo começa hoje.</span></div>`;
  }

  const HABIT_ICON_CHOICES = ["habitos", "book", "droplet", "dumbbell", "brain", "heart", "sun", "moonStars", "sparkles", "flag"];

  function iconPicker(current) {
    current = current && HABIT_ICON_CHOICES.includes(current) ? current : "habitos";
    return `
      <div class="icon-picker">
        ${HABIT_ICON_CHOICES.map(
          (name) => `
          <label class="icon-radio">
            <input type="radio" name="habitIcon" value="${name}" ${name === current ? "checked" : ""}>
            <span>${icon(name)}</span>
          </label>`
        ).join("")}
      </div>`;
  }

  // Cadastro (item 1): nome, ícone, frequência e horário sugerido na
  // frente; meta relacionada fica opcional e discreta ("não exigir
  // associação com uma meta").
  function habitForm({ habit, goals = [] }) {
    const freq = (habit && habit.frequency) || { type: "diaria" };
    const days = freq.type === "semanal" && Array.isArray(freq.days) ? freq.days : [];
    const count = freq.type === "x_por_semana" ? freq.count || 3 : 3;
    return `
      <form id="habitForm">
        <input type="hidden" id="habitId" value="${habit ? esc(habit.id) : ""}">
        <div class="form-row">
          <label for="habitName">Nome</label>
          <input type="text" id="habitName" class="text-input" style="width:100%" value="${habit ? esc(habit.name) : ""}" placeholder="ex.: Ler 20 minutos" maxlength="60">
        </div>
        <div class="form-row">
          <label>Ícone</label>
          ${iconPicker(habit ? habit.icon : "habitos")}
        </div>
        <div class="form-row">
          <label>Frequência</label>
          <div class="segmented">
            <label class="segmented-radio"><input type="radio" name="habitFreqType" value="diaria" ${freq.type === "diaria" ? "checked" : ""}><span>Todo dia</span></label>
            <label class="segmented-radio"><input type="radio" name="habitFreqType" id="habitFreqWeekly" value="semanal" ${freq.type === "semanal" ? "checked" : ""}><span>Dias da semana</span></label>
            <label class="segmented-radio"><input type="radio" name="habitFreqType" id="habitFreqCount" value="x_por_semana" ${freq.type === "x_por_semana" ? "checked" : ""}><span>X vezes/semana</span></label>
          </div>
          <div class="weekday-picker">
            ${[0, 1, 2, 3, 4, 5, 6]
              .map((d) => `<label class="weekday-chip"><input type="checkbox" name="habitWeekday" value="${d}" ${days.includes(d) ? "checked" : ""}><span>${["D", "S", "T", "Q", "Q", "S", "S"][d]}</span></label>`)
              .join("")}
          </div>
          <div class="freq-count-picker">
            <input type="number" id="habitFreqCountInput" class="text-input" min="1" max="7" value="${count}" style="width:74px;">
            <span class="text-tertiary" style="font-size:12px;">vezes por semana</span>
          </div>
        </div>
        <div class="form-row form-row-split">
          <div>
            <label for="habitTime">Horário sugerido (opcional)</label>
            <input type="time" id="habitTime" class="text-input" value="${habit && habit.preferredTime ? habit.preferredTime : ""}">
          </div>
          <div>
            <label>Importância</label>
            ${importanceRadios(habit ? habit.importance : "importante")}
          </div>
        </div>
        <details class="form-more" ${habit && habit.goalId ? "open" : ""}>
          <summary>Meta relacionada (opcional)</summary>
          <div class="form-row">
            <select id="habitGoalId" class="text-input" style="width:100%;">
              <option value="">Nenhuma</option>
              ${goals.map((g) => `<option value="${esc(g.id)}" ${habit && habit.goalId === g.id ? "selected" : ""}>${esc(g.title)}</option>`).join("")}
            </select>
          </div>
        </details>
      </form>`;
  }

  /* ======================================================================
     FASE 4 — METAS
     ====================================================================== */

  const GOAL_TYPE_ICON = {
    quantitativa: "evolucao",
    percentual: "metas",
    marco: "flag",
    data: "planejamento",
    conclusao: "check",
    qualitativa: "sparkles",
  };
  const GOAL_STATUS_LABEL = { ativa: "Em andamento", pausada: "Pausada", concluida: "Concluída", abandonada: "Abandonada" };
  const PACE_STATUS_META = {
    no_ritmo: { label: "No ritmo", variant: "success" },
    atencao: { label: "Atenção", variant: "warning" },
    atrasado: { label: "Atrasado", variant: "danger" },
  };
  function paceTone(pace) {
    if (!pace) return "accent";
    return pace.status === "atrasado" ? "danger" : pace.status === "atencao" ? "warning" : "success";
  }

  // Texto cru por trás do número (item 4: "quanto já avancei"), no formato
  // que faz sentido pro TIPO — nunca uma % genérica onde não existe.
  function goalValueLine(goal) {
    const Sel = global.App.Selectors;
    if (goal.type === "quantitativa") {
      if (typeof goal.targetValue !== "number") return "Sem valor-alvo definido";
      const current = typeof goal.currentValue === "number" ? goal.currentValue : 0;
      const unit = goal.unit ? ` ${goal.unit}` : "";
      return `${current}${unit} de ${goal.targetValue}${unit}`;
    }
    if (goal.type === "percentual") {
      if (typeof goal.targetValue !== "number") return "Sem valor-alvo definido";
      const current = typeof goal.currentValue === "number" ? goal.currentValue : 0;
      return `${current}% de ${goal.targetValue}%`;
    }
    if (goal.type === "marco") {
      const total = (goal.milestones || []).length;
      const done = (goal.milestones || []).filter((m) => m.done).length;
      return total === 0 ? "Nenhum marco definido ainda" : `${done} de ${total} marcos`;
    }
    if (goal.type === "conclusao") return goal.status === "concluida" ? "Concluída" : "Não concluída";
    if (goal.type === "data") {
      const linked = Sel.getGoalLinkedTasks(goal.id);
      return linked.length === 0 ? "Nenhuma tarefa vinculada" : `${linked.filter((t) => t.status === "concluida").length} de ${linked.length} tarefas concluídas`;
    }
    return GOAL_STATUS_LABEL[goal.status] || "";
  }

  function formatPaceRate(n) {
    if (!isFinite(n)) return "0";
    return String(Math.round(n * 100) / 100);
  }

  // Card do painel principal (item 4): nome, progresso, prazo, indicador
  // de status e atividade recente — tudo lido pronto de App.Selectors,
  // nada recalculado aqui.
  function goalCard({ goal, progress, pace, deadlineInfo, recent }) {
    const iconName = GOAL_TYPE_ICON[goal.type] || "metas";
    const paceMeta = pace ? PACE_STATUS_META[pace.status] : null;
    return `
      <div class="card card-hover goal-card" data-action="metaOpenDetail" data-goal-id="${esc(goal.id)}" role="button" tabindex="0">
        <div class="goal-card-top">
          <div class="activity-icon tone-info">${icon(iconName)}</div>
          <div class="goal-card-title">
            <strong>${esc(goal.title)}</strong>
            <span class="text-tertiary">${esc(global.App.Models.GOAL_TYPE_LABEL[goal.type] || "")}</span>
          </div>
          ${paceMeta ? badge({ label: paceMeta.label, variant: paceMeta.variant }) : ""}
        </div>
        <div class="goal-card-mid">
          ${
            progress !== null
              ? progressRing({ pct: progress, size: 56, stroke: 6, tone: paceTone(pace) })
              : `<div class="goal-card-ring-placeholder">${icon(iconName)}</div>`
          }
          <div class="goal-card-stats">
            <div class="goal-card-value-line">${esc(goalValueLine(goal))}</div>
            ${deadlineInfo ? `<div class="goal-card-deadline tone-${deadlineInfo.tone}">${esc(deadlineInfo.label)}</div>` : `<div class="text-tertiary" style="font-size:11px;">Sem prazo definido</div>`}
          </div>
        </div>
        <div class="goal-card-activity">${recent ? `${icon("sparkles")}<span>${esc(recent.title)}</span>` : `<span class="text-tertiary">Nenhuma atividade vinculada ainda</span>`}</div>
      </div>`;
  }

  // Linha de estatísticas de ritmo (item 5) — mesma peça visual das
  // estatísticas de hábito (Fase 3), reaproveitada porque a forma
  // ("4 números pequenos + rótulo") já é a certa pra isso.
  function goalPaceStatsRow(pace) {
    const meta = PACE_STATUS_META[pace.status];
    const tile = (label, value) => `<div class="habit-stat-tile"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`;
    return `
      <div class="habit-stats-row">
        ${tile("Progresso atual", pace.currentPct + "%")}
        ${tile("Progresso esperado", pace.expectedPct + "%")}
        ${tile("Ritmo necessário", formatPaceRate(pace.paceNeeded) + "/dia")}
        ${tile("Ritmo atual", formatPaceRate(pace.paceActual) + "/dia")}
      </div>
      <div class="goal-pace-status">${badge({ label: meta.label, variant: meta.variant })}</div>`;
  }

  // Edição do valor atual (quantitativa/percentual) — mesmo padrão do
  // campo de nome em Ajustes (data-action-blur): sem botão "salvar"
  // separado, sai do campo e já fica salvo.
  function goalValueEditor(goal) {
    const targetLabel = typeof goal.targetValue === "number" ? goal.targetValue + (goal.type === "percentual" ? "%" : goal.unit ? " " + goal.unit : "") : "—";
    return `
      <div class="field-inline goal-value-editor">
        <label for="goalValueInput" class="text-tertiary" style="font-size:12.5px;">Valor atual</label>
        <input type="number" id="goalValueInput" class="text-input" style="width:120px;" step="any" value="${goal.currentValue ?? 0}" data-action-blur="updateGoalValueInline" data-goal-id="${esc(goal.id)}">
        <span class="text-tertiary" style="font-size:12.5px;">de ${esc(String(targetLabel))}</span>
      </div>`;
  }

  /* ---- Marcos (tipo 'marco') ---- */
  function milestoneList({ goalId, milestones }) {
    if (!milestones.length) {
      return `<div class="text-tertiary" style="font-size:12px;padding:4px 2px;">Nenhum marco definido ainda.</div>`;
    }
    return `<div class="milestone-list">${milestones
      .map(
        (m) => `
      <div class="milestone-row">
        <button type="button" class="activity-check ${m.done ? "is-done" : ""}" data-action="toggleMilestoneAction" data-goal-id="${esc(goalId)}" data-milestone-id="${esc(m.id)}" aria-pressed="${m.done}" aria-label="${m.done ? "Marcar como não concluído" : "Concluir marco"}">
          ${m.done ? icon("check") : ""}
        </button>
        <span class="milestone-label ${m.done ? "is-done" : ""}">${esc(m.label)}</span>
        ${iconActionBtn({ iconName: "close", action: "removeMilestoneAction", data: { goalId, milestoneId: m.id }, label: "Remover marco" })}
      </div>`
      )
      .join("")}</div>`;
  }

  function milestoneAddRow(goalId) {
    return `
      <div class="milestone-add-row">
        <input type="text" id="milestoneInput" class="text-input" style="flex:1;" placeholder="ex.: Revisar com mentor" maxlength="100">
        ${button({ label: "Adicionar", variant: "ghost", size: "sm", iconName: "plus", action: "addMilestoneAction", data: { goalId } })}
      </div>`;
  }

  /* ---- Tarefas/hábitos vinculados + atividade recente (item 7) ---- */
  const TASK_STATUS_META = {
    concluida: { label: "Concluída", variant: "success" },
    atrasada: { label: "Atrasada", variant: "danger" },
    pulada: { label: "Pulada", variant: "neutral" },
    em_andamento: { label: "Em andamento", variant: "info" },
    pendente: { label: "Pendente", variant: "neutral" },
  };
  function linkedTaskRow(task) {
    const meta = TASK_STATUS_META[task.status] || TASK_STATUS_META.pendente;
    return `
      <div class="goal-linked-row" data-action="metaGoToTask" data-due-date="${esc(task.dueDate || "")}" role="button" tabindex="0">
        <span class="goal-linked-text">${esc(task.title)}</span>
        <span class="text-tertiary" style="font-size:11px;">${task.dueDate ? esc(global.App.Utils.formatDateBR(task.dueDate)) : "Sem data"}</span>
        ${badge({ label: meta.label, variant: meta.variant })}
      </div>`;
  }
  function linkedHabitRow({ habit, adherence30 }) {
    return `
      <div class="goal-linked-row" data-action="metaGoToHabit" data-habit-id="${esc(habit.id)}" role="button" tabindex="0">
        <span class="goal-linked-text">${icon(habit.icon && ICONS[habit.icon] ? habit.icon : "habitos")}${esc(habit.name)}</span>

  // Gráfico de linha minimalista (sem eixo/legenda — mesmo princípio do
  // medidor radial: o número já está no card, o gráfico só mostra a
  // FORMA da tendência). Pontos sem dado (pct null) quebram a linha em
  // vez de virar um 0 enganoso — o traço simplesmente pula esse trecho.
  function sparkline({ series, tone = "accent", height = 44 }) {
    const withData = series.filter((s) => s.pct !== null);
    if (withData.length < 2) {
      return `<div class="evo-sparkline evo-sparkline-empty" style="height:${height}px;">
        <span class="text-tertiary" style="font-size:11px;">Dados insuficientes no período</span>
      </div>`;
    }
    const width = 220;
    const n = series.length;
    const stepX = n > 1 ? width / (n - 1) : width;
    const toY = (pct) => height - (pct / 100) * (height - 6) - 3;
    let lineD = "";
    let started = false;
    let firstX = null;
    let lastX = 0;
    series.forEach((s, i) => {
      const x = i * stepX;
      if (s.pct === null) {
        started = false;
        return;
      }
      if (firstX === null) firstX = x;
      lastX = x;
      lineD += (started ? " L " : "M ") + x.toFixed(1) + " " + toY(s.pct).toFixed(1);
      started = true;
    });
    const areaD = `${lineD} L ${lastX.toFixed(1)} ${height} L ${firstX.toFixed(1)} ${height} Z`;
    const [colorVar] = RING_TONE_VARS[tone] || RING_TONE_VARS.accent;
    return `
      <div class="evo-sparkline" style="height:${height}px;">
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" width="100%" height="${height}">
          <path d="${areaD}" fill="${colorVar}" opacity="0.14" stroke="none"/>
          <path d="${lineD}" fill="none" stroke="${colorVar}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>`;
  }

  const EVO_INDICATOR_META = {

  function trendBadge(trend) {
    if (trend === null) return "";

    const up = trend > 0;

  }
  // Tom por faixa — só pra colorir o card/gráfico, nunca um veredito

  function indicatorTone(value) {

  /* ------------------------------------------------------------------ *
   * TOAST — fila de feedback (sucesso / erro / info)
   * ------------------------------------------------------------------ */
  const Toast = (function () {
    function stackEl() {
      return document.getElementById("toastStack");
    }
    function show(message, type = "success", duration = 3200) {
      const stack = stackEl();
      if (!stack) return;
      const el = document.createElement("div");
      el.className = `toast toast-${type}`;
      const iconName = type === "error" ? "alert" : type === "info" ? "info" : "check";
      el.innerHTML = `<span class="toast-icon">${icon(iconName)}</span><span class="toast-msg">${esc(message)}</span>`;
      el.addEventListener("click", () => dismiss(el));
      stack.appendChild(el);
      requestAnimationFrame(() => el.classList.add("show"));
      const timer = setTimeout(() => dismiss(el), duration);
      el._timer = timer;
    }
    function dismiss(el) {
      if (!el || !el.parentNode) return;
      clearTimeout(el._timer);
      el.classList.remove("show");
      el.classList.add("hide");
      setTimeout(() => el.remove(), 220);
    }
    return { show };
  })();

  /* ------------------------------------------------------------------ *
   * MODAL — genérico, reaproveitável por qualquer confirmação futura
   * ------------------------------------------------------------------ */
  const Modal = (function () {
    function root() {
      return document.getElementById("modalRoot");
    }
    function close() {
      const r = root();
      document.removeEventListener("keydown", onKeydown);
      if (!r) return;
      const overlay = r.querySelector(".modal-overlay");
      if (!overlay) {
        r.innerHTML = "";
        return;
      }
      // Anima a saída antes de remover, pra não "sumir" abruptamente —
      // espelha a entrada (modalOverlayIn/modalCardIn) com uma transição
      // curta de opacidade + escala.
      overlay.classList.add("is-closing");
      overlay.addEventListener(
        "animationend",
        () => {
          if (r.contains(overlay)) r.innerHTML = "";
        },
        { once: true }
      );
      // Rede de segurança caso o evento não dispare (ex.: overlay já removido).
      setTimeout(() => {
        if (r.contains(overlay)) r.innerHTML = "";
      }, 220);
    }
    function onKeydown(e) {
      if (e.key === "Escape") close();
    }
    function open({ title, body, actionsHtml }) {
      const r = root();
      if (!r) return;
      r.innerHTML = `
        <div class="modal-overlay" data-action="modalOverlayClick">
          <div class="modal-card" role="dialog" aria-modal="true" aria-label="${esc(title || "")}">
            ${title ? `<h3>${esc(title)}</h3>` : ""}
            ${body ? `<div class="modal-body">${body}</div>` : ""}
            <div class="modal-actions">${actionsHtml || ""}</div>
          </div>
        </div>`;
      document.addEventListener("keydown", onKeydown);
    }
    return { open, close };
  })();

  // Confirmação simples, usada por qualquer ação destrutiva/irreversível
  // (ex.: remover dados de demonstração).
  function confirmDialog({ title, message, confirmLabel = "Confirmar", danger = false, onConfirmAction }) {
